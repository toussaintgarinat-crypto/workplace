services:

  # ── PostgreSQL pour Keycloak ─────────────────────────────────
  postgres:
    image: postgres:16.14-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_secret}
      POSTGRES_DB: keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Keycloak (realms forge + oria) ──────────────────────────
  # Importe automatiquement forge-realm.json et oria-realm.json au 1er lancement.
  # Joint à proxy_net pour être atteint par les autres stacks (forge::core, etc.)
  # via le hostname `keycloak` (container_name).
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: keycloak
    command: start-dev --import-realm
    ports:
      - "${KEYCLOAK_HOST_PORT:-8080}:8080"
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak_secret}
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      # Nécessaire pour que la console admin accepte les requêtes depuis Traefik
      - KC_PROXY=edge
      # S181 — login DISTANT via le domaine mesh (Caddy termine le TLS). KC_PROXY=edge est
      # déprécié en KC26 → xforwarded pour que Keycloak détecte HTTPS (sinon la page de login
      # rend son form action en http → mixed-content). KC_HOSTNAME fige l'issuer sur le domaine :
      # indispensable car le REFRESH token (émis via :18080/https) est rafraîchi par le Cœur
      # contre l'endpoint interne — sans issuer stable, Keycloak rejette le refresh (boucle login).
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME=https://workplaceagenda.duckdns.org:18080
    volumes:
      - ./realms:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # curl absent de l'image keycloak : check TCP pur via bash /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - default
      - proxy_net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
  proxy_net:
    external: true
    name: proxy_net
