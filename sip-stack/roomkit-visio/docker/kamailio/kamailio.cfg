##############################################################################
# Module Parameters
##############################################################################
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)
modparam("rr", "enable_full_lr", 1)
modparam("usrloc", "db_mode", 0)
modparam("registrar", "max_contacts", 10)

modparam("auth_db", "db_url", KAMAILIO_DB_URL)
modparam("auth_db", "calculate_ha1", 0)
modparam("auth_db", "password_column", "ha1")
modparam("auth_db", "use_domain", 1)
modparam("auth_db", "version_table", 0)

# Dispatcher module - database mode for hot reload
modparam("dispatcher", "db_url", KAMAILIO_DB_URL)
modparam("dispatcher", "table_name", "dispatcher")
modparam("dispatcher", "flags", 2)
modparam("dispatcher", "ds_ping_interval", 30)
modparam("dispatcher", "ds_ping_method", "OPTIONS")
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_probing_threshold", 3)

# RTPEngine module - database mode for hot reload
modparam("rtpengine", "db_url", KAMAILIO_DB_URL)
modparam("rtpengine", "table_name", "rtpengine")
modparam("rtpengine", "setid_default", 1)
modparam("rtpengine", "setid_avp", "$avp(rtpengine_setid)")

# SQLOps module - for querying VM count from database
modparam("sqlops", "sqlcon", "db=>DBURL")

# Dialog module - for persisting variables across dialog (needed for BFCP IP)
modparam("dialog", "db_mode", 0)

# Permissions module - IP whitelist for SIP device access (hot reload with kamcmd permissions.addressReload)
modparam("permissions", "db_url", KAMAILIO_DB_URL)
modparam("permissions", "address_table", "address")
modparam("permissions", "db_mode", 1)

# TLS module - self-signed cert, no client verification
modparam("tls", "tls_method", "TLSv1.2+")
modparam("tls", "certificate", "/etc/kamailio/certs/tls.crt")
modparam("tls", "private_key", "/etc/kamailio/certs/tls.key")
modparam("tls", "verify_certificate", 0)
modparam("tls", "require_certificate", 0)
modparam("tls", "tls_force_run", 1)

# Htable — auth fail counter per IP, auto-expires after 300s
modparam("htable", "htable", "ipban=>size=8;autoexpire=300;")

# Pike module — rate limit per source IP
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 20)
modparam("pike", "remove_latency", 120)

#!ifdef OVH_SIP_SERVER
# UAC module - SIP trunk registration to OVH
modparam("uac", "reg_db_url", KAMAILIO_DB_URL)
modparam("uac", "reg_db_table", "uacreg")
modparam("uac", "reg_contact_addr", "ADVERTISE_IP:5060")
modparam("uac", "reg_timer_interval", 90)
modparam("uac", "reg_retry_interval", 60)
# OVH UDP keepalive - sends OPTIONS every 20s to keep conntrack alive
modparam("rtimer", "timer", "name=ovh_keepalive;interval=20;mode=1")
modparam("rtimer", "exec", "timer=ovh_keepalive;route=OVH_KEEPALIVE")
#!endif

##############################################################################
# Route: LOG_INIT - Extract Via header IP for logging
##############################################################################
route[LOG_INIT] {
    $var(via_addr) = $(hdr(Via)[0]{s.select,1, }{s.select,0,;});
    if (is_present_hf("X-Forwarded-For")) {
        $var(xff) = $hdr(X-Forwarded-For);
    } else {
        $var(xff) = "-";
    }
}

##############################################################################
# Main Request Route
##############################################################################
request_route {
    route(LOG_INIT);
    xlog("L_INFO", ">>> [$ci] $rm $ru src=$si:$sp via=$var(via_addr) xff=$var(xff) proto=$proto from=$fu\n");

    if (!mf_process_maxfwd_header("70")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("L_ERR", ">>> [$ci] ERR malformed src=$si:$sp via=$var(via_addr)\n");
        exit;
    }

    # Block banned IPs (auth brute-force)
    if ($sht(ipban=>$si) != $null && $sht(ipban=>$si) >= 5) {
        xlog("L_WARN", ">>> [$ci] BANNED src=$si:$sp\n");
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        } else {
            sl_send_reply("481", "Transaction Does Not Exist");
        }
        exit;
    }

    # Dispatch in-dialog requests before PIKE rate limiting
    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }

    # Rate limit per source IP (new requests only)
    if (!pike_check_req()) {
        xlog("L_WARN", ">>> [$ci] PIKE blocked src=$si:$sp\n");
        exit;
    }

    if (is_method("SUBSCRIBE")) {
        record_route();
    }

    if (is_method("REGISTER")) {
        route(REGISTRAR);
        exit;
    }

    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    if (is_method("INVITE")) {
        route(INVITE);
        exit;
    }

    sl_send_reply("405", "Method Not Allowed");
}

##############################################################################
# Route: WITHINDLG - In-dialog request handling
##############################################################################
route[WITHINDLG] {
    xlog("L_INFO", ">>> [$ci] WITHINDLG $rm src=$si:$sp via=$var(via_addr)\n");

    # Strip OVH Record-Route headers (sipgo crashes parsing their params)
    if ($dlg_var(skip_record_route) == "1") {
        remove_hf("Record-Route");
    }

    if (loose_route()) {
        # Rewrite destination to LiveKit-SIP internal IP (port 5080 = toward LiveKit-SIP)
        if ($dlg_var(lk_destination) != $null && $ru =~ ":5080") {
            $du = $dlg_var(lk_destination);
            xlog("L_INFO", "    [$ci] WITHINDLG NAT override du=$du for $rm\n");
        }

        if (is_method("ACK")) {
            # Handle delayed offer: ACK may contain SDP answer
            if (has_body("application/sdp")) {
                xlog("L_INFO", "    [$ci] ACK delayed-offer answer - processing with RTPEngine\n");
                xlog("L_INFO", "    [$ci] ACK SDP BEFORE rtpengine:\n$rb\n");
                if ($dlg_var(current_set)) {
                    $avp(rtpengine_setid) = (int)$dlg_var(current_set);
                }
                # For delayed offer, the ACK contains the answer — preserve existing crypto
                $var(rtp_result) = rtpengine_answer("RTP_FLAGS_REINVITE");
                msg_apply_changes();
                xlog("L_INFO", "    [$ci] RTPENGINE ACK answer set=$dlg_var(current_set) result=$var(rtp_result)\n");
                xlog("L_INFO", "    [$ci] ACK SDP AFTER rtpengine:\n$rb\n");
            }
            t_relay();
            exit;
        }

        if (is_method("BYE")) {
            if ($dlg_var(skip_rtpengine) != "1") {
                rtpengine_delete();
            }
        }

        if (is_method("INVITE")) {
            # Clear delayed offer flag — re-INVITEs are normal offer/answer
            $dlg_var(delayed_offer) = "0";

            # Rewrite Contact host:port to source IP:port when Contact has an RFC1918 address.
            if (nat_uac_test("1")) {
                fix_nated_contact();
            }

            if (has_body("application/sdp")) {
                xlog("L_INFO", "    [$ci] re-INVITE offer SDP BEFORE rtpengine:\n$rb\n");

                # NAT rewrite: device's private LAN IP → public NAT IP ($si)
                $var(via_ip) = $(hdr(Via)[0]{s.select,1, }{s.select,0,;}{s.select,0,:});
                if ($var(via_ip) != $si) {
                    xlog("L_INFO", "    [$ci] NAT detected: via=$var(via_ip) src=$si, rewriting SDP c= to $si\n");
                    subst_body("/(o=[^ ]+ [0-9]+ [0-9]+ IN IP4 )[0-9.]+/\\1$si/");
                    subst_body("/c=IN IP4 [0-9.]+/c=IN IP4 $si/g");
                    msg_apply_changes();
                }

                if ($dlg_var(current_set)) {
                    $avp(rtpengine_setid) = (int)$dlg_var(current_set);
                }
                $var(rtp_result) = rtpengine_manage("RTP_FLAGS_REINVITE");
                xlog("L_INFO", "    [$ci] RTPENGINE re-INVITE result=$var(rtp_result)\n");
                msg_apply_changes();
                xlog("L_INFO", "    [$ci] re-INVITE offer SDP AFTER rtpengine:\n$rb\n");
            } else {
                xlog("L_INFO", "    [$ci] re-INVITE no SDP, relay as-is\n");
            }
        }

        if (is_method("UPDATE")) {
            xlog("L_INFO", "    [$ci] UPDATE from=$fu to=$tu src=$si:$sp dst=$du\n");
            xlog("L_INFO", "    [$ci] UPDATE Session-Expires=$hdr(Session-Expires) Supported=$hdr(Supported) Require=$hdr(Require) Contact=$hdr(Contact)\n");
            if (has_body("application/sdp")) {
                if ($dlg_var(current_set)) {
                    $avp(rtpengine_setid) = (int)$dlg_var(current_set);
                }
                # UPDATE: no transport-protocol override to preserve existing SRTP/RTP per side
                $var(rtp_result) = rtpengine_manage("RTP_FLAGS_REINVITE");
                xlog("L_INFO", "    [$ci] RTPENGINE UPDATE set=$dlg_var(current_set) result=$var(rtp_result)\n");
                msg_apply_changes();
            }
        }

        if (is_method("INFO")) {
            if ($hdr(Content-Type) =~ "application/media_control") {
                sl_send_reply("200", "OK");
                exit;
            }
        }

        xlog("L_INFO", "    [$ci] WITHINDLG relay: du=$du ru=$ru method=$rm\n");
        if (!t_relay()) {
            sl_reply_error();
        }
        exit;
    }

    # OVH in-dialog requests (no record_route, no loose_route)
    if ($dlg_var(skip_record_route) == "1") {
        # Override destination to internal LiveKit-SIP IP
        if ($dlg_var(lk_destination) != $null) {
            $du = $dlg_var(lk_destination);
            xlog("L_INFO", "    [$ci] OVH WITHINDLG NAT override du=$du for $rm\n");
        }

        if (is_method("INVITE")) {
            xlog("L_INFO", "    [$ci] OVH re-INVITE relaying\n");
            if (!t_relay()) {
                sl_reply_error();
            }
            exit;
        }

        if (is_method("ACK")) {
            t_relay();
            exit;
        }

        if (is_method("BYE|NOTIFY")) {
            t_relay();
            exit;
        }
    }

    if (is_method("ACK")) {
        exit;
    }

    if (is_method("BYE|NOTIFY")) {
        t_relay();
        exit;
    }

    sl_send_reply("481", "Call/Transaction Does Not Exist");
}

##############################################################################
# Route: REGISTRAR - SIP device registration
##############################################################################
route[REGISTRAR] {
    xlog("L_INFO", ">>> [$ci] REGISTER src=$si:$sp from=$fu contact=$ct\n");

    # Authentication
    if (!is_present_hf("Authorization")) {
        xlog("L_INFO", "    [$ci] REGISTRAR challenge sent (no Auth header)\n");
        www_challenge(SIP_REALM, "0");
        exit;
    }

    if (!www_authenticate(SIP_REALM, "subscriber")) {
        $var(auth_rc) = $rc;
        xlog("L_WARN", "    [$ci] REGISTRAR auth FAILED user=$au@$fd rc=$var(auth_rc)\n");
        if ($var(auth_rc) == -1) {
            xlog("L_INFO", "    [$ci] REGISTRAR invalid password user=$au\n");
        } else if ($var(auth_rc) == -2) {
            xlog("L_ERR", "    [$ci] REGISTRAR database error user=$au\n");
            sl_send_reply("500", "Internal Server Error");
            exit;
        } else if ($var(auth_rc) == -3) {
            xlog("L_INFO", "    [$ci] REGISTRAR stale nonce user=$au\n");
        } else if ($var(auth_rc) == -4) {
            xlog("L_INFO", "    [$ci] REGISTRAR user not found user=$au\n");
        } else if ($var(auth_rc) == -5) {
            xlog("L_ERR", "    [$ci] REGISTRAR generic auth error user=$au\n");
        } else {
            xlog("L_ERR", "    [$ci] REGISTRAR unknown auth error rc=$var(auth_rc) user=$au\n");
        }
        # Increment auth fail counter per IP
        $sht(ipban=>$si) = $sht(ipban=>$si) + 1;
        if ($sht(ipban=>$si) >= 5) {
            xlog("L_WARN", "    [$ci] BANNED $si after 5 auth failures\n");
        }
        # All non-database errors: re-challenge
        www_challenge(SIP_REALM, "0");
        exit;
    }

    xlog("L_INFO", "    [$ci] REGISTRAR auth OK user=$au\n");
    consume_credentials();

    if ($au != $fU) {
        xlog("L_WARN", "    [$ci] REGISTRAR username mismatch auth=$au from=$fU\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }

    if (!save("location")) {
        xlog("L_ERR", "    [$ci] REGISTRAR save FAILED for $fu\n");
        sl_send_reply("500", "Error saving location");
        exit;
    }

    xlog("L_INFO", "    [$ci] REGISTRAR registered $fu from $si:$sp\n");
    exit;
}

##############################################################################
# Route: DETECT_OFFER_CRYPTO - Detect SDES support and transport protocol
##############################################################################
route[DETECT_OFFER_CRYPTO] {
    if (has_body("application/sdp")) {
        if (search_body("a=crypto:")) {
            $dlg_var(device_sdes) = "1";
            # Detect transport: SAVP (Poly) vs AVP with crypto (Cisco)
            if (search_body("m=audio [1-9][0-9]* RTP/SAVP")) {
                $dlg_var(device_savp) = "1";
                xlog("L_INFO", "    [$ci] SDES device=SAVP+SDES\n");
            } else {
                $dlg_var(device_savp) = "0";
                xlog("L_INFO", "    [$ci] SDES device=AVP+SDES\n");
            }
        } else {
            $dlg_var(device_sdes) = "0";
            $dlg_var(device_savp) = "0";
            xlog("L_INFO", "    [$ci] SDES device=none\n");
        }
    } else {
        $dlg_var(device_sdes) = "0";
        $dlg_var(device_savp) = "0";
    }
}

##############################################################################
# Route: INVITE - Initial INVITE handling
##############################################################################
route[INVITE] {
    xlog("L_INFO", "    [$ci] INVITE to=$rU from=$fu\n");
    xlog("L_INFO", "    [$ci] INVITE offer SDP BEFORE rtpengine:\n$rb\n");

#!ifdef OVH_SIP_SERVER
    # OVH trunk: incoming PSTN call — OVH sends INVITE to our registered contact (phone number)
    if ($rU == $env(OVH_PHONE_NUMBER)) {
        xlog("L_INFO", "    [$ci] OVH incoming from=$fu to=$rU\n");
        # Strip OVH's Record-Route (sipgo crashes parsing its header params)
        remove_hf("Record-Route");
        $dlg_var(skip_record_route) = "1";
        # OVH sends plain RTP — no SDES translation needed, skip RTPEngine
        $dlg_var(skip_rtpengine) = "1";
        route(ROUTE_TO_LIVEKIT);
        exit;
    }
#!endif

    # Dial-in: sip:555@<IP> or sip:<IP> — route to LiveKit-SIP IVR
    if ($rU == "555" || $rU == $null) {
#!ifdef ENABLE_IP_WHITELIST
        # IP whitelist check (no SIP registration required)
        if (!allow_source_address("1")) {
            xlog("L_WARN", "    [$ci] BLOCKED non-whitelisted src=$si:$sp via=$var(via_addr)\n");
            sl_send_reply("403", "Forbidden");
            exit;
        }
#!endif

        xlog("L_INFO", "    [$ci] dial-in routing to livekit-sip\n");
        route(ROUTE_TO_LIVEKIT);
        exit;
    }

    # IVR 999: route to LiveKit-SIP for IVR prompt
    if ($rU == "999") {
        xlog("L_INFO", "    [$ci] IVR 999 routing to livekit-sip\n");
        route(ROUTE_TO_LIVEKIT);
        exit;
    }

    # PIN-based routing: 1-10 digit codes
    if ($rU =~ "^[0-9]{1,10}$") {
        $var(pin) = $rU;
        append_hf("X-PIN: $var(pin)\r\n");
        xlog("L_INFO", "    [$ci] PIN=$var(pin) routing to livekit-sip\n");
        route(ROUTE_TO_LIVEKIT);
        exit;
    }

    # Match phone numbers and route to registered devices
    if ($rU =~ "^\+[0-9]{1,15}$" || $rU =~ "^0[0-9]{9,}$" || $rU =~ "^[0-9]{11,}$") {
        if (lookup("location")) {
            record_route();
            t_relay();
            exit;
        }
        sl_send_reply("404", "Not Found");
        exit;
    }

    sl_send_reply("484", "Address Incomplete");
    exit;
}

##############################################################################
# Route: ROUTE_TO_LIVEKIT - Route incoming call to LiveKit-SIP IVR
# Shared by dial-in (555), IVR (999), PIN, and OVH trunk incoming calls.
##############################################################################
route[ROUTE_TO_LIVEKIT] {
    # Create dialog to persist variables across the call
    dlg_manage();

    # Rewrite Contact host:port to source IP:port when Contact has an RFC1918 address.
    if (nat_uac_test("1")) {
        fix_nated_contact();
        xlog("L_INFO", "    [$ci] NAT fix_nated_contact: Contact -> $si:$sp\n");
    }

    # Count active dispatcher sets
    sql_pvquery("db", "SELECT COUNT(DISTINCT setid) FROM dispatcher WHERE flags=0", "$var(num_vms)");
    if ($var(num_vms) < 1) {
        xlog("L_ERR", "    [$ci] DISPATCHER no active VMs in database\n");
        sl_send_reply("503", "Service Unavailable");
        exit;
    }

    # Load active set IDs into AVP array
    sql_pvquery("db", "SELECT DISTINCT setid FROM dispatcher WHERE flags=0 ORDER BY setid", "$avp(ds_sets)");

    # Distribute calls across active sets using timestamp mod
    $var(ds_index) = $Ts mod $var(num_vms);
    $var(vm_set) = $(avp(ds_sets)[$var(ds_index)]);

    # Try each active set round-robin until one responds
    $var(selected) = 0;
    $var(tried) = 0;
    $var(try_index) = $var(ds_index);

    while ($var(tried) < $var(num_vms) && $var(selected) == 0) {
        $var(try_set) = $(avp(ds_sets)[$var(try_index)]);
        if (ds_select_dst($var(try_set), 0)) {
            $var(selected) = 1;
            $var(vm_set) = $var(try_set);
        } else {
            xlog("L_WARN", "    [$ci] DISPATCHER set=$var(try_set) unavailable\n");
            $var(try_index) = ($var(try_index) + 1) mod $var(num_vms);
            $var(tried) = $var(tried) + 1;
        }
    }

    if ($var(selected) == 0) {
        xlog("L_ERR", "    [$ci] DISPATCHER all servers unavailable\n");
        sl_send_reply("503", "Service Unavailable");
        exit;
    }
    xlog("L_INFO", "    [$ci] DISPATCHER set=$var(vm_set) dst=$du\n");

    # Detect SDES support and transport protocol before RTPEngine processing
    route(DETECT_OFFER_CRYPTO);

    # Process SDP with RTPEngine (or mark as delayed offer if no SDP)
    if (has_body("application/sdp")) {
        # NAT rewrite: device's private LAN IP → public NAT IP ($si)
        $var(via_ip) = $(hdr(Via)[0]{s.select,1, }{s.select,0,;}{s.select,0,:});
        if ($var(via_ip) != $si) {
            xlog("L_INFO", "    [$ci] NAT detected: via=$var(via_ip) src=$si, rewriting SDP c= to $si\n");
            subst_body("/(o=[^ ]+ [0-9]+ [0-9]+ IN IP4 )[0-9.]+/\\1$si/");
            subst_body("/c=IN IP4 [0-9.]+/c=IN IP4 $si/g");
            msg_apply_changes();
        }

        if ($dlg_var(skip_rtpengine) != "1") {
            $avp(rtpengine_setid) = $var(vm_set);
            # Strip SDES crypto toward LiveKit-SIP (it only needs plain RTP)
            $var(rtp_result) = rtpengine_manage("RTP_FLAGS_TO_LK");
            xlog("L_INFO", "    [$ci] RTPENGINE offer set=$var(vm_set) result=$var(rtp_result)\n");
            msg_apply_changes();
            xlog("L_INFO", "    [$ci] INVITE SDP AFTER rtpengine:\n$rb\n");
        } else {
            xlog("L_INFO", "    [$ci] RTPENGINE skipped (OVH trunk)\n");
        }
        $dlg_var(delayed_offer) = "0";
    } else {
        # Delayed offer (no SDP in INVITE) - will process in onreply_route
        xlog("L_INFO", "    [$ci] DELAYED OFFER no SDP in INVITE\n");
        $dlg_var(delayed_offer) = "1";
        $avp(rtpengine_setid) = $var(vm_set);
    }

    # Store current set and livekit-sip destination in dialog variables
    $dlg_var(current_set) = $var(vm_set);
    $dlg_var(lk_destination) = $du;
    $avp(current_set) = $var(vm_set);
    $avp(num_vms) = $var(num_vms);

    # record_route must be after rtpengine + msg_apply_changes (otherwise msg_apply_changes fails)
    # Skip for OVH trunk calls (sipgo crashes on Record-Route header params)
    if ($dlg_var(skip_record_route) != "1") {
        record_route();
    }
    t_on_failure("LIVEKIT_FAILOVER");
    if (!t_relay()) {
        sl_reply_error();
    }
}

##############################################################################
# Failure Route: LIVEKIT_FAILOVER - Handle failed LiveKit-SIP connections
##############################################################################
failure_route[LIVEKIT_FAILOVER] {
    if (t_is_canceled()) exit;

    if (t_check_status("5[0-9][0-9]") || t_branch_timeout()) {
        # Delete RTPEngine session before trying next server
        if ($dlg_var(skip_rtpengine) != "1") {
            rtpengine_delete();
        }

        # Re-query active sets from DB
        sql_pvquery("db", "SELECT COUNT(DISTINCT setid) FROM dispatcher WHERE flags=0", "$var(num_vms)");
        sql_pvquery("db", "SELECT DISTINCT setid FROM dispatcher WHERE flags=0 ORDER BY setid", "$avp(ds_sets)");
        $var(failed_set) = $dlg_var(current_set);
        $var(tried) = 0;

        # Try all active sets, skip the failed one
        while ($var(tried) < $var(num_vms)) {
            $var(try_set) = $(avp(ds_sets)[$var(tried)]);
            $var(tried) = $var(tried) + 1;

            if ($var(try_set) != $var(failed_set)) {
                if (ds_select_dst($var(try_set), 0)) {
                    xlog("L_INFO", "    [$ci] FAILOVER set=$var(try_set) dst=$du\n");

                    if (has_body("application/sdp") && $dlg_var(skip_rtpengine) != "1") {
                        $avp(rtpengine_setid) = $var(try_set);
                        rtpengine_manage("RTP_FLAGS_TO_LK");
                    }

                    $dlg_var(current_set) = $var(try_set);
                    $dlg_var(lk_destination) = $du;
                    $avp(current_set) = $var(try_set);
                    t_relay();
                    exit;
                }
            }
        }

        xlog("L_ERR", "    [$ci] FAILOVER all servers exhausted\n");
    }
}

##############################################################################
# Reply Route - Process SIP responses
##############################################################################
onreply_route {
    route(LOG_INIT);
    if (!is_method("OPTIONS")) {
        xlog("L_INFO", "<<< [$ci] $rs $rr ($rm) src=$si:$sp via=$var(via_addr)\n");
    }

    if (is_method("INVITE")) {
        # Log session timer headers in the response
        if ($rs == 200) {
            xlog("L_INFO", "    [$ci] session-timer SE=$hdr(Session-Expires) Require=$hdr(Require) Supported=$hdr(Supported)\n");
        }

        if (has_body("application/sdp")) {
            if ($dlg_var(skip_rtpengine) == "1") {
                xlog("L_INFO", "    [$ci] RTPENGINE reply skipped (OVH trunk)\n");
            } else {
                # Extract BFCP port before RTPEngine processing (TCP/BFCP and UDP/BFCP)
                $avp(original_bfcp_port) = $null;
                if (search_body("BFCP")) {
                    $var(bfcp_match) = $(rb{re.subst,/.*m=application ([0-9]+) [TU][CD]P\/BFCP.*/\1/s});
                    if ($var(bfcp_match) != $rb) {
                        $avp(original_bfcp_port) = $var(bfcp_match);
                        xlog("L_INFO", "    [$ci] BFCP saved port=$avp(original_bfcp_port)\n");
                    }
                }

                if ($dlg_var(current_set)) {
                    $avp(rtpengine_setid) = (int)$dlg_var(current_set);
                }
                # Handle delayed offer: 200 OK contains the OFFER (not answer)
                if ($dlg_var(delayed_offer) == "1" && $rs == 200) {
                    xlog("L_INFO", "    [$ci] 200 OK SDP BEFORE rtpengine_offer:\n$rb\n");
                    if ($dlg_var(device_sdes) == "1" && $dlg_var(device_savp) == "1") {
                        $var(rtp_result) = rtpengine_offer("RTP_FLAGS_TO_DEVICE_SAVP");
                    } else if ($dlg_var(device_sdes) == "1") {
                        $var(rtp_result) = rtpengine_offer("RTP_FLAGS_TO_DEVICE_AVP");
                    } else {
                        $var(rtp_result) = rtpengine_offer("RTP_FLAGS_TO_DEVICE_NOSDES");
                    }
                    xlog("L_INFO", "    [$ci] RTPENGINE delayed-offer set=$dlg_var(current_set) sdes=$dlg_var(device_sdes) savp=$dlg_var(device_savp) result=$var(rtp_result)\n");
                } else {
                    xlog("L_INFO", "    [$ci] reply SDP BEFORE rtpengine:\n$rb\n");
                    if ($dlg_var(device_sdes) == "1" && $dlg_var(device_savp) == "1") {
                        $var(rtp_result) = rtpengine_manage("RTP_FLAGS_TO_DEVICE_SAVP");
                    } else if ($dlg_var(device_sdes) == "1") {
                        $var(rtp_result) = rtpengine_manage("RTP_FLAGS_TO_DEVICE_AVP");
                    } else {
                        $var(rtp_result) = rtpengine_manage("RTP_FLAGS_TO_DEVICE_NOSDES");
                    }
                    xlog("L_INFO", "    [$ci] RTPENGINE response set=$dlg_var(current_set) sdes=$dlg_var(device_sdes) savp=$dlg_var(device_savp) result=$var(rtp_result)\n");
                }

                # Apply RTPEngine changes before post-processing
                msg_apply_changes();

                # Fix disabled m-lines (RTP/SAVP → RTP/AVP for port 0)
                route(FIX_MISSING_CRYPTO);

                xlog("L_INFO", "    [$ci] reply SDP AFTER rtpengine:\n$rb\n");

                # Restore BFCP port after RTPEngine (TCP/BFCP and UDP/BFCP)
                if (search_body("BFCP")) {
                    route(FIX_BFCP);
                }
            }
        }
    }

    if (is_method("UPDATE")) {
        xlog("L_INFO", "    [$ci] UPDATE response $rs from=$si:$sp dst=$du\n");
        xlog("L_INFO", "    [$ci] UPDATE response Session-Expires=$hdr(Session-Expires) Require=$hdr(Require) Contact=$hdr(Contact) Allow=$hdr(Allow)\n");
    }
}

##############################################################################
# Route: FIX_MISSING_CRYPTO - Fix disabled m-lines after RTPEngine processing:
# RTPEngine sets RTP/SAVP on disabled (port 0) m-lines — revert to RTP/AVP.
##############################################################################
route[FIX_MISSING_CRYPTO] {
    if (!search_body("a=crypto:")) {
        return;
    }

    # Fix disabled m-line: m=application 0 RTP/SAVP → RTP/AVP (no crypto needed for port 0)
    if (search_body("m=application 0 RTP/SAVP")) {
        subst_body("/m=application 0 RTP\/SAVP/m=application 0 RTP\/AVP/g");
        msg_apply_changes();
        xlog("L_INFO", "    [$ci] FIX_CRYPTO disabled m-line SAVP->AVP\n");
    }
}

##############################################################################
# Route: FIX_BFCP - Restore BFCP port and set correct connection address
##############################################################################
route[FIX_BFCP] {
    if (search_body("BFCP")) {
        # Restore original BFCP port (TCP/BFCP and UDP/BFCP)
        if ($avp(original_bfcp_port) != $null) {
            subst_body("/(m=application )[0-9]+( [TU][CD]P\/BFCP)/\\1$avp(original_bfcp_port)\\2/g");
            xlog("L_INFO", "    [$ci] BFCP restored port=$avp(original_bfcp_port)\n");
            msg_apply_changes();
        }

        # Get RTPEngine external IP from database based on current set
        $var(bfcp_ip) = $null;
        if ($dlg_var(current_set) != $null) {
            sql_pvquery("db", "SELECT external_ip FROM rtpengine WHERE setid = $dlg_var(current_set) AND disabled = 0 AND external_ip IS NOT NULL LIMIT 1", "$var(bfcp_ip)");
        }

        # Fallback to advertise IP if no external_ip configured
        if ($var(bfcp_ip) == $null || $var(bfcp_ip) == "") {
            $var(bfcp_ip) = "ADVERTISE_IP";
            xlog("L_WARN", "    [$ci] BFCP no external_ip for set=$dlg_var(current_set), using ADVERTISE_IP\n");
        }

        # Set media-level c= line to RTPEngine external IP (TCP/BFCP and UDP/BFCP)
        if (search_body("m=application [0-9]+ [TU][CD]P/BFCP [^\r\n]*\r\nc=IN IP4")) {
            subst_body("/(m=application [0-9]+ [TU][CD]P\/BFCP [^\r\n]*\r\n)c=IN IP4 [0-9.]+/\\1c=IN IP4 $var(bfcp_ip)/g");
            xlog("L_INFO", "    [$ci] BFCP updated c=$var(bfcp_ip) set=$dlg_var(current_set)\n");
        } else {
            subst_body("/(m=application [0-9]+ [TU][CD]P\/BFCP [^\r\n]*)/\\1\r\nc=IN IP4 $var(bfcp_ip)/g");
            xlog("L_INFO", "    [$ci] BFCP added c=$var(bfcp_ip) set=$dlg_var(current_set)\n");
        }

        msg_apply_changes();
    }
}

##############################################################################
# Route: JSONRPC - HTTP JSONRPC handler (port 8090 only)
##############################################################################
event_route[xhttp:request] {
    if ($Rp != 8090) {
        xhttp_reply("403", "Forbidden", "text/plain", "Not allowed");
        exit;
    }
    jsonrpc_dispatch();
}

#!ifdef OVH_SIP_SERVER
##############################################################################
# Route: OVH_KEEPALIVE - Periodic OPTIONS to keep UDP conntrack alive
##############################################################################
route[OVH_KEEPALIVE] {
    $uac_req(method) = "OPTIONS";
    $uac_req(ruri) = "sip:" + $env(OVH_PHONE_NUMBER) + "@" + $env(OVH_SIP_SERVER);
    $uac_req(furi) = "sip:" + $env(OVH_PHONE_NUMBER) + "@" + $env(OVH_SIP_SERVER);
    $uac_req(turi) = $uac_req(ruri);
    $uac_req(hdrs) = "Max-Forwards: 5\r\n";
    $uac_req(sock) = "udp:0.0.0.0:5060";
    uac_req_send();
}
#!endif
