#!KAMAILIO
#!define WITH_POSTGRES
#!defenvs MY_IP_ADDR
#!defenvs SIP_REALM
#!defenvs SIP_ADVERTISE_IP
#!defenvs KAMAILIO_DB_URL
#!trydefenvs ENABLE_IP_WHITELIST
#!trydefenvs OVH_SIP_SERVER
#!trydefenvs OVH_PHONE_NUMBER
#!trydefenvs CTL_BINRPC
#!trydefenvs CTL_BINRPC_BIND
#!ifdef CTL_BINRPC
#!ifdef CTL_BINRPC_BIND
#!substdef "!CTL_BINRPC_ADDR!tcp:$env(CTL_BINRPC_BIND):$env(CTL_BINRPC)!"
#!else
#!substdef "!CTL_BINRPC_ADDR!tcp:$env(MY_IP_ADDR):$env(CTL_BINRPC)!"
#!endif
#!endif
#!substdef "!DBURL!$env(KAMAILIO_DB_URL)!"
#!substdef "!ADVERTISE_IP!$env(SIP_ADVERTISE_IP)!"
# RTPEngine flags:
# TO_DEVICE_SAVP: SDES toward device, SAVP transport — for devices that offer RTP/SAVP (Poly).
# TO_DEVICE_AVP: SDES toward device, force AVP transport — for devices that offer RTP/AVP with crypto (Cisco).
# TO_DEVICE_NOSDES: Plain RTP passthrough — for devices that don't support SDES.
# TO_LK: Strip SDES toward LiveKit-SIP — force plain RTP/AVP (request direction).
# REINVITE: Strip SDES toward LiveKit-SIP — force plain RTP/AVP (re-INVITE/UPDATE/delayed-offer ACK).
#!substdef "!RTP_FLAGS_TO_DEVICE_SAVP!replace-origin replace-session-connection ICE=remove media-handover original-sendrecv rtcp-mux-demux trust-address SDES-generate transport-protocol=RTP/SAVP DTLS=off!"
#!substdef "!RTP_FLAGS_TO_DEVICE_AVP!replace-origin replace-session-connection ICE=remove media-handover original-sendrecv rtcp-mux-demux trust-address SDES-generate transport-protocol=RTP/AVP DTLS=off!"
#!substdef "!RTP_FLAGS_TO_DEVICE_NOSDES!replace-origin replace-session-connection ICE=remove media-handover original-sendrecv rtcp-mux-demux trust-address SDES-off DTLS=off!"
#!substdef "!RTP_FLAGS_TO_LK!replace-origin replace-session-connection ICE=remove media-handover original-sendrecv rtcp-mux-demux trust-address SDES-off transport-protocol=RTP/AVP DTLS=off!"
#!substdef "!RTP_FLAGS_REINVITE!replace-origin replace-session-connection ICE=remove media-handover original-sendrecv rtcp-mux-demux trust-address SIP-source-address SDES-off transport-protocol=RTP/AVP DTLS=off!"
##############################################################################
# Kamailio SIP Proxy Configuration
#
# Features:
#   - SIP Registrar with digest authentication
#   - RTPEngine media proxy integration with load balancing
#   - BFCP (Binary Floor Control Protocol) support for video conferencing
#   - IP whitelist-based dial-in to LiveKit-SIP with dispatcher load balancing
#   - PIN-based routing to LiveKit-SIP with dispatcher load balancing
#   - OVH SIP trunk registration for PSTN inbound calls (optional)
#   - Database-backed dispatcher, rtpengine, address, and uacreg for hot reload
#
# Environment Variables:
#   MY_IP_ADDR            - Kamailio bind IP address
#   SIP_REALM             - SIP authentication realm
#   SIP_ADVERTISE_IP      - Public IP advertised in SDP/Via
#   KAMAILIO_DB_URL       - PostgreSQL connection URL
#   ENABLE_IP_WHITELIST   - Set to any value to enable IP whitelist (unset = disabled)
#   OVH_SIP_SERVER        - OVH SIP registrar hostname (unset = OVH trunk disabled)
#   OVH_PHONE_NUMBER      - OVH DID number for incoming call matching
#
# Database Tables:
#   dispatcher - LiveKit-SIP server destinations (hot reload: kamcmd dispatcher.reload)
#   rtpengine  - RTPEngine server destinations (hot reload: kamcmd rtpengine.reload)
#   address    - IP whitelist for SIP device access (hot reload: kamcmd permissions.addressReload)
#   uacreg     - UAC registrations for SIP trunks (hot reload: kamcmd uac.reg_reload)
#
# Log Format:
#   >>> [$ci] METHOD ... src=<ip:port> via=<via_ip:port>   — incoming request
#   <<< [$ci] STATUS REASON (METHOD) src=<ip:port>         — outgoing reply
#       [$ci] SUBSYSTEM detail key=value                   — interior detail
##############################################################################

##############################################################################
# Core Settings
##############################################################################
log_stderror=yes
debug=2
log_facility=LOG_LOCAL0
fork=yes
children=4
tcp_accept_haproxy=yes

##############################################################################
# TCP Settings (required for BFCP)
##############################################################################
disable_tcp=no
tcp_accept_no_cl=yes
tcp_connection_lifetime=3605
tcp_max_connections=2048
tcp_keepalive=yes
tcp_keepidle=30
tcp_keepintvl=10
tcp_keepcnt=3

##############################################################################
# TLS Settings
##############################################################################
enable_tls=yes

##############################################################################
# Network Listeners
##############################################################################
listen=udp:0.0.0.0:5060 advertise SIP_ADVERTISE_IP:5060 # Ovh listen on UDP
listen=tcp:0.0.0.0:5060 advertise SIP_ADVERTISE_IP:5060
listen=tls:0.0.0.0:5061 advertise SIP_ADVERTISE_IP:5061
listen=tcp:0.0.0.0:8090

##############################################################################
# Modules
##############################################################################
loadmodule "tls.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
