[rtpengine]
# Userspace forwarding (kernel module not loaded).
table = -1

# Bind/advertise IP. Overridden by --interface in compose.yml.
interface = 192.168.0.10

# NG control socket for kamailio.
listen-ng = 0.0.0.0:22222

# RTP port range.
port-min = 20301
port-max = 20400

# Timeouts.
timeout = 60
silent-timeout = 3600

# Logging.
log-level = 5
foreground = false
log-stderr = true
tos = 184

# Jitter buffer.
jitter-buffer = 10
jb-clock-drift = true
num-threads = 4
no-xmlrpc = true

# Preserve these SDP attributes through rtpengine.
sdp-attribute-preserve = rtcp-fb;confid;userid;floorctrl;floorid;maccaption

# Keep unknown codecs in SDP.
codec-strip-all = false

# Split RTP/RTCP demuxing.
rtcp-mux = demux
