global:
  scrape_interval: 15s
  evaluation_interval: 15s

# All targets run with network_mode: host on the same machine,
# so localhost:<port> resolves to the right process.
scrape_configs:
  - job_name: 'livekit-sip'
    static_configs:
      - targets: ['localhost:9101']

  - job_name: 'rtpengine'
    static_configs:
      - targets: ['localhost:9102']

  - job_name: 'kamailio'
    static_configs:
      - targets: ['localhost:9103']
