s237_private_projects:
  relais:
    env_file: '{{ s237_inputs }}/env/empty.env'
    bind_mappings:
      infra/ansible/relay/relay.py:
        kind: release
      infra/ansible/relay/routes: relais/routes
    environment:
      relay: {}
    probes:
    - service: relay
      port: 9999
      path: /health
  keycloak:
    env_file: '{{ s237_inputs }}/env/keycloak.env'
    bind_mappings:
      oria-stack/infra/keycloak/realms: repo/oria-stack/infra/keycloak/realms
    environment:
      keycloak: {}
      postgres: {}
    probes:
    - service: keycloak
      port: 8080
      path: /realms/master
    drop_extra_hosts:
      keycloak:
      - postgres
    drop_static_ips:
      postgres: 'IP fixe 172.27.0.3 de l''override prod : le nom postgres est résolu par le DNS du réseau d''exercice.'
  gateway:
    env_file: '{{ s237_inputs }}/env/gateway.env'
    bind_mappings:
      briques/gateway/litellm_config.yaml:
        kind: release
    environment:
      db:
        TELEGRAM_BOT_TOKEN: ''
      gateway:
        TELEGRAM_BOT_TOKEN: ''
      gateway-sync:
        TELEGRAM_BOT_TOKEN: ''
    probes:
    - service: gateway
      port: 4000
      path: /health/liveliness
    - service: gateway-sync
      port: 4002
      path: /sante
  memoire:
    env_file: '{{ s237_inputs }}/env/memoire.env'
    bind_mappings:
      briques/memoire/init-pgvector.sql:
        kind: release
    environment:
      memoire: {}
      memoire-backend:
        TELEGRAM_BOT_TOKEN: ''
      memoire-db:
        TELEGRAM_BOT_TOKEN: ''
    probes:
    - service: memoire
      port: 8000
      path: /sante
  forge:
    env_file: '{{ s237_inputs }}/env/forge.env'
    bind_mappings: {}
    environment:
      forge:
        TELEGRAM_BOT_TOKEN: ''
      forge-adapter:
        TELEGRAM_BOT_TOKEN: ''
      forge-db: {}
      frontend: {}
      qdrant: {}
    probes:
    - service: forge-adapter
      port: 8000
      path: /sante
    drop_depends_on:
      forge:
        forge-migrate: 'Migration ponctuelle exclue : le schéma provient du dump PostgreSQL restauré.'
  oria:
    env_file: '{{ s237_inputs }}/env/oria.env'
    bind_mappings:
      oria-stack/oria/backend: repo/oria-stack/oria/backend
      oria-stack/oria/postgres-init:
        kind: release
      oria-stack/infra/postgres-ha/oria/patroni.yml:
        kind: release
      oria-stack/oria/matrix/dendrite.yaml.tpl:
        kind: release
      oria-stack/oria/matrix/appservice.yaml.tpl:
        kind: release
      oria-stack/oria/frontend: repo/oria-stack/oria/frontend
      oria-stack/shared-ui: repo/oria-stack/shared-ui
      oria-stack/oria/keycloak: repo/oria-stack/oria/keycloak
      oria-stack/oria/livekit/livekit.yaml: repo/oria-stack/oria/livekit/livekit.yaml
    environment:
      backend: {}
      db: {}
      dendrite: {}
      etcd: {}
      frontend: {}
      keycloak: {}
      livekit: {}
      pgbouncer: {}
      redis: {}
      seaweedfs: {}
    probes:
    - service: backend
      port: 8000
      path: /health
    - service: keycloak
      port: 8080
      path: /realms/master
    add_volumes:
      frontend:
        /workspace/oria/frontend/node_modules: frontend_node_modules
      dendrite:
        /etc/dendrite: dendrite_config
      redis:
        /data: redis_data
  peertube:
    env_file: '{{ s237_inputs }}/env/peertube.env'
    bind_mappings:
      briques/peertube/config/production.yaml:
        kind: release
    environment:
      peertube: {}
      peertube-db: {}
      peertube-redis: {}
      peertube-wrapper: {}
    probes:
    - service: peertube-wrapper
      port: 6100
      path: /sante
    add_volumes:
      peertube:
        /config: peertube_config
  recherche:
    env_file: '{{ s237_inputs }}/env/recherche.env'
    bind_mappings:
      briques/recherche/searxng: repo/briques/recherche/searxng
    environment:
      recherche:
        TELEGRAM_BOT_TOKEN: ''
      searxng: {}
    probes:
    - service: recherche
      port: 6040
      path: /sante
    add_volumes:
      searxng:
        /var/cache/searxng: searxng_cache
  agenda:
    env_file: '{{ s237_inputs }}/env/agenda.env'
    bind_mappings: {}
