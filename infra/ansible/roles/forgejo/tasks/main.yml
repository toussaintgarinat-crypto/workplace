- name: Declare the Forgejo container registry as insecure (HTTP, LAN/mesh only)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: '{{ {"insecure-registries": [forgejo_registry_host]} | to_nice_json }}'
    mode: "0644"
  register: forgejo_daemon

- name: Restart Docker when the registry list changed
  ansible.builtin.systemd: {name: docker, state: restarted}
  when: forgejo_daemon.changed
- name: Forgejo directory
  ansible.builtin.file: {path: "{{ forgejo_dir }}", state: directory, mode: "0750"}
- name: Generate SECRET_KEY once (kept on the VM only, never in the repo)
  ansible.builtin.shell: |
    umask 077
    echo "FORGEJO__security__SECRET_KEY=$(openssl rand -hex 32)" > {{ forgejo_dir }}/forgejo.env
  args: {creates: "{{ forgejo_dir }}/forgejo.env"}
- name: Compose file
  ansible.builtin.template: {src: compose.yml.j2, dest: "{{ forgejo_dir }}/compose.yml", mode: "0640"}
- name: Start Forgejo
  ansible.builtin.command: docker compose up -d
  args: {chdir: "{{ forgejo_dir }}"}
  changed_when: true
- name: Let Docker networks (Dokploy builds) reach Forgejo through the host firewall
  ansible.builtin.command: ufw allow from 172.16.0.0/12 to any port {{ forgejo_http_port }} proto tcp
  changed_when: true
