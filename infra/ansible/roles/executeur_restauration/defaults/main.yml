executeur_dir: /opt/executeur-restauration
executeur_env_file: /etc/executeur-restauration/env
executeur_port: 8090
executeur_bind: "{{ ansible_default_ipv4.address }}"
executeur_client_ip: 192.168.1.89     # le HP (seule machine autorisée à appeler l'exécuteur)
forgejo_conteneur: forgejo-forgejo-1
forgejo_sauvegardes_gardees: 7
# Confinement strict de l'exécuteur : ProtectSystem=strict + CapabilityBoundingSet= (vide).
# À passer à false UNIQUEMENT si l'accès au socket Docker ou à curl casse sous ce confinement
# (retombe alors sur ProtectSystem=full, capacités par défaut). Les autres directives restent.
executeur_confinement_strict: true
