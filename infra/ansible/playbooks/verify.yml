- name: S237 verify on verified independent VM
  hosts: rehearsal
  gather_facts: false
  become: false
  vars_files:
    - ../group_vars/rehearsal.yml
  pre_tasks:
    - name: Guard before any privileged operation
      ansible.builtin.import_role:
        name: guard
    - name: Resolve private runtime inputs
      ansible.builtin.include_tasks: runtime.yml
  tasks:
    - name: verify
      ansible.builtin.import_role:
        name: verify
      become: true
    - name: observability
      ansible.builtin.import_role:
        name: observability
      become: true
