- name: S237 rollback on verified independent VM
  hosts: rehearsal
  gather_facts: false
  become: false
  vars_files:
    - ../group_vars/rehearsal.yml
  vars:
    s237_operation: rollback
  pre_tasks:
    - name: Guard before any privileged operation
      ansible.builtin.import_role:
        name: guard
    - name: Resolve private runtime inputs
      ansible.builtin.include_tasks: runtime.yml
  tasks:
    - name: compose
      ansible.builtin.import_role:
        name: compose
      become: true
    - name: verify
      ansible.builtin.import_role:
        name: verify
      become: true
