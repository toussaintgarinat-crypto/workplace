- name: S237 recover an independent encrypted generation on the verified VM
  hosts: rehearsal
  gather_facts: false
  become: false
  vars_files:
    - ../group_vars/rehearsal.yml
  vars:
    # Recovery produces the application inputs; it cannot require them.
    s237_require_inputs: false
  pre_tasks:
    - name: Guard before any privileged operation
      ansible.builtin.import_role:
        name: guard
  tasks:
    - name: recover
      ansible.builtin.import_role:
        name: recover
