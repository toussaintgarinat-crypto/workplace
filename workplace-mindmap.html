  #back-btn { background: #334155; border: none; color: #cbd5e1; padding: 6px 12px;

  #back-btn:hover { background: #475569; color: #f1f5f9; }
  #back-btn:disabled { opacity: .3; cursor: default; }
  #search-box { background: #334155; border: 1px solid #475569; color: #f1f5f9;

  .card { background: #1e293b; border: 2px solid #334155; border-radius: 12px;
          padding: 16px; cursor: pointer; transition: all .16s; position: relative;
          overflow: hidden; }
  .card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
                  background: var(--cc); }
  .card:hover { border-color: var(--cc); transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(0,0,0,.4); }
  .card-icon { font-size: 22px; margin-bottom: 8px; }
  .card-title { font-size: 14px; font-weight: 700; color: #f1f5f9; margin-bottom: 3px; line-height: 1.3; }
  .card-port { font-size: 10px; color: #94a3b8; font-family: monospace; margin-bottom: 6px; }
  .card-desc { font-size: 11px; color: #94a3b8; line-height: 1.5; }
  .card-arrow { position: absolute; bottom: 12px; right: 12px; color: #475569; font-size: 13px;

  .card:hover .card-arrow { color: var(--cc); transform: translateX(3px); }
  .card-leaf { cursor: default; }
  .card-leaf:hover { transform: none; box-shadow: none; border-color: #334155; }
  .card-leaf .card-arrow { display: none; }
  #empty { display: flex; flex-direction: column; align-items: center;
           justify-content: center; padding: 60px; color: #475569; text-align: center; }
  #search-results { display: none; padding: 12px 0; }
  .sr-item { padding: 10px 14px; border-radius: 8px; cursor: pointer; margin-bottom: 6px;
             background: #1e293b; border: 1px solid #334155; transition: all .14s; }
  .sr-item:hover { border-color: #60a5fa; background: #1e3a5f; }
  .sr-path { font-size: 10px; color: #64748b; margin-bottom: 3px; }
  .sr-label { font-size: 14px; font-weight: 600; color: #f1f5f9; }
  .sr-desc { font-size: 11px; color: #94a3b8; margin-top: 2px; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

// ── Navigation ──────────────────────────────────────────────
let stack = [TREE];
const IDX = {};
function idx(n){ IDX[n.id]=n; (n.children||[]).forEach(idx); }
idx(TREE);

function cur(){ return stack[stack.length-1]; }
function navigate(id){ const n=IDX[id]; if(n){ stack.push(n); render(); } }
function goBack(){ if(stack.length>1){ stack.pop(); render(); } }
function goTo(i){ stack=stack.slice(0,i+1); render(); }

function render(){
  const node=cur();
  // breadcrumb
  document.getElementById('breadcrumb').innerHTML=stack.map((n,i)=>{
    const last=i===stack.length-1;
    return (i>0?'<span class="sep">›</span>':'')+
      `<span class="crumb${last?' active':''}" title="${n.label}"
       onclick="${last?'':('goTo('+i+')')}">${n.icon} ${n.label}</span>`;
  }).join('');
  document.getElementById('back-btn').disabled=stack.length<=1;
  // info
  document.getElementById('info-icon').textContent=node.icon;
  document.getElementById('info-title').textContent=node.label;
  document.getElementById('info-port').textContent=node.port||'';
  const st=document.getElementById('info-status');
  if(node.status){
    st.textContent=node.status;
    const ok=node.status.startsWith('🟢'),warn=node.status.startsWith('🟡'),
          err=node.status.startsWith('⚠️')||node.status.startsWith('🔴');
    st.style.cssText=`display:inline-block;background:${ok?'#bbf7d0':warn?'#fef3c7':err?'#fee2e2':'#dbeafe'};`+
      `color:${ok?'#14532d':warn?'#78350f':err?'#7c2d12':'#1e3a8a'};`;
  } else st.style.display='none';
  document.getElementById('info-desc').textContent=node.desc||'';
  const ch=node.children||[];
  document.getElementById('info-children-count').textContent=
    ch.length?`${ch.length} sous-élément${ch.length>1?'s':''}  —  cliquer pour entrer`:'';
  // cards
  document.getElementById('search-results').style.display='none';
  document.getElementById('search-box').value='';
  const grid=document.getElementById('cards-grid');
  const empty=document.getElementById('empty');
  const lbl=document.getElementById('cards-label');
  if(!ch.length){ grid.style.display='none'; lbl.style.display='none'; empty.style.display='flex'; }
  else {
    grid.style.display='grid'; lbl.style.display='block'; empty.style.display='none';
    lbl.textContent=`${ch.length} sous-élément${ch.length>1?'s':''}`;
    grid.innerHTML=ch.map((c,i)=>{
      const has=(c.children||[]).length>0;
      return `<div class="card ${c.color}${has?'':' card-leaf'}"
           style="animation-delay:${i*.03}s"
           onclick="${has?`navigate('${c.id}')`:''}" >
        <div class="card-icon">${c.icon}</div>
        <div class="card-title">${c.label}</div>
        ${c.port?`<div class="card-port">${c.port}</div>`:''}
        <div class="card-desc">${((c.desc||'').split('\n')[0]).slice(0,80)}</div>
        ${has?'<div class="card-arrow">→</div>':''}
      </div>`;
    }).join('');
  }
}

// ── Recherche ────────────────────────────────────────────────
function allNodes(n, path=[]){
  const p=[...path,n];
  return [n,...(n.children||[]).flatMap(c=>allNodes(c,p))].map(x=>({...x,_path:p}));
}
const ALL=allNodes(TREE);

function search(q){
  const sr=document.getElementById('search-results');
  const grid=document.getElementById('cards-grid');
  const lbl=document.getElementById('cards-label');
  const empty=document.getElementById('empty');
  if(!q.trim()){ sr.style.display='none'; render(); return; }
  const ql=q.toLowerCase();
  const hits=ALL.filter(n=>
    (n.label||'').toLowerCase().includes(ql)||
    (n.desc||'').toLowerCase().includes(ql)||
    (n.port||'').toLowerCase().includes(ql)
  ).slice(0,20);
  grid.style.display='none'; lbl.style.display='none'; empty.style.display='none';
  sr.style.display='block';
  sr.innerHTML=`<div style="font-size:11px;color:#64748b;margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em">${hits.length} résultat${hits.length>1?'s':''}</div>`+
    hits.map(n=>`
      <div class="sr-item" onclick="jumpTo('${n.id}')">
        <div class="sr-path">${(n._path||[]).map(x=>x.label).join(' › ')}</div>
        <div class="sr-label">${n.icon} ${n.label}</div>
        ${n.port?`<div class="sr-desc" style="font-family:monospace">${n.port}</div>`:''}
        <div class="sr-desc">${(n.desc||'').split('\n')[0].slice(0,90)}</div>
      </div>`).join('');
}

function jumpTo(id){
  // reconstruction du chemin
  function findPath(node, target, path=[]){
    if(node.id===target) return [...path,node];
    for(const c of node.children||[]){
      const r=findPath(c,target,[...path,node]);
      if(r) return r;
    }
    return null;
  }
  const path=findPath(TREE,id);
  if(path){ stack=path; render(); }
}

render();
</script>
