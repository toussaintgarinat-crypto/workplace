[pytest]
# Par défaut, `pytest` à la racine ne lance que le smoke « santé briques »
# (hors-ligne, sans secrets). Le Cœur et les briques se lancent via le Makefile
# (make test / test-core / test-briques), qui fournit les variables de test.
addopts = -q
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
