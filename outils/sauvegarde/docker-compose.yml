# MinIO = cible S3-compatible LOCALE pour développement/test des chantiers de sauvegarde
# continue (Litestream, WAL-G). En production (HP), un vrai stockage S3/B2 remplace ceci
# — seules AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/AWS_ENDPOINT/AWS_REGION/
# SAUVEGARDE_S3_BUCKET du .env racine changent, aucun code (source unique, cf. re-revue
# finale whole-branch, .superpowers/sdd/progress.md).
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: workplace_minio
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY}
    command: server /data --console-address ":9001"
    ports:
      # Port hôte 9000 déjà pris par workplace_peertube sur cette machine → remappé sur
      # 9002 côté hôte uniquement. Le port CONTENEUR reste 9000, donc http://minio:9000
      # depuis proxy_net (l'interface documentée pour les briques) n'est pas affecté.
      - "9002:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - default
      - proxy_net
      # memoire_default/gateway_default : réseaux SUPPLÉMENTAIRES (revue finale
      # whole-branch I6, .superpowers/sdd/progress.md) — memoire-db et gateway/db ont été
      # retirés de proxy_net (rayon d'exposition trop large), mais WAL-G doit encore
      # joindre minio (AWS_ENDPOINT=http://minio:9000). Plutôt que de remettre Postgres
      # sur le bus partagé, c'est minio qui rejoint leurs réseaux internes respectifs.
      # Réseaux externes créés par memoire/gateway docker-compose.yml (default: sans nom
      # explicite → <projet>_default), pas par ce fichier.
      - memoire_default
      - gateway_default
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Conteneur jetable : crée le bucket au premier démarrage puis s'arrête (exit 0 normal).
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: workplace_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - default
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} &&
      mc mb -p local/${SAUVEGARDE_S3_BUCKET} &&
      echo 'Bucket pret'
      "

volumes:
  minio_data:

networks:
  # Sous-réseau fixé explicitement : les pools d'adresses par défaut de Docker
  # (172.17-172.31/16 puis la quasi-totalité de 192.168.0.0/16) sont déjà épuisés
  # par les ~39 stacks docker-compose du monorepo. 10.99.6.0/24 suit le motif déjà
  # utilisé par proxy_net (10.99.0.0/24) et les briques connecteurs/connexion/core/oria.
  default:
    ipam:
      config:
        - subnet: 10.99.6.0/24
  proxy_net:
    external: true
    name: proxy_net
  memoire_default:
    external: true
    name: memoire_default
  gateway_default:
    external: true
    name: gateway_default
