# MinIO = cible S3-compatible LOCALE pour développement/test des chantiers de sauvegarde
# continue (Litestream, WAL-G). En production (HP), un vrai stockage S3/B2 remplace ceci
# — seules les variables SAUVEGARDE_S3_* du .env racine changent, aucun code.
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: workplace_minio
    environment:
      - MINIO_ROOT_USER=${SAUVEGARDE_S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${SAUVEGARDE_S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    ports:
      # Port hôte 9000 déjà pris par workplace_peertube sur cette machine → remappé sur
      # 9002 côté hôte uniquement. Le port CONTENEUR reste 9000, donc http://minio:9000
      # depuis proxy_net (l'interface documentée pour les briques) n'est pas affecté.
      - "9002:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - default
      - proxy_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Conteneur jetable : crée le bucket au premier démarrage puis s'arrête (exit 0 normal).
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: workplace_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - default
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 ${SAUVEGARDE_S3_ACCESS_KEY} ${SAUVEGARDE_S3_SECRET_KEY} &&
      mc mb -p local/${SAUVEGARDE_S3_BUCKET} &&
      echo 'Bucket pret'
      "

volumes:
  minio_data:

networks:
  # Sous-réseau fixé explicitement : les pools d'adresses par défaut de Docker
  # (172.17-172.31/16 puis la quasi-totalité de 192.168.0.0/16) sont déjà épuisés
  # par les ~39 stacks docker-compose du monorepo. 10.99.6.0/24 suit le motif déjà
  # utilisé par proxy_net (10.99.0.0/24) et les briques connecteurs/connexion/core/oria.
  default:
    ipam:
      config:
        - subnet: 10.99.6.0/24
  proxy_net:
    external: true
    name: proxy_net
