apiVersion: 1

providers:
  - name: workplace
    orgId: 1
    folder: Workplace
    type: file
    disableDeletion: false
    # Le tableau est versionné dans le dépôt : on le recharge depuis le disque plutôt que
    # de laisser diverger une copie éditée dans la base Grafana.
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/tableaux
