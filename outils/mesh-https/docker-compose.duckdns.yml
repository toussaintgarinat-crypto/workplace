# Variante « zéro avertissement » : Caddy buildé avec le module DuckDNS + vrai cert
# Let's Encrypt (DNS-01). À DÉPLOYER SUR LA VM. Renseigne DUCKDNS_TOKEN (.env à côté).
#
#   cp Caddyfile.duckdns Caddyfile   # après avoir adapté le nom de domaine + email
#   echo "DUCKDNS_TOKEN=xxxxxxxx-...." > .env
#   docker compose -f docker-compose.duckdns.yml up -d --build
services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.duckdns
    image: workplace/caddy-duckdns:2
    container_name: mesh_caddy
    network_mode: host
    restart: unless-stopped
    environment:
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN:?DUCKDNS_TOKEN requis}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.briques:/etc/caddy/Caddyfile.briques:ro   # S128 : sites HTTPS par brique
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
