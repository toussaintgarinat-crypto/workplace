services:
  personnages:
    build: .
    container_name: workplace_personnages
    image: workplace/personnages:0.8.0   # tag épinglé (pas de :latest flottant)
    env_file:
      # Secrets/réglages partagés à la racine — source unique (GATEWAY_KEY pour le LLM
      # par défaut). En produit autonome vendu, fournir plutôt API_KEYS + LLM BYO.
      - path: ../../.env
        required: false
    ports:
      - "5900:5900"
    environment:
      - PORT=5900
      # LLM par défaut : Gateway Workplace (cost-first). Le client peut aussi passer
      # sa propre clé par appel (champ `llm` : {base_url, cle, modele}).
      - GATEWAY_URL=http://host.docker.internal:4001
      - GATEWAY_MODEL=free/google/gemma-4-31b-it
      # Clés API acceptées (séparées par virgule). VIDE = mode ouvert (dev/démo) :
      # à renseigner pour vendre (auth + cloisonnement par tenant).
      - PERSONNAGES_DB=/data/personnages.db
    volumes:
      - personnages_data:/data   # distributions persistées (couche stateful)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5900/sante')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  personnages_data:
