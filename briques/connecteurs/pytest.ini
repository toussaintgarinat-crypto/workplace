[pytest]
# S230/Task 8 — sans ce fichier, `pytest` ici retombe sur le `pytest.ini` racine (qui ne
# fixe pas asyncio_mode) : les `async def test_*` de test_mappeurs.py sont alors collectés
# puis SKIPPÉS en silence (« async def functions are not natively supported »), pas
# signalés en échec — le filet paraît vert alors qu'aucun des 4 tests n'a tourné. Même
# piège déjà corrigé pour forge/ et ingestion/ (cf. leurs pytest.ini).
asyncio_mode = auto
