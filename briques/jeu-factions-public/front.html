<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Jeu-factions</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<h1>Jeu-factions</h1>

<section id="auth">
  <div id="authFormes">
    <h2>Connexion</h2>
    <form id="formConnexion">
      <input id="connexionEmail" type="email" placeholder="Email" required>
      <input id="connexionMdp" type="password" placeholder="Mot de passe" required>
      <button type="submit">Se connecter</button>
    </form>
    <p><a href="#" id="lienMotDePasseOublie">Mot de passe oublié ?</a></p>
    <h2>Inscription</h2>
    <form id="formInscription">
      <input id="inscriptionPseudo" placeholder="Pseudo" required>
      <input id="inscriptionEmail" type="email" placeholder="Email" required>
      <input id="inscriptionMdp" type="password" placeholder="Mot de passe (8 caractères min.)" required>
      <button type="submit">Créer un compte</button>
    </form>
  </div>

  <div id="authOublieMotDePasse" style="display:none">
    <h2>Mot de passe oublié</h2>
    <form id="formMotDePasseOublie">
      <input id="oublieEmail" type="email" placeholder="Email" required>
      <button type="submit">Envoyer le lien de réinitialisation</button>
    </form>
    <p><a href="#" id="lienRetourConnexion">Retour à la connexion</a></p>
    <p id="messageOublie" style="display:none; font-style:italic; color:green;"></p>
  </div>

  <div id="authReinitialisationMotDePasse" style="display:none">
    <h2>Réinitialiser le mot de passe</h2>
    <form id="formReinitialisationMotDePasse">
      <input id="resetNouveauMdp" type="password" placeholder="Nouveau mot de passe" required>
      <input id="resetConfirmMdp" type="password" placeholder="Confirmer le mot de passe" required>
      <button type="submit">Réinitialiser</button>
    </form>
  </div>

  <p id="messageAuthErreur"></p>
</section>

<section id="jeuConnecte" style="display:none">
  <button id="boutonDeconnexion">Se déconnecter</button>

  <h2>Créer un personnage</h2>
  <label><input type="radio" name="mode" value="date" checked> Par date de naissance</label>
  <label><input type="radio" name="mode" value="description"> Par description</label>
  <form id="formCreation">
    <input id="nom" placeholder="Nom du personnage" required>
    <div id="champsDate">
      <input id="date_naissance" type="date">
    </div>
    <div id="champsDescription" style="display:none">
      <textarea id="description" placeholder="Décris le caractère..."></textarea>
    </div>
    <button type="submit">Créer</button>
  </form>
  <pre id="resultatCreation"></pre>

  <h2>Groupes ouverts</h2>
  <ul id="listeGroupes"></ul>

  <h2>Mes personnages</h2>
  <ul id="listePersonnages"></ul>

  <h2>Zones de signe (PvE partagé)</h2>
  <ul id="listeZones"></ul>
</section>

<script>
const entetes = () => ({"Content-Type": "application/json"});
let personnagesGlobaux = [];

function afficherErreurAuth(texte) {
  document.getElementById("messageAuthErreur").textContent = texte;
}

document.getElementById("formConnexion").addEventListener("submit", async e => {
  e.preventDefault();
  const r = await fetch("/connexion", {method: "POST", headers: entetes(), body: JSON.stringify({
    email: document.getElementById("connexionEmail").value,
    mot_de_passe: document.getElementById("connexionMdp").value,
  })});
  if (!r.ok) { afficherErreurAuth((await r.json()).detail || "Connexion refusée."); return; }
  location.reload();
});

document.getElementById("formInscription").addEventListener("submit", async e => {
  e.preventDefault();
  const r = await fetch("/inscription", {method: "POST", headers: entetes(), body: JSON.stringify({
    pseudo: document.getElementById("inscriptionPseudo").value,
    email: document.getElementById("inscriptionEmail").value,
    mot_de_passe: document.getElementById("inscriptionMdp").value,
  })});
  if (!r.ok) { afficherErreurAuth((await r.json()).detail || "Inscription refusée."); return; }
  location.reload();
});

document.getElementById("lienMotDePasseOublie").addEventListener("click", e => {
  e.preventDefault();
  document.getElementById("authFormes").style.display = "none";
  document.getElementById("authOublieMotDePasse").style.display = "block";
  document.getElementById("messageAuthErreur").textContent = "";
});

document.getElementById("lienRetourConnexion").addEventListener("click", e => {
  e.preventDefault();
  document.getElementById("authFormes").style.display = "block";
  document.getElementById("authOublieMotDePasse").style.display = "none";
  document.getElementById("messageOublie").style.display = "none";
  document.getElementById("messageAuthErreur").textContent = "";
});

document.getElementById("formMotDePasseOublie").addEventListener("submit", async e => {
  e.preventDefault();
  const r = await fetch("/mot-de-passe-oublie", {method: "POST", headers: entetes(), body: JSON.stringify({
    email: document.getElementById("oublieEmail").value,
  })});
  // Afficher toujours le même message, peu importe la réponse
  document.getElementById("messageOublie").textContent = "Si ce compte existe, un email vient d'être envoyé.";
  document.getElementById("messageOublie").style.display = "block";
  document.getElementById("oublieEmail").value = "";
});

document.getElementById("formReinitialisationMotDePasse").addEventListener("submit", async e => {
  e.preventDefault();
  const mdp1 = document.getElementById("resetNouveauMdp").value;
  const mdp2 = document.getElementById("resetConfirmMdp").value;
  if (mdp1 !== mdp2) {
    afficherErreurAuth("Les mots de passe ne correspondent pas.");
    return;
  }
  const jeton = new URLSearchParams(location.search).get("jeton");
  const r = await fetch("/reinitialiser-mot-de-passe", {method: "POST", headers: entetes(), body: JSON.stringify({
    jeton,
    nouveau_mot_de_passe: mdp1,
  })});
  if (!r.ok) { afficherErreurAuth((await r.json()).detail || "Réinitialisation refusée."); return; }
  location.href = "/";
});

document.getElementById("boutonDeconnexion").addEventListener("click", async () => {
  await fetch("/deconnexion", {method: "POST"});
  location.reload();
});

document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener("change", e => {
  document.getElementById("champsDate").style.display = e.target.value === "date" ? "block" : "none";
  document.getElementById("champsDescription").style.display = e.target.value === "description" ? "block" : "none";
}));

document.getElementById("formCreation").addEventListener("submit", async e => {
  e.preventDefault();
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const corps = {nom: document.getElementById("nom").value};
  if (mode === "date") corps.date_naissance = document.getElementById("date_naissance").value;
  else corps.description = document.getElementById("description").value;
  const r = await fetch("/personnages", {method: "POST", headers: entetes(), body: JSON.stringify(corps)});
  document.getElementById("resultatCreation").textContent = JSON.stringify(await r.json(), null, 2);
  chargerPersonnages();
});

async function chargerPersonnages() {
  const r = await fetch("/personnages", {headers: entetes()});
  const items = await r.json();
  personnagesGlobaux = items;
  const liste = document.getElementById("listePersonnages");
  liste.innerHTML = "";
  for (const p of items) {
    const bonus = p.bonus_idle_actuel > 0
      ? ` — +${p.bonus_idle_actuel} vers la prochaine étape (voie d'archétype)` : "";
    const archetype = (p.snapshot_holistique.portrait || {}).archetype || "?";
    const li = document.createElement("li");
    const texteContainer = document.createElement("div");
    texteContainer.textContent = `${p.nom} — ${archetype} (zone: ${p.zone_actuelle || "aucune"})${bonus}`;
    li.appendChild(texteContainer);

    if (p.prochaine_etape_id) {
      const btn = document.createElement("button");
      btn.textContent = "Ouvrir un groupe sur cette étape";
      btn.addEventListener("click", async () => {
        const res = await fetch("/groupes", {
          method: "POST",
          headers: entetes(),
          body: JSON.stringify({
            personnage_cible_id: p.id,
            zone_archetype_id: p.prochaine_etape_id
          })
        });
        if (!res.ok) {
          alert("Erreur: " + (await res.json()).detail);
          return;
        }
        chargerGroupes();
      });
      li.appendChild(btn);
    }
    liste.appendChild(li);
  }
}

async function chargerZones() {
  const r = await fetch("/zones", {headers: entetes()});
  const items = await r.json();
  document.getElementById("listeZones").innerHTML = items.map(z =>
    `<li>${z.nom} (${z.element_natif}) — ${z.etat} ` +
    `<a href="/front_combat.html?zone=${z.id}">Rejoindre le combat</a></li>`
  ).join("");
}

async function chargerGroupes() {
  const r = await fetch("/groupes", {headers: entetes()});
  const items = await r.json();
  const liste = document.getElementById("listeGroupes");
  liste.innerHTML = "";
  if (items.length === 0) {
    const li = document.createElement("li");
    li.textContent = "Aucun groupe ouvert.";
    liste.appendChild(li);
    return;
  }
  for (const g of items) {
    const li = document.createElement("li");
    const texteContainer = document.createElement("div");
    texteContainer.textContent = `${g.personnage_cible_nom} — ${g.archetype} (étape ${g.ordre}: ${g.etape_nom}) — ${g.nb_membres} membre(s)`;
    li.appendChild(texteContainer);

    const btn = document.createElement("button");
    btn.textContent = "Rejoindre pour aider";
    btn.addEventListener("click", async () => {
      if (personnagesGlobaux.length === 0) {
        alert("Erreur: tu n'as pas de personnage.");
        return;
      }
      const res = await fetch(`/groupes/${g.id}/rejoindre`, {
        method: "POST",
        headers: entetes(),
        body: JSON.stringify({
          personnage_id: personnagesGlobaux[0].id
        })
      });
      if (!res.ok) {
        alert("Erreur: " + (await res.json()).detail);
        return;
      }
      chargerGroupes();
    });
    li.appendChild(btn);
    liste.appendChild(li);
  }
}

(async () => {
  const jeton = new URLSearchParams(location.search).get("jeton");
  if (jeton) {
    // Mode réinitialisation de mot de passe — afficher le formulaire dédié
    document.getElementById("auth").style.display = "block";
    document.getElementById("jeuConnecte").style.display = "none";
    document.getElementById("authFormes").style.display = "none";
    document.getElementById("authReinitialisationMotDePasse").style.display = "block";
    return;
  }

  const r = await fetch("/personnages", {headers: entetes()});
  if (r.status === 401) {
    document.getElementById("auth").style.display = "block";
    document.getElementById("jeuConnecte").style.display = "none";
    return;
  }
  document.getElementById("auth").style.display = "none";
  document.getElementById("jeuConnecte").style.display = "block";
  chargerPersonnages();
  chargerZones();
  chargerGroupes();
  setInterval(() => fetch("/presence", {method: "POST", headers: entetes()}).catch(() => {}), 30_000);
})();
</script>
</body>
</html>
