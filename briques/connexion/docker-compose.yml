services:
  connexion:
    build: .
    container_name: workplace_connexion
    image: workplace/connexion:0.1.0        # tag épinglé (pas de :latest flottant)
    env_file:
      # Réglages partagés à la racine (source unique). Facultatif.
      - path: ../../.env
        required: false
    ports:
      - "5870:5870"
    environment:
      # Où joindre l'assistant du Cœur (flux SSE). host.docker.internal = l'hôte depuis le conteneur.
      - NOYAU_ASSISTANT_URL=${NOYAU_ASSISTANT_URL:-http://host.docker.internal:5100}
      # Sécurité : un inconnu ne traverse PAS tant qu'il n'est pas relié (mets 1 pour ouvrir en dev).
      - CONNEXION_OUVERT=${CONNEXION_OUVERT:-0}
      - CONNEXION_HISTORIQUE_MAX=${CONNEXION_HISTORIQUE_MAX:-40}
      - CONNEXION_DIR=/data/connexion
      # ⚠ Tokens des réseaux (TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, WHATSAPP_*,
      # DISCORD_*), identifiant par défaut, liste CONNEXION_RESEAUX et clés API_KEYS :
      # à poser dans le .env RACINE — ils sont hérités via `env_file` ci-dessus.
      # NE PAS les redéclarer ici : une ligne `VAR=${VAR:-}` s'interpole depuis le SHELL
      # (pas l'env_file) et ÉCRASE donc la valeur du .env racine par du vide → la brique
      # ne verrait jamais le token (c'était le bug « l'assistant ne répond pas sur
      # Telegram »). Corrigé 2026-06-19.
    volumes:
      - "connexion_data:/data/connexion"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5870/sante')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  connexion_data:
