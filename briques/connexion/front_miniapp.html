<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workplace</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1117);
    --txt: var(--tg-theme-text-color, #e2e8f0);
    --hint: var(--tg-theme-hint-color, #94a3b8);
    --accent: var(--tg-theme-button-color, #7c83ff);
  }
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--txt);
         font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif; text-align:center; }
  .boite { padding:28px; max-width:420px; line-height:1.5; }
  .spin { width:34px; height:34px; margin:0 auto 18px; border:3px solid #ffffff22;
          border-top-color:var(--accent); border-radius:50%; animation:t 0.9s linear infinite; }
  @keyframes t { to { transform:rotate(360deg); } }
  .code { font-size:1.7rem; font-weight:700; letter-spacing:3px; margin:14px 0; }
  .hint { color:var(--hint); font-size:0.9rem; }
</style>
</head>
<body>
  <div class="boite" id="boite">
    <div class="spin"></div>
    <div>Ouverture de Workplace…</div>
  </div>
<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
function msg(html){ document.getElementById('boite').innerHTML = html; }

async function demarrer(){
  if (tg){ tg.ready(); tg.expand(); }
  const initData = tg ? (tg.initData || '') : '';
  if (!initData){
    msg("<b>Ouvre cette page depuis ton bot Telegram</b><div class='hint'>(bouton de menu) — l'authentification est automatique.</div>");
    return;
  }
  try {
    const a = await fetch('/miniapp/session', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ init_data: initData })
    }).then(r => r.json());
    if (a.ok){
      // Session posée (cookie) → on ouvre l'app Workplace complète, servie par le proxy gardé.
      location.replace('/dashboard');
    } else if (a.raison === 'consentement_requis'){
      msg("Tu n'es pas encore relié à un compte Workplace.<br>Communique ce code à l'administrateur :"
        + "<div class='code'>" + (a.code || '—') + "</div>");
    } else if (a.raison === 'non_autorise_allowlist'){
      msg("Ton compte Telegram n'est pas autorisé.");
    } else {
      msg("Authentification impossible <span class='hint'>(" + (a.raison || 'erreur') + ")</span>.");
    }
  } catch(e){ msg("Erreur de connexion : " + e.message); }
}
demarrer();
</script>
</body>
</html>
