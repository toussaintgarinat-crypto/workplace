<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workplace — Assistant</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1117);
    --txt: var(--tg-theme-text-color, #e2e8f0);
    --hint: var(--tg-theme-hint-color, #94a3b8);
    --carte: var(--tg-theme-secondary-bg-color, #1a1d27);
    --accent: var(--tg-theme-button-color, #7c83ff);
    --accent-txt: var(--tg-theme-button-text-color, #0f1117);
    --bord: #2d314833;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--txt); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 16px; font-weight: 600; border-bottom: 1px solid var(--bord); display: flex; align-items: center; gap: 8px; }
  header .pic { width: 9px; height: 9px; border-radius: 50%; background: #22d3ee; box-shadow: 0 0 8px #22d3ee; }
  #fil { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .bulle { max-width: 82%; padding: 9px 14px; border-radius: 14px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--accent); color: var(--accent-txt); border-bottom-right-radius: 4px; }
  .assistant { align-self: flex-start; background: var(--carte); border-bottom-left-radius: 4px; }
  .outil { align-self: flex-start; font-size: 0.74rem; color: var(--hint); display: flex; align-items: center; gap: 7px; }
  .outil .pic { width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; box-shadow: 0 0 6px #f59e0b88; }
  .actions { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 8px; }
  .actions button { font: inherit; font-size: 0.85rem; cursor: pointer; border-radius: 999px; padding: 8px 16px; border: 1px solid var(--accent); background: transparent; color: var(--txt); }
  .actions button.primaire { background: var(--accent); color: var(--accent-txt); font-weight: 600; }
  .actions.fait { opacity: 0.45; pointer-events: none; }
  .info { margin: auto; text-align: center; color: var(--hint); padding: 24px; line-height: 1.5; }
  .code { font-size: 1.6rem; font-weight: 700; letter-spacing: 3px; color: var(--txt); margin: 12px 0; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--bord); }
  input { flex: 1; background: var(--carte); border: 1px solid var(--bord); border-radius: 10px; padding: 11px 14px; color: var(--txt); font-size: 1rem; }
  input:focus { outline: none; border-color: var(--accent); }
  button.envoi { background: var(--accent); color: var(--accent-txt); border: none; border-radius: 10px; padding: 0 18px; font-weight: 600; cursor: pointer; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <header><span class="pic"></span><span id="titre">Assistant Workplace</span></header>
  <div id="fil"><div class="info" id="boot">Connexion à Telegram…</div></div>
  <form id="form" class="hidden" onsubmit="return envoyer(event)">
    <input id="saisie" placeholder="Écris à ton assistant…" autocomplete="off">
    <button class="envoi" type="submit">➤</button>
  </form>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
let INIT = tg ? (tg.initData || '') : '';
const HIST = [];

function el(id){ return document.getElementById(id); }
function bas(){ const f = el('fil'); f.scrollTop = f.scrollHeight; }
function bulle(role, txt){
  const d = document.createElement('div'); d.className = 'bulle ' + role;
  d.textContent = txt; el('fil').appendChild(d); bas(); return d;
}
function pastille(nom){
  const d = document.createElement('div'); d.className = 'outil';
  d.innerHTML = '<span class="pic"></span>'; const s = document.createElement('span');
  s.textContent = nom + ' — confirmation requise'; d.appendChild(s);
  el('fil').appendChild(d); bas();
}
function boutons(actions){
  if (!actions || !actions.length) return;
  const row = document.createElement('div'); row.className = 'actions';
  actions.forEach((a, i) => {
    const b = document.createElement('button'); b.type = 'button';
    if (i === 0) b.className = 'primaire'; b.textContent = a.label;
    b.onclick = () => { row.classList.add('fait'); el('saisie').value = a.envoi; el('form').requestSubmit(); };
    row.appendChild(b);
  });
  el('fil').appendChild(row); bas();
}
function info(html){ el('fil').innerHTML = '<div class="info">' + html + '</div>'; }

async function demarrer(){
  if (tg){ tg.ready(); tg.expand(); }
  if (!INIT){
    info("Ouvre cette page <b>depuis ton bot Telegram</b> (bouton de menu) — "
       + "l'authentification se fait automatiquement.");
    return;
  }
  try {
    const r = await fetch('/miniapp/auth', { method:'POST', headers:{'Content-Type':'application/json'},
                                             body: JSON.stringify({ init_data: INIT }) });
    const a = await r.json();
    if (a.ok){
      if (a.nom) el('titre').textContent = 'Assistant — ' + a.nom;
      el('boot').remove(); el('form').classList.remove('hidden');
      bulle('assistant', "Bonjour 👋 Je pilote toute la solution. Pour toute action, je te demanderai confirmation — un bouton suffira.");
      el('saisie').focus();
    } else if (a.raison === 'consentement_requis'){
      info("Tu n'es pas encore relié à un compte Workplace.<br>Communique ce code à l'administrateur :"
         + '<div class="code">' + (a.code || '—') + '</div>');
    } else if (a.raison === 'non_autorise_allowlist'){
      info("Ton compte Telegram n'est pas sur la liste autorisée.");
    } else {
      info("Authentification impossible (" + (a.raison || 'erreur') + ").");
    }
  } catch(e){ info("Erreur de connexion : " + e.message); }
}

async function envoyer(e){
  e.preventDefault();
  const txt = el('saisie').value.trim(); if (!txt) return false;
  el('saisie').value = '';
  bulle('user', txt); HIST.push({ role:'user', content: txt });
  let assist = null, final = '';
  try {
    const r = await fetch('/miniapp/chat', {
      method:'POST',
      headers: { 'Content-Type':'application/json', 'X-Telegram-Init-Data': INIT },
      body: JSON.stringify({ messages: HIST })
    });
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true){
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream:true });
      const lignes = buf.split('\n\n'); buf = lignes.pop();
      for (const l of lignes){
        const m = l.match(/^data: (.*)$/s); if (!m) continue;
        let evt; try { evt = JSON.parse(m[1]); } catch(_) { continue; }
        if (evt.type === 'resultat_outil'){ if (evt.confirmation) pastille(evt.nom); }
        else if (evt.type === 'actions'){ boutons(evt.actions); }
        else if (evt.type === 'texte_delta' && evt.contenu){
          if (!assist) assist = bulle('assistant', ''); final += evt.contenu; assist.textContent = final; bas();
        }
        else if (evt.type === 'texte' && evt.contenu){
          if (!assist) assist = bulle('assistant', ''); final = evt.contenu; assist.textContent = final; bas();
        }
        else if (evt.type === 'erreur'){ bulle('assistant', '⚠ ' + evt.contenu); }
      }
    }
  } catch(err){ bulle('assistant', '⚠ Erreur de connexion : ' + err.message); }
  if (final) HIST.push({ role:'assistant', content: final });
  return false;
}

demarrer();
</script>
</body>
</html>
