services:
  vision:
    build: .
    container_name: workplace_vision
    image: workplace/vision:0.1.0          # tag épinglé (pas de :latest flottant)
    env_file:
      # Réglages partagés à la racine (source unique). Facultatif.
      - path: ../../.env
        required: false
    ports:
      - "5960:5960"
    environment:
      # Cascade OCR. Souverains LOCAUX d'abord (gratuit/hors-ligne) : MarkItDown + Tesseract
      # sont installés dans l'image → actifs sans config. Hébergés en repli optionnel.
      # Ordre surchargeable (liste, ex. "mistral" ou "tesseract,google") :
      - VISION_PROVIDERS=${VISION_PROVIDERS:-}
      # Langues Tesseract (binaires fra+eng installés dans l'image) :
      - TESSERACT_LANG=${TESSERACT_LANG:-fra+eng}
      # Moteurs hébergés (repli). VIDE = non disponibles → on reste souverain/local.
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_OCR_MODEL=${MISTRAL_OCR_MODEL:-mistral-ocr-latest}
      - GOOGLE_VISION_API_KEY=${GOOGLE_VISION_API_KEY:-}
      # Kill-switch des moteurs locaux (1=actifs). Mettre 0 pour forcer la cascade hébergée.
      - VISION_LOCAL=${VISION_LOCAL:-1}
      # Taille max d'un fichier accepté (octets). Défaut 25 Mo.
      - VISION_MAX_OCTETS=${VISION_MAX_OCTETS:-26214400}
      # Clés API acceptées (séparées par virgule). VIDE = mode ouvert (dev/démo).
      - API_KEYS=
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5960/sante')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
