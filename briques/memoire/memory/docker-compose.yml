services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_USER: memory
      # Défaut = valeur historique (volume memory_pgdata déjà initialisé avec).
      # Cette DB est exposée sur l'hôte (5434) → pour durcir : définir
      # MEMORY_DB_PASSWORD dans .env (voir .env.example), démarrer, puis
      # `ALTER USER memory PASSWORD '...'` en place (le volume conserve ses données).
      POSTGRES_PASSWORD: ${MEMORY_DB_PASSWORD:-memory}
      POSTGRES_DB: memory
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
