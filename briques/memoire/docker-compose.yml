services:

  # Base Postgres + pgvector dédiée à la mémoire (l'extension vector est activée
  # par init-pgvector.sql avant que le backend ne crée ses tables Vector(384)).
  memoire-db:
    build:
      context: .
      dockerfile: Dockerfile.walg
    image: workplace/memoire-db-walg:0.1.0   # tag épinglé (pas de :latest flottant, cf. convention du parc)
    # WAL-G/AWS_* NE SONT PLUS ICI en ${...} interpolé (revue finale whole-branch C1,
    # .superpowers/sdd/progress.md) : l'interpolation est résolue au PARSING du compose,
    # donc dépend de --env-file passé à CHAQUE invocation — vrai sur macOS (Lancer
    # Workplace.command) mais FAUX sur le HP (`docker compose up -d` nu). `env_file:`
    # ci-dessous est lu par Docker Compose quelle que soit l'invocation : AWS_* partagés
    # viennent du .env racine, WALG_S3_PREFIX (propre à cette brique) du .env local.
    env_file:
      - path: ../../.env
        required: false
      - path: .env
        required: false
    environment:
      POSTGRES_USER: memory
      # Défaut = valeur historique (volume memoire_pgdata déjà initialisé avec).
      # Pour durcir : définir MEMOIRE_DB_PASSWORD dans le .env racine ET recréer le volume.
      POSTGRES_PASSWORD: ${MEMOIRE_DB_PASSWORD:-memory}
      POSTGRES_DB: memory
    command:
      - "postgres"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=wal-g wal-push %p"
      - "-c"
      - "wal_level=replica"
      # Sans ça, un segment n'est expédié qu'à ses 16 Mo pleins — cadence réelle observée
      # : HEURES (revue finale whole-branch C3). 60s = RPO borné même en faible écriture.
      - "-c"
      - "archive_timeout=60"
    volumes:
      - memoire_pgdata:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      # proxy_net RETIRÉ (revue finale whole-branch I6) : exposait Postgres en clair sur
      # le bus partagé à 9 autres conteneurs, avec un alias générique côté gateway
      # ("db" — collision DNS différée). memoire-db doit encore joindre minio (WAL-G émet
      # vers AWS_ENDPOINT=http://minio:9000) : au lieu d'exposer memoire-db sur proxy_net,
      # c'est minio qui est désormais attaché EN PLUS à memoire_default (ce réseau
      # `default`), cf. outils/sauvegarde/docker-compose.yml. Connexion sortante seule,
      # rayon d'exposition inchangé pour les 9 autres conteneurs de proxy_net.
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 5s
      retries: 15
    # Sans ça, après un redémarrage de Docker la DB ne remonte pas et le backend
    # (lui en restart) tourne en boucle faute de pouvoir s'y connecter.
    restart: unless-stopped

  # Conteneur JETABLE : pousse la toute première sauvegarde de base WAL-G si elle
  # n'existe pas encore (re-revue finale whole-branch C2, .superpowers/sdd/progress.md —
  # sans elle, les WAL archivés en continu n'ont rien sur quoi se rejouer : restauration
  # impossible malgré restaurer_postgres.sh écrit). Idempotent : sur un déploiement déjà
  # sauvegardé (HP après le premier démarrage, ou local), il constate juste que
  # `wal-g backup-list` n'est pas vide et sort sans rien faire. `restart: "no"` — ce n'est
  # pas un service permanent, juste une étape de démarrage.
  memoire-db-premiere-sauvegarde:
    image: workplace/memoire-db-walg:0.1.0
    depends_on:
      memoire-db:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
      - path: .env
        required: false
    environment:
      - PGHOST=memoire-db
      - PGUSER=memory
      - PGDATABASE=memory
      - PGPASSWORD=${MEMOIRE_DB_PASSWORD:-memory}
    entrypoint: ["sh", "-c"]
    command:
      - |
        if wal-g backup-list 2>/dev/null | grep -q base_; then
          echo "Sauvegarde de base deja presente, rien a faire."
        else
          echo "Aucune sauvegarde de base : premiere sauvegarde en cours..."
          wal-g backup-push /var/lib/postgresql/data
        fi
    # :ro suffit — vérifié en pratique (docker compose run --rm), wal-g backup-push lit
    # PGDATA en lecture seule et écrit ses fichiers temporaires de compression ailleurs
    # (pas dans PGDATA). Si un futur upgrade WAL-G change ce comportement, l'échec sera
    # un "Read-only file system" explicite dans les logs de ce conteneur, pas un défaut
    # silencieux — repasser en lecture-écriture serait alors la correction évidente.
    volumes:
      - memoire_pgdata:/var/lib/postgresql/data:ro
    networks:
      - default
    restart: "no"

  # Backend du projet Memory (désormais inclus dans la brique : ./memory/backend).
  # Schéma auto-créé au démarrage. Embeddings réels via le Gateway (cf. env plus bas).
  memoire-backend:
    build:
      context: ./memory/backend
    env_file:
      # Secrets partagés (JWT_SECRET, LLM_API_KEY) — source unique à la racine.
      - path: ../../.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"   # joindre les services hôtes sous Linux
    environment:
      - DATABASE_URL=postgresql+asyncpg://memory:${MEMOIRE_DB_PASSWORD:-memory}@memoire-db:5432/memory
      # JWT_SECRET vient du .env racine (env_file ci-dessus).
      - GARDIEN_DEFAULT_MODE=off
      # Embeddings réels via le Gateway (Ollama all-MiniLM, 384 dims → Vector(384)).
      # Recherche sémantique active ; si le Gateway tombe, l'embedder dégrade tout seul.
      - LLM_PROVIDER=openai
      - LLM_BASE_URL=http://host.docker.internal:4001/v1
      # LLM_API_KEY vient du .env racine (= clé Gateway partagée).
      - EMBEDDING_MODEL=embedding/all-minilm
    depends_on:
      memoire-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Adaptateur : contrat Workplace (retenir/rappeler) exposé sur l'hôte (5600).
  memoire:
    build: .
    ports:
      - "5600:8000"
    environment:
      - MEMORY_API=http://memoire-backend:8000
      - MEMOIRE_EMAIL=service@workplace.local
      - MEMOIRE_PASSWORD=workplace-memoire
      - MEMOIRE_ESPACE=Workplace
    depends_on:
      - memoire-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/sante')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  memoire_pgdata:

networks:
  default:
  proxy_net:
    external: true
    name: proxy_net
