# Auto-atelier dev (S92) : la brique + un IDE web (code-server) monté sur le dépôt.
#
# Le filet (git worktrees) a besoin du VRAI dépôt Workplace : on monte la racine du projet
# en lecture-écriture dans les deux services. La brique reste SOUVERAINE (mono-user, local) —
# ne JAMAIS exposer ces ports à l'extérieur (un agent de code = exécution arbitraire ; le
# filet + les gates sont ce qui rend ça sûr, pas le réseau).
#
# NB : la brique se prouve aussi très bien en local via `uvicorn main:app --port 5955`
# (c'est le mode des preuves LIVE jusqu'ici). Ce compose sert surtout à câbler l'IDE web.
services:

  dev:
    build: .
    container_name: workplace_dev
    image: workplace/dev:0.7.0   # tag épinglé (pas de :latest flottant)
    env_file:
      - path: ../../.env
        required: false
    # 127.0.0.1 SEULEMENT (revue S240, C-B) : publié sur 0.0.0.0, l'atelier (dépôt en écriture
    # + socket Docker) était joignable de tout le LAN/mesh. Le Cœur le joint par le réseau
    # Docker `proxy_net` (DEV_URL=http://workplace_dev:5955 dans core/docker-compose.yml),
    # plus par host.docker.internal (qui ne voit pas le loopback de l'hôte sous Linux).
    ports:
      - "127.0.0.1:5955:5955"
    networks:
      - default
      - proxy_net
    environment:
      # Le dépôt cible = la racine Workplace montée en rw (le filet a besoin du vrai .git).
      - DEV_REPO=/repo
      # Les worktrees jetables vivent à côté (gitignoré), même filesystem que le dépôt.
      - DEV_ATELIERS=/repo/.dev-ateliers
      - DEV_DB=/data/chantiers.json
      - DEV_TRACES=/data/traces
      - DEV_SKILLS_DIR=/data/skills
      # Le dépôt monté (bind mount) appartient à l'UID de l'hôte, pas à celui du conteneur :
      # git refuse par défaut (« dubious ownership »). Config via env (git ≥2.31, pas de
      # fichier à écrire) → survit à chaque rebuild, sans faire confiance à TOUT le système
      # de fichiers (safe.directory ciblé sur /repo, pas `*`).
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=/repo
      # CORS_ORIGINS : ABSENTE d'`environment` EXPRÈS — elle vient du .env racine via
      # env_file. `${CORS_ORIGINS:-*}` s'interpole depuis le dossier du compose, PAS
      # depuis l'env_file : la ligne écrasait une liste d'origines restreinte par `*`.
      # Piège env-shadow à défaut RÉEL — sans symptôme, contrairement au défaut vide.
      # Le code a déjà `getenv("CORS_ORIGINS", "*")`. Cf. S211 / a1ccb7d.
      # DEV_KEY (garde X-API-Key sur TOUTES les routes sauf /sante ; vide + AUTH_ENABLED=true
      # = atelier fermé, 503 — S240), DEV_REBUILD (1=rebuild réel au merge),
      # DEV_BRIQUES_DEBLOQUEES, GATEWAY_URL/KEY/MODEL : viennent du .env racine via env_file.
      # NE PAS les redéclarer en `=${VAR:-}` (piège « env shadow » : écraserait par du vide).
    volumes:
      - ../..:/repo            # le dépôt Workplace (filet git : worktrees + diff + merge)
      - dev_data:/data         # chantiers.json + traces + skills fabriquées
      # Socket Docker : seulement utile si DEV_REBUILD=1 (rebuild ciblé réel au merge).
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5955/sante')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # IDE web : on relit/édite le code (et le diff d'un chantier) dans le navigateur, en onglet
  # iframe « Atelier dev » du dashboard du Cœur (DEV_IDE_URL côté Cœur → ce service).
  code-server:
    image: codercom/code-server:4.96.4   # version épinglée (pas de :latest)
    container_name: workplace_dev_ide
    # Plus de mot de passe par défaut (revue S240, C-B : « <MOT_DE_PASSE_REVOQUE> » ouvrait un terminal
    # sur le dépôt et le .env). DEV_IDE_PASSWORD vient du .env racine via env_file — lu quelle
    # que soit l'invocation (pas d'interpolation `${…}`, cf. piège env-shadow) ; absente ou
    # vide, le conteneur REFUSE de démarrer.
    env_file:
      - path: ../../.env
        required: false
    entrypoint: ["/bin/sh", "-c",
      "test -n \"$$DEV_IDE_PASSWORD\" || { echo 'DEV_IDE_PASSWORD absente : IDE non démarré' >&2; exit 1; }; export PASSWORD=\"$$DEV_IDE_PASSWORD\"; exec /usr/bin/entrypoint.sh --bind-addr 0.0.0.0:8080 \"$$@\"", "--"]
    # 127.0.0.1 seulement (revue S240, C-B) : l'IDE est un terminal sur le dépôt.
    ports:
      - "127.0.0.1:8744:8080"
    volumes:
      - ../..:/home/coder/project   # ouvre directement le dépôt Workplace
      - dev_ide_config:/home/coder/.config
    # On ouvre le dépôt et on désactive la télémétrie (souveraineté).
    command: ["--disable-telemetry", "--auth", "password", "/home/coder/project"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  dev_data:
  dev_ide_config:

networks:
  default:
  proxy_net:
    external: true
    name: proxy_net
