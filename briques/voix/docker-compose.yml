services:
  voix:
    build:
      context: .
      args:
        # Installer Kokoro (voix naturelle locale) DANS l'image. Lourd (PyTorch) : mettre "0"
        # pour une image légère. "1" = essayable tout de suite (activé par VOIX_KOKORO ci-dessous).
        INSTALL_KOKORO: "1"
        # Installer Coqui XTTS-v2 (voix de LECTURE haut de gamme + clonage S107) DANS l'image.
        # PLUS LOURD encore (torch + coqui-tts ; modèle ~1,8 Go téléchargé au 1er appel). "1" =
        # essayable tout de suite (activé par VOIX_COQUI ci-dessous). Mettre "0" pour une image
        # plus légère. ⚠ Modèle XTTS sous licence CPML (non commerciale) : perso OK.
        INSTALL_COQUI: "1"
    container_name: workplace_voix
    image: workplace/voix:0.7.0          # tag épinglé (pas de :latest flottant)
    env_file:
      # Réglages partagés à la racine (source unique). Facultatif.
      - path: ../../.env
        required: false
    ports:
      - "5985:5985"
    environment:
      # Ordre des moteurs (souverain Piper d'abord). Ex. "openai" ou "elevenlabs,openai".
      - VOIX_PROVIDERS=${VOIX_PROVIDERS:-}
      # Format audio par défaut (opus = conteneur Ogg, idéal message vocal Telegram).
      - VOIX_FORMAT=${VOIX_FORMAT:-opus}
      # CORS_ORIGINS : ABSENTE d'`environment` EXPRÈS — elle vient du .env racine via
      # env_file. `${CORS_ORIGINS:-*}` s'interpole depuis le dossier du compose, PAS
      # depuis l'env_file : la ligne écrasait une liste d'origines restreinte par `*`.
      # Piège env-shadow à défaut RÉEL — sans symptôme, contrairement au défaut vide.
      # Le code a déjà `getenv("CORS_ORIGINS", "*")`. Cf. S211 / a1ccb7d.
      # Dossier persistant du choix de moteur (bascule « en un clic », cf. /voix/moteur).
      - VOIX_DIR=/data/voix
      # Active Kokoro au runtime (cohérent avec INSTALL_KOKORO=1 au build). Valeur STATIQUE
      # (pas d'interpolation ${...} → pas de piège env-shadow). Mettre 0 pour revenir à Piper seul.
      - VOIX_KOKORO=1
      - KOKORO_VOICE=${KOKORO_VOICE:-ff_siwis}
      # Active Coqui XTTS au runtime (cohérent avec INSTALL_COQUI=1 au build). Voix de LECTURE
      # haut de gamme : la choisir pour le rôle « lecture » via la tuile Voix (POST /voix/moteur
      # {role:"lecture"}). Valeur STATIQUE (pas d'interpolation ${...} → pas de piège env-shadow).
      # Out-of-the-box : un locuteur INTÉGRÉ par défaut suffit (COQUI_SPEAKER_DEFAUT côté code),
      # aucun fichier à fournir. Mettre 0 pour désactiver Coqui sans rebuild.
      # DÉSACTIVÉ 2026-06-25 : XTTS (torch + modèle ~1,8 Go) saturait la RAM de l'hôte et figeait
      # Docker. Kokoro (VOIX_KOKORO=1) suffit pour la lecture naturelle. Repasser à 1 sur une
      # machine qui encaisse (GPU conseillé).
      - VOIX_COQUI=0
      - COQUI_LANG=${COQUI_LANG:-fr}
      # Le modèle XTTS-v2 est sous licence CPML (NON COMMERCIALE). Coqui exige d'accepter ces
      # conditions avant de télécharger le modèle (~1,8 Go, au 1er appel). On l'accepte ici pour
      # un usage PERSONNEL/souverain (la brique le redit dans l'UI/README). Pour un usage
      # commercial : NE PAS poser ce drapeau et préférer une voix de lecture hébergée/sous licence.
      - COQUI_TOS_AGREED=1
      # Cache des modèles XTTS (persiste le téléchargement entre recreate).
      - TTS_HOME=/data/voix/coqui
      # ⚠ COQUI_SPEAKER_WAV (clone un timbre depuis un WAV) et COQUI_SPEAKER (locuteur intégré
      # nommé) : à poser dans le .env RACINE si besoin — hérités via env_file. NE PAS les
      # redéclarer ici en `VAR=${VAR:-}` (piège env-shadow : écrase la valeur racine par du vide).
      # ⚠ Clés des voix de lecture HÉBERGÉES (OPENAI_API_KEY, ELEVENLABS_API_KEY) : .env RACINE
      # aussi (mêmes clés que le temps réel). Le texte SORT de la maison avec ces moteurs.
      # ── Chat vocal TEMPS RÉEL (realtime.py) — OPT-IN, inerte sans clé ────────────
      # Nom de l'assistant annoncé dans la session vocale (safe à déclarer ici).
      - VOIX_AGENT_NOM=${VOIX_AGENT_NOM:-Assistant}
      # ⚠ Clés des fournisseurs temps réel (OPENAI_API_KEY / GEMINI_API_KEY|GOOGLE_API_KEY /
      # XAI_API_KEY) : à poser dans le .env RACINE — hérités via env_file. NE PAS les
      # redéclarer ici en `VAR=${VAR:-}` (piège env-shadow : écrase la valeur racine par du vide).
      # ⚠ PIPER_VOICE (chemin du modèle .onnx monté dans /voix-modeles) vient du .env RACINE
      # via env_file. NE PAS le redéclarer ici en `PIPER_VOICE=${PIPER_VOICE:-}` : ça
      # s'interpole depuis le SHELL (vide) et ÉCRASE la valeur du .env racine → Piper jamais
      # détecté (piège env-shadow, cf. connexion 2026-06-19). Sans modèle, repli honnête.
      # ⚠ Clés des fournisseurs hébergés (OPENAI_API_KEY, ELEVENLABS_API_KEY, GATEWAY_KEY,
      # GATEWAY_URL) et API_KEYS : à poser dans le .env RACINE — hérités via env_file.
      # NE PAS les redéclarer ici en `VAR=${VAR:-}` (s'interpole depuis le SHELL et écrase
      # la valeur du .env racine par du vide — cf. piège corrigé sur connexion 2026-06-19).
      # ── Moteurs LOCAUX NATURELS (kokoro / coqui) — OPT-IN, INERTES par défaut ────
      # Voix bien plus naturelle que Piper, 100 % locale, mais LOURDE (gros modèle, GPU
      # conseillé). À n'activer que sur une machine qui encaisse. Pour activer :
      #   1) installer la dépendance dans l'image : décommenter la ligne voulue dans
      #      requirements-voix-naturelle.txt et l'ajouter au Dockerfile (ou rebuild dédié) ;
      #   2) poser dans le .env RACINE (PAS ici — piège env-shadow) : VOIX_KOKORO=1 (et
      #      éventuellement KOKORO_VOICE=ff_siwis) OU VOIX_COQUI=1 + COQUI_SPEAKER_WAV=/...wav ;
      #   3) préférer la voix naturelle : VOIX_PROVIDERS=kokoro,piper (piper reste le repli).
      # Tant que ce n'est pas fait, ces moteurs sont « non disponibles » → Piper, sans changement.
    volumes:
      # Modèles de voix Piper (.onnx + .onnx.json), en lecture seule. Pose-les dans ./voix-modeles.
      - "${PIPER_VOICE_DIR:-./voix-modeles}:/voix-modeles:ro"
      # Persistance du choix de moteur (survit aux recreate).
      - "./data:/data/voix"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5985/sante')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
