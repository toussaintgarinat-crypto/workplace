general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  port: 4000
  ui_access_mode: "all"

litellm_settings:
  # Ignore les paramètres non supportés par le provider (ex. encoding_format=base64
  # envoyé par le client OpenAI sur les embeddings Ollama) au lieu d'échouer en 400.
  drop_params: true

model_list:
  - model_name: openai/gpt-4o
    litellm_params:
      model: openrouter/openai/gpt-4o
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  - model_name: openai/gpt-4o-mini
