  # ── FOURNISSEURS DIRECTS (alternatives à OpenRouter) ────────────────────────
  # Même motif que les blocs ci-dessus : chaque entrée est ACTIVÉE par sa propre
  # clé d'env et reste INERTE tant que la clé est vide (déclarée vide dans
  # .env.example). Pour qu'un client (ou toi) bascule de fournisseur, il suffit de
  # poser la clé puis de pointer GATEWAY_MODEL / REPLI_PAYANT sur le nom voulu —
  # aucun code à toucher. Les noms portent le préfixe du fournisseur pour éviter
  # toute collision avec les mêmes modèles servis via OpenRouter (`openai/…`,
  # `anthropic/…`). Copie-colle une ligne pour ajouter un autre modèle d'un
  # fournisseur déjà présent.

  # Anthropic en direct (sans le markup OpenRouter). Clé: ANTHROPIC_API_KEY.
  - model_name: anthropic-direct/claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: anthropic-direct/claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # OpenAI en direct. Clé: OPENAI_API_KEY.
  - model_name: openai-direct/gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
  - model_name: openai-direct/gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  # Embeddings OpenAI en direct — alternative MEILLEURE pour le FR court au all-minilm local.
  # Sélectionnable via ROUTAGE_EMBEDDING_MODEL=text-embedding-3-small (routage d'outils) ou
  # LLM_CACHE_EMBEDDING (cache sémantique). Inerte tant qu'OPENAI_API_KEY n'est pas posée
  # (renvoie alors une erreur d'auth → le routage retombe honnêtement sur « tous les outils »).
  # OpenRouter ne sert PAS d'embeddings : c'est pourquoi on passe par OpenAI en direct.
  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

  # Groq (inférence très rapide, OpenAI-compatible). Clé: GROQ_API_KEY.
  - model_name: groq/llama-3.3-70b
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  # DeepSeek en direct (moins cher que via OpenRouter). Clé: DEEPSEEK_API_KEY.
  - model_name: deepseek-direct/chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
  - model_name: deepseek-direct/reasoner
    litellm_params:
      model: deepseek/deepseek-reasoner
      api_key: os.environ/DEEPSEEK_API_KEY

  # Mistral (souverain UE). Clé: MISTRAL_API_KEY.
  - model_name: mistral/large
    litellm_params:
      model: mistral/mistral-large-latest
      api_key: os.environ/MISTRAL_API_KEY
  - model_name: mistral/small
    litellm_params:
      model: mistral/mistral-small-latest
      api_key: os.environ/MISTRAL_API_KEY

  # Google Gemini en direct (AI Studio, clé distincte d'OpenRouter). Clé: GEMINI_API_KEY.
  - model_name: gemini-direct/2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-direct/2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  # ENDPOINT PERSONNALISÉ — n'importe quel service OpenAI-compatible (Together,
  # Fireworks, Perplexity, un proxy interne…) SANS rien hardcoder ici : tout est
  # piloté par env. Poser les 3 variables suffit ; vide = inerte.
  #   CUSTOM_LLM_URL     ex. https://api.together.xyz/v1
  #   CUSTOM_LLM_API_KEY clé du service
  #   CUSTOM_LLM_MODEL   ex. openai/meta-llama/Llama-3.3-70B-Instruct-Turbo
  - model_name: custom/llm
    litellm_params:
      model: os.environ/CUSTOM_LLM_MODEL
      api_base: os.environ/CUSTOM_LLM_URL
      api_key: os.environ/CUSTOM_LLM_API_KEY
      timeout: 60
      num_retries: 0

  # Ollama local — OLLAMA_URL = IP du serveur Ollama (NetBird, LAN, ou localhost)
  # Ces entrées sont ignorées si OLLAMA_URL est vide
  - model_name: ollama/llama3.2
    litellm_params:
      model: ollama/llama3.2
      api_base: os.environ/OLLAMA_URL

  - model_name: ollama/llama3.3
    litellm_params:
      model: ollama/llama3.3
      api_base: os.environ/OLLAMA_URL

  # Modèles réellement présents en local (vérifiés via `ollama list` le 2026-06-02)
  - model_name: ollama/llama3
    litellm_params:
      model: ollama/llama3
      api_base: os.environ/OLLAMA_URL

  - model_name: ollama/gemma4
    litellm_params:
      model: ollama/gemma4:e4b
      api_base: os.environ/OLLAMA_URL

  # IA locale générique (LM Studio, llama.cpp server, ou tout serveur OpenAI-compatible).
  # 100 % local & gratuit, aucune donnée ne sort de la machine. On pointe l'URL via
  # LOCAL_OPENAI_URL (ex. LM Studio :1234/v1, llama.cpp :8080/v1). Le nom de modèle est
  # géré par le serveur local (il sert le modèle chargé) ; clé factice. Entrée inerte
  # tant que LOCAL_OPENAI_URL est vide. (Ollama a ses propres entrées ci-dessus.)
  - model_name: local/llm
    litellm_params:
      model: openai/local
      api_base: os.environ/LOCAL_OPENAI_URL
      api_key: os.environ/LOCAL_API_KEY
      timeout: 60
      num_retries: 0

  # POOL DE MUSCLES (roadmap « partage de puissance de calcul », brique calcul + mesh
  # NetBird). Quand on a PLUSIEURS machines de calcul (Mac/PC), chacune a SA propre
  # entrée : c'est le `modele_gateway` que la brique calcul renvoie pour le nœud élu, et
  # que le Cœur met en tête de cascade. Chaque api_base pointe l'adresse MESH de la
  # machine (ex. http://100.x.y.z:11434/v1 via NetBird) — aucun port ouvert sur la box.
  # Entrée inerte tant que MUSCLE_n_URL est vide. Ajouter local/muscle-3, -4… au besoin.
  - model_name: local/muscle-1
    litellm_params:
      model: openai/local
      api_base: os.environ/MUSCLE_1_URL
      api_key: os.environ/LOCAL_API_KEY
      timeout: 60
      num_retries: 0
  - model_name: local/muscle-2
    litellm_params:
      model: openai/local
      api_base: os.environ/MUSCLE_2_URL
      api_key: os.environ/LOCAL_API_KEY
      timeout: 60
      num_retries: 0

  # REPLI SOUVERAIN sur le Cœur (S62) : petit modèle CPU tournant SUR la machine du Cœur
  # (Proxmox), serveur OpenAI-compatible (llama.cpp/Ollama léger). C'est le DERNIER maillon
  # SOUVERAIN de la cascade — quand le Muscle dort et que les gratuits échouent, on répond
  # ici (lent mais 100 % local, aucune donnée ne sort) plutôt que de tomber sur le payant
  # cloud. Inerte tant que LOCAL_CPU_URL est vide. Honnêteté : ce n'est PAS le gros modèle,
  # le modèle réellement utilisé est journalisé tel quel.
  - model_name: local/cpu
    litellm_params:
      model: openai/local
      api_base: os.environ/LOCAL_CPU_URL
      api_key: os.environ/LOCAL_API_KEY
      timeout: 120
      num_retries: 0

  # Embeddings locaux (Ollama all-MiniLM, 384 dims) — alimente la brique mémoire
  # (Memory, colonne Vector(384)). Local, gratuit, rapide même sur CPU.
  - model_name: embedding/all-minilm
    litellm_params:
      model: ollama/all-minilm
      api_base: os.environ/OLLAMA_URL

virtual_keys:
  - key: sk-forge
    key_alias: forge
    max_budget: 10
    budget_duration: 1mo
    models: auto

  - key: sk-assistant
    key_alias: assistant
    max_budget: 10
    budget_duration: 1mo
    models: auto
