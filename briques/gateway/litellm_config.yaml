      model: openrouter/google/gemini-2.5-flash-preview
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  # DeepSeek V4 Flash — cerveau par défaut de l'assistant du Cœur (rapide, contexte
  # 1M, function-calling). Payant (≠ free/*), donc déclaré explicitement ici : le
  # sync des modèles gratuits ne le touche pas (il ne gère que le bloc AUTO ci-dessous).
  - model_name: deepseek/deepseek-v4-flash
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  # ── Modèles GÉNÉRATIFS (image / vidéo) ──────────────────────────────────────
  # Utilisés par le fournisseur `gateway` des briques images (5950) et vidéo (5970).
  # Sans ces entrées, mettre `gateway` en tête de IMAGE_PROVIDERS/VIDEO_PROVIDERS
  # échouait (modèle inconnu de LiteLLM). Passent par OpenRouter (clé déjà posée),
  # appelés via /chat/completions avec `modalities:["image"|"video","text"]`.
  # Doivent rester alignés sur les défauts codés : briques/images/fournisseurs.py
  # (IMAGE_GATEWAY_MODEL) et briques/video/fournisseurs.py (VIDEO_GATEWAY_MODEL).
  - model_name: google/gemini-2.5-flash-image
    litellm_params:
      model: openrouter/google/gemini-2.5-flash-image
      api_key: os.environ/OPENROUTER_API_KEY
