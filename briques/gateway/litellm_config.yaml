  # ⚠️ Endpoint DÉDIÉ /zen/go/v1 : le simple /zen/v1 facture le solde Zen → 401 si
  # vide. Préfixe `go/` (et NON `free/`) : ces modèles consomment le forfait, donc le
  # routeur économe (routage.py) ne les choisit pas automatiquement. Clé dans .env
  # (OPENCODE_ZEN_API_KEY). Liste vérifiée via /zen/go/v1/models le 2026-06-14.
  - model_name: go/deepseek-v4-flash
    litellm_params:
      model: openai/deepseek-v4-flash
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      api_base: https://opencode.ai/zen/go/v1
