general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  port: 4000
  ui_access_mode: "all"

litellm_settings:
  # Ignore les paramètres non supportés par le provider (ex. encoding_format=base64
  # envoyé par le client OpenAI sur les embeddings Ollama) au lieu d'échouer en 400.
  drop_params: true

# S202 — mise au frigo des modèles morts. Sans ces réglages (aucun `router_settings`
# n'existait), un modèle gratuit retiré du catalogue OpenRouter était retenté à CHAQUE
# requête : 1746 lignes d'erreur / 24 h, dont 48 NotFoundError sur un seul slug.
# Le sync quotidien (brique `gateway-sync`) finit par le supprimer, mais entre deux passages
# il faut que la cascade cesse de le tenter tout de suite — d'où ce complément, volontairement
# indépendant du sync (cf. ADR docs/decisions/2026-07-27-sync-modeles-gratuits-gateway.md).
router_settings:
  # 1 h : un modèle disparu du catalogue ne réapparaît pas dans la minute.
  cooldown_time: 3600
  allowed_fails: 3
  allowed_fails_policy:
    # Le modèle n'existe pas / plus : rien à réessayer, on l'écarte au premier refus.
    NotFoundErrorAllowedFails: 0
    # Clé invalide : réessayer ne fera que répéter l'erreur.
    AuthenticationErrorAllowedFails: 0
    # À l'inverse, les gratuits rate-limitent BEAUCOUP et restent parfaitement utilisables :
    # les écarter pour ça viderait la cascade de ses modèles sains.
    RateLimitErrorAllowedFails: 100

model_list:
  - model_name: openai/gpt-4o
    litellm_params:
      model: openrouter/openai/gpt-4o
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  - model_name: openai/gpt-4o-mini
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  - model_name: anthropic/claude-sonnet-4-6
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4-6
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  - model_name: google/gemini-2.5-flash-preview
    litellm_params:
      model: openrouter/google/gemini-2.5-flash-preview
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  # DeepSeek V4 Flash — cerveau par défaut de l'assistant du Cœur (rapide, contexte
  # 1M, function-calling). Payant (≠ free/*), donc déclaré ici : le sync ne touche QUE
  # les modèles préfixés `free/`, qu'il gère désormais par l'API (S202).
  - model_name: deepseek/deepseek-v4-flash
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  # ── Modèles GÉNÉRATIFS (image / vidéo) ──────────────────────────────────────
  # Utilisés par le fournisseur `gateway` des briques images (5950) et vidéo (5970).
  # Sans ces entrées, mettre `gateway` en tête de IMAGE_PROVIDERS/VIDEO_PROVIDERS
  # échouait (modèle inconnu de LiteLLM). Passent par OpenRouter (clé déjà posée),
  # appelés via /chat/completions avec `modalities:["image"|"video","text"]`.
  # Doivent rester alignés sur les défauts codés : briques/images/fournisseurs.py
  # (IMAGE_GATEWAY_MODEL) et briques/video/fournisseurs.py (VIDEO_GATEWAY_MODEL).
  - model_name: google/gemini-2.5-flash-image
    litellm_params:
      model: openrouter/google/gemini-2.5-flash-image
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
  - model_name: google/veo-3-fast
    litellm_params:
      model: openrouter/google/veo-3-fast
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  # Les modèles gratuits (free/*) NE SONT PLUS déclarés ici : ils sont créés et supprimés à
  # chaud via l'API LiteLLM par la brique `gateway-sync`, et persistés dans gateway-db.
  # Les laisser dans ce fichier ferait cohabiter deux sources de vérité — LiteLLM recharge son
  # YAML au démarrage et réintroduirait les modèles morts par-dessus l'état de la base.
  # Cf. ADR docs/decisions/2026-07-27-sync-modeles-gratuits-gateway.md.

  # --- OpenCode Go ------------------------------------------------------------
