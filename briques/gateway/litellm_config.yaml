  # AUTO-FREE-MODELS-END

  # Ollama local — OLLAMA_URL = IP du serveur Ollama (NetBird, LAN, ou localhost)
  # Ces entrées sont ignorées si OLLAMA_URL est vide
  - model_name: ollama/llama3.2
    litellm_params:
      model: ollama/llama3.2
      api_base: os.environ/OLLAMA_URL

  - model_name: ollama/llama3.3
    litellm_params:
      model: ollama/llama3.3
      api_base: os.environ/OLLAMA_URL

  # Modèles réellement présents en local (vérifiés via `ollama list` le 2026-06-02)
  - model_name: ollama/llama3
    litellm_params:
      model: ollama/llama3
      api_base: os.environ/OLLAMA_URL

  - model_name: ollama/gemma4
    litellm_params:
      model: ollama/gemma4:e4b
      api_base: os.environ/OLLAMA_URL

  # IA locale générique (LM Studio, llama.cpp server, ou tout serveur OpenAI-compatible).
  # 100 % local & gratuit, aucune donnée ne sort de la machine. On pointe l'URL via
  # LOCAL_OPENAI_URL (ex. LM Studio :1234/v1, llama.cpp :8080/v1). Le nom de modèle est
  # géré par le serveur local (il sert le modèle chargé) ; clé factice. Entrée inerte
  # tant que LOCAL_OPENAI_URL est vide. (Ollama a ses propres entrées ci-dessus.)
  - model_name: local/llm
    litellm_params:
      model: openai/local
      api_base: os.environ/LOCAL_OPENAI_URL
      api_key: os.environ/LOCAL_API_KEY
      timeout: 60
      num_retries: 0

  # Embeddings locaux (Ollama all-MiniLM, 384 dims) — alimente la brique mémoire
  # (Memory, colonne Vector(384)). Local, gratuit, rapide même sur CPU.
  - model_name: embedding/all-minilm
    litellm_params:
      model: ollama/all-minilm
      api_base: os.environ/OLLAMA_URL

virtual_keys:
  - key: sk-forge
    key_alias: forge
    max_budget: 10
    budget_duration: 1mo
    models: auto

  - key: sk-assistant
    key_alias: assistant
    max_budget: 10
    budget_duration: 1mo
    models: auto
