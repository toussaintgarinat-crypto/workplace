general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  port: 4000
  ui_access_mode: "all"

litellm_settings:
  # Ignore les paramètres non supportés par le provider (ex. encoding_format=base64
  # envoyé par le client OpenAI sur les embeddings Ollama) au lieu d'échouer en 400.
  drop_params: true

model_list:
  - model_name: openai/gpt-4o
    litellm_params:
      model: openrouter/openai/gpt-4o
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  - model_name: openai/gpt-4o-mini
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  - model_name: anthropic/claude-sonnet-4-6
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4-6
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  - model_name: google/gemini-2.5-flash-preview
    litellm_params:
      model: openrouter/google/gemini-2.5-flash-preview
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  # DeepSeek V4 Flash — cerveau par défaut de l'assistant du Cœur (rapide, contexte
  # 1M, function-calling). Payant (≠ free/*), donc déclaré explicitement ici : le
  # sync des modèles gratuits ne le touche pas (il ne gère que le bloc AUTO ci-dessous).
  - model_name: deepseek/deepseek-v4-flash
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  # AUTO-FREE-MODELS-START — 2026-06-06 20:38 (12 modèles)
