services:

  db:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: litellm
      # Défaut = valeur historique (le volume gateway_db a été initialisé avec).
      # Pour durcir : définir GATEWAY_DB_PASSWORD dans le .env racine ET recréer
      # le volume (un changement de mot de passe ne s'applique pas à un volume déjà initialisé).
      POSTGRES_PASSWORD: ${GATEWAY_DB_PASSWORD:-litellm}
      POSTGRES_DB: litellm
    volumes:
      - gateway_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gateway:
    image: ghcr.io/berriai/litellm:v1.86.2
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4001:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # joindre les services hôtes sous Linux
    env_file:
      # .env local (clé OpenRouter, gérée par l'app) PUIS .env racine (clé maîtresse
      # partagée). Le second l'emporte sur le premier en cas de doublon.
      - path: .env
        required: false
      - path: ../../.env
        required: false
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DATABASE_URL=postgresql://litellm:${GATEWAY_DB_PASSWORD:-litellm}@db:5432/litellm
      # URL du serveur Ollama (ex: http://100.x.x.x:11434 via NetBird, ou http://192.168.1.x:11434 en LAN)
      # Laisser vide si pas d'Ollama — les modèles ollama/* seront ignorés
      - OLLAMA_URL=${OLLAMA_URL:-}
      # IA locale générique (modèle `local/llm`) — serveur OpenAI-compatible :
      #   LM Studio  → http://host.docker.internal:1234/v1
      #   llama.cpp  → http://host.docker.internal:8080/v1
      #   (Ollama a déjà ses entrées ollama/* ; sinon http://host.docker.internal:11434/v1)
      # Vide = modèle local/llm inerte. Clé factice acceptée par ces serveurs.
      - LOCAL_OPENAI_URL=${LOCAL_OPENAI_URL:-}
      - LOCAL_API_KEY=${LOCAL_API_KEY:-sk-local}
      # Pool de muscles (brique calcul + mesh NetBird) : adresse MESH OpenAI-compatible
      # de chaque machine de calcul. Vide = entrée local/muscle-n inerte. Cf. GUIDE-mesh-netbird.md.
      - MUSCLE_1_URL=${MUSCLE_1_URL:-}
      - MUSCLE_2_URL=${MUSCLE_2_URL:-}
      # Repli souverain CPU sur le Cœur (modèle `local/cpu`) — serveur OpenAI-compatible
      # local (llama.cpp/Ollama léger). Vide = inerte. Cf. REPLI_SOUVERAIN côté Cœur.
      - LOCAL_CPU_URL=${LOCAL_CPU_URL:-}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - default
      - proxy_net
    restart: unless-stopped

  # Brique `gateway-sync` (S202) : entretient les modèles free/* de LiteLLM par son API.
  # Déclarée ICI et non dans son propre compose, à dessein — elle doit joindre LiteLLM sur
  # le réseau interne du projet (`http://gateway:4000`), ce qu'un compose séparé ne permet
  # qu'au prix d'un réseau externe au nom fragile. Son code et son manifest vivent bien dans
  # `briques/gateway-sync/` (le registre du Cœur scanne `briques/*/manifest.json`).
  # Cf. ADR docs/decisions/2026-07-27-sync-modeles-gratuits-gateway.md.
  gateway-sync:
    build:
      context: ../gateway-sync
    ports:
      - "4002:4002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
      - path: ../../.env
        required: false
    environment:
      - LITELLM_URL=http://gateway:4000
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - FREE_MODELS_TOP_N=${FREE_MODELS_TOP_N:-12}
      - GATEWAY_SYNC_KEY=${GATEWAY_SYNC_KEY:-}
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4002/sante')\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - default
      - proxy_net
    restart: unless-stopped

volumes:
  gateway_db:

networks:
  default:
  proxy_net:
    external: true
    name: proxy_net
