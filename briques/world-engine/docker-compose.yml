services:
  world-engine:
    build: .
    container_name: workplace_world_engine
    image: workplace/world-engine:0.1.0
    env_file:
      - path: ../../.env
        required: false
      # Fichier LOCAL à cette brique (non versionné, comme tout .env — voir
      # .gitignore), chargé APRÈS le .env racine : sert à donner à world-engine
      # une seconde clé API_KEYS distincte de WORLD_ENGINE_KEY, SANS jamais
      # écrire cette variable dans le .env racine partagé par ~22 autres
      # briques (l'y écrire activerait l'auth fail-closed pour TOUTES ces
      # briques, effet de bord hors périmètre — voir mesure de charge Sprint E).
      - path: .env
        required: false
    ports:
      - "6230:6230"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # joindre `personnages` sous Linux
    environment:
      # 6220 réassigné à `jeu-factions-public` (déjà en service sur le HP au
      # moment du premier déploiement LIVE de world-engine) — voir
      # docs/superpowers/reports/2026-08-25-world-engine-mesure-charge-rapport.md
      - PORT=6230
      - PERSONNAGES_URL=http://host.docker.internal:5900
      - WORLD_ENGINE_DB=/data/world_engine.db
      # PERSONNAGES_KEY (clé d'intégration Cœur) vient du .env racine via env_file —
      # NE PAS la redéclarer en `PERSONNAGES_KEY=${PERSONNAGES_KEY:-}` (piège « env
      # shadow » : chaîne vide qui écraserait la vraie valeur).
    volumes:
      - world_engine_data:/data   # lignées d'enfants (Sprint A) + mondes spatiaux (Sprint B)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6230/sante')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  world_engine_data:
