        const ExportTab = ({ project, answers, settings }) => {
            const [saveStatus, setSaveStatus] = React.useState(null);
            const [saving, setSaving] = React.useState(false);
            const [modules, setModules] = React.useState({
                auth: true, blog: true, 'multi-tenant': false,
                notifications: false, analytics: false, payment: false,
                email: false, realtime: false
            });
            const slug = project.name.replace(/\s+/g, '-').replace(/[^a-z0-9\-]/gi, '');
            const dateStr = new Date().toISOString().slice(0,10);

            const MODULE_META = {
                auth: { icon: '🔐', label: 'Authentification', desc: 'Login, register, sessions JWT' },
                blog: { icon: '📝', label: 'Blog / CMS', desc: 'Articles, catégories, tags, commentaires' },
                'multi-tenant': { icon: '🏢', label: 'Multi-tenant', desc: 'Organisations, invitations, rôles' },
                notifications: { icon: '🔔', label: 'Notifications', desc: 'In-app + email, préférences' },
                analytics: { icon: '📈', label: 'Analytics', desc: 'Pages vues, événements, stats' },
                payment: { icon: '💳', label: 'Paiement', desc: 'Stripe, webhooks, page de prix' },
                email: { icon: '📧', label: 'Email', desc: 'Emails transactionnels, templates' },
                realtime: { icon: '⚡', label: 'Temps réel', desc: 'WebSockets, notifications live' },
            };

            // ─── Rapport Markdown complet ───────────────────────────────
            const generateFullReport = () => {
                const allQ = Object.values(QUESTIONS_DATA).flatMap(p => p.questions);
                const now = new Date().toLocaleDateString('fr-FR', { year:'numeric', month:'long', day:'numeric' });
                let md = '';

                // En-tête
                md += `# Rapport Projet — ${project.name}\n\n`;
                md += `> Généré le ${now} avec Strategic App Builder Studio\n\n`;
                md += `---\n\n`;

                // Métadonnées
                md += `## Informations générales\n\n`;
                md += `| Champ | Valeur |\n|---|---|\n`;
                md += `| **Nom** | ${project.name} |\n`;
                md += `| **Type** | ${project.type === 'reverse' ? 'Reverse Engineering' : project.type === 'etl' ? `Import ETL (${project.etlSource || ''})` : 'Projet Custom'} |\n`;
                md += `| **Créé le** | ${new Date(project.createdAt).toLocaleDateString('fr-FR')} |\n`;
                md += `| **Modifié le** | ${new Date(project.updatedAt || project.createdAt).toLocaleDateString('fr-FR')} |\n`;
                if (settings?.llm) md += `| **IA utilisée** | ${settings.llm.provider} — ${settings.llm.model} |\n`;
                md += `\n`;

                // Progression
                if (project.completion) {
                    md += `## Progression du questionnaire\n\n`;
                    const phases = ['Phase 1 : Questions Magiques', 'Phase 2 : Questions Technologiques', 'Phase 3 : Business & Stratégie', 'Phase 4 : Humain & Éthique'];
                    ['phase1','phase2','phase3','phase4'].forEach((p, i) => {
                        const pct = project.completion[p] || 0;
                        const bar = '█'.repeat(Math.round(pct/10)) + '░'.repeat(10 - Math.round(pct/10));
                        md += `- **${phases[i]}** : ${bar} ${pct}%\n`;
                    });
                    md += `\n`;
                }

                // Questionnaire
                md += `## Réponses au questionnaire\n\n`;
                ['phase1','phase2','phase3','phase4'].forEach(phase => {
                    const phaseData = QUESTIONS_DATA[phase];
                    const phaseAnswers = phaseData.questions.filter(q => answers[q.id]);
                    if (phaseAnswers.length === 0) return;
                    md += `### ${phaseData.title || phase}\n\n`;
                    phaseAnswers.forEach(q => {
                        const val = answers[q.id];
                        md += `**${q.text}**\n\n`;
                        md += `${Array.isArray(val) ? val.map(v => `- ${v}`).join('\n') : val}\n\n`;
                    });
                });

                // Analyse Reverse Engineering
                if (project.reverseAnalysis) {
                    md += `## Analyse Reverse Engineering\n\n`;
                    const ra = project.reverseAnalysis;
                    if (ra.summary) md += `${ra.summary}\n\n`;
                    if (ra.technologies?.length) md += `**Technologies :** ${ra.technologies.join(', ')}\n\n`;
                    if (ra.features?.length) { md += `**Fonctionnalités :**\n`; ra.features.forEach(f => md += `- ${f}\n`); md += `\n`; }
                    if (ra.bricks?.length) {
                        md += `**Briques techniques :**\n\n| Brique | Estimation |\n|---|---|\n`;
                        ra.bricks.forEach(b => md += `| ${b.name} | ${b.days} jour(s) |\n`);
                        md += `\n`;
                        if (ra.totalDays) md += `**Total estimé :** ${ra.totalDays} jours (MVP : ${ra.mvpDays || '?'} jours)\n\n`;
                    }
                    if (ra.mvpSuggestion) md += `**Suggestion MVP :** ${ra.mvpSuggestion}\n\n`;
                }

                // Recommandations IA
                if (project.recommendations) {
                    md += `## Recommandations IA\n\n`;
                    md += `${typeof project.recommendations === 'string' ? project.recommendations : JSON.stringify(project.recommendations, null, 2)}\n\n`;
                }

                // Base documentaire
                if (project.docs?.length) {
                    md += `## Base documentaire (RAG)\n\n`;
                    md += `| Document | Taille | Chunks | Indexé |\n|---|---|---|---|\n`;
                    project.docs.forEach(d => {
                        md += `| ${d.name} | ${(d.chars/1000).toFixed(1)}k chars | ${d.chunks} | ${d.indexed ? '✅' : '⏳'} |\n`;
                    });
                    md += `\n`;
                }

                // Coûts
                if (project.costs?.totalUSD > 0) {
                    md += `## Suivi des coûts\n\n`;
                    const c = project.costs;
                    md += `| Poste | Appels | Coût USD |\n|---|---|---|\n`;
                    md += `| LLM | ${c.llmCalls || 0} | $${(c.llmUSD || 0).toFixed(4)} |\n`;
                    md += `| OCR | ${c.ocrCalls || 0} | $${(c.ocrUSD || 0).toFixed(4)} |\n`;
                    md += `| Embedding | ${c.embCalls || 0} | $${(c.embUSD || 0).toFixed(4)} |\n`;
                    md += `| **Total** | — | **$${(c.totalUSD || 0).toFixed(4)}** |\n\n`;
                }

                md += `---\n\n*Rapport généré par [Strategic App Builder Studio](https://github.com) — ${now}*\n`;
                return md;
            };

            // ─── Sauvegarde locale (File System Access API) ────────────
            const saveToLocalFile = async (content, suggestedName, mimeType, ext) => {
                if (window.showSaveFilePicker) {
                    try {
                        const handle = await window.showSaveFilePicker({
                            suggestedName,
                            types: [{ description: ext.toUpperCase() + ' file', accept: { [mimeType]: ['.' + ext] } }],
                            startIn: 'documents'
                        });
                        const writable = await handle.createWritable();
                        await writable.write(content);
                        await writable.close();
                        return { saved: true, name: handle.name };
                    } catch(e) {
                        if (e.name === 'AbortError') return { saved: false, aborted: true };
                        // Fallback si API non supportée
                    }
                }
                // Fallback download
                const blob = new Blob([content], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = suggestedName; a.click();
                URL.revokeObjectURL(url);
                return { saved: true, name: suggestedName, downloaded: true };
            };

            // ─── Export Markdown complet → fichier local ────────────────
            const exportMarkdownLocal = async () => {
                setSaving(true); setSaveStatus(null);
                try {
                    const content = generateFullReport();
                    const result = await saveToLocalFile(content, `rapport-${slug}-${dateStr}.md`, 'text/markdown', 'md');
                    if (result.aborted) { setSaveStatus(null); return; }
                    setSaveStatus({ success: `✅ Rapport Markdown sauvegardé${result.downloaded ? ' (Téléchargements)' : ' : ' + result.name}` });
                } catch(e) {
                    setSaveStatus({ error: '❌ ' + e.message });
                } finally { setSaving(false); }
            };

            // ─── Export PDF → fenêtre stylée → Enregistrer en PDF ──────
            const exportPDF = () => {
                const content = generateFullReport();
                const html = content
                    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
                    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                    .replace(/^---$/gm, '<hr>')
                    .replace(/^- (.+)$/gm, '<li>$1</li>')
                    .replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`)
                    .replace(/^\| (.+) \|$/gm, row => {
                        const cells = row.split('|').filter(c => c.trim() && !c.trim().match(/^[\-:]+$/));
                        return '<tr>' + cells.map(c => `<td>${c.trim()}</td>`).join('') + '</tr>';
                    })
                    .replace(/(<tr>.*<\/tr>\n?)+/g, m => `<table>${m}</table>`)
                    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
                    .replace(/`([^`]+)`/g, '<code>$1</code>')
                    .replace(/\n\n/g, '</p><p>')
                    .replace(/^\s*<\/p><p>\s*(#{1,3}|<hr|<ul|<table|<blockquote)/gm, '$1');

                const w = window.open('', '_blank');
                w.document.write(`<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8">
<title>Rapport — ${project.name}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  @page { margin: 20mm 15mm; }
  body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11pt; line-height: 1.6; color: #222; background: white; padding: 30px; max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22pt; color: #667eea; border-bottom: 3px solid #667eea; padding-bottom: 10px; margin: 20px 0 15px; }
  h2 { font-size: 15pt; color: #444; border-left: 4px solid #667eea; padding-left: 12px; margin: 25px 0 12px; page-break-after: avoid; }
  h3 { font-size: 12pt; color: #555; margin: 18px 0 8px; page-break-after: avoid; }
  p { margin: 6px 0 10px; }
  ul { margin: 6px 0 10px 20px; }
  li { margin: 3px 0; }
  table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 10pt; page-break-inside: avoid; }
  td, th { border: 1px solid #ddd; padding: 7px 10px; text-align: left; }
  tr:nth-child(even) { background: #f8f9fa; }
  tr:first-child td { background: #667eea; color: white; font-weight: 600; }
  code { background: #f0f0f0; padding: 2px 5px; border-radius: 3px; font-size: 10pt; font-family: monospace; }
  blockquote { border-left: 3px solid #667eea; padding-left: 15px; color: #666; font-style: italic; margin: 10px 0; }
  hr { border: none; border-top: 1px solid #ddd; margin: 20px 0; }
  strong { font-weight: 700; }
  .header-meta { background: #f8f9fa; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; font-size: 10pt; color: #666; }
  @media print {
    body { padding: 0; }
    h2 { page-break-before: auto; }
    .no-print { display: none; }
  }
</style>
</head><body>
<div class="no-print" style="background:#667eea;color:white;padding:12px 20px;border-radius:8px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center">
  <span>📄 <strong>Rapport : ${project.name}</strong> — Utilise <strong>Fichier → Imprimer → Enregistrer en PDF</strong> pour choisir l'emplacement</span>
  <button onclick="window.print()" style="background:white;color:#667eea;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600">🖨️ Imprimer / Enregistrer PDF</button>
</div>
<p>${html}</p>
</body></html>`);
                w.document.close();
                setTimeout(() => w.print(), 800);
            };

            // ─── Exports rapides (existants) ────────────────────────────
            const exportJSON = async () => {
                setSaving(true); setSaveStatus(null);
                try {
                    const activeModules = Object.entries(modules).filter(([,v]) => v).map(([k]) => k);
                    const content = JSON.stringify({ ...project, answers, schema: project.schema, modules: activeModules, exportedAt: new Date().toISOString() }, null, 2);
                    const result = await saveToLocalFile(content, `${slug}-${dateStr}.json`, 'application/json', 'json');
                    if (!result.aborted) setSaveStatus({ success: `✅ JSON sauvegardé${result.downloaded ? ' (Téléchargements)' : ' : ' + result.name}` });
                } catch(e) { setSaveStatus({ error: '❌ ' + e.message }); }
                finally { setSaving(false); }
            };

            const copyToClipboard = () => {
                navigator.clipboard.writeText(generateFullReport()).then(() => setSaveStatus({ success: '✅ Rapport copié dans le presse-papiers !' }));
            };

            // ─── V3.0 — Export Blueprint ────────────────────────────────

        const SchemaTab = ({ project, onSave }) => {
            const schema = project.schema || { entities: [] };
            const [entities, setEntities] = useState(schema.entities || []);
            const [editingIdx, setEditingIdx] = useState(null);
            const [showTemplate, setShowTemplate] = useState(false);
            const [newEntityName, setNewEntityName] = useState('');

            const saveSchema = (updatedEntities) => {
                setEntities(updatedEntities);
                onSave({ ...project, schema: { entities: updatedEntities } });
            };

            const addEntity = () => {
                const name = newEntityName.trim();
                if (!name) return;
                saveSchema([...entities, { name, fields: [] }]);
                setNewEntityName('');
                setEditingIdx(entities.length);
            };

            const addEntityFromTemplate = (templateKey) => {
                const tmpl = ENTITY_TEMPLATES[templateKey];
                if (!tmpl) return;
                saveSchema([...entities, { name: tmpl.name, icon: tmpl.icon, fields: JSON.parse(JSON.stringify(tmpl.fields)) }]);
                setShowTemplate(false);
                setEditingIdx(entities.length);
            };

            const removeEntity = (idx) => {
                const updated = entities.filter((_, i) => i !== idx);
                saveSchema(updated);
                if (editingIdx === idx) setEditingIdx(null);
                else if (editingIdx > idx) setEditingIdx(editingIdx - 1);
            };

            const updateEntity = (idx, field, value) => {
                const updated = [...entities];
                updated[idx] = { ...updated[idx], [field]: value };
                saveSchema(updated);
            };

            const addField = (entityIdx) => {
                const updated = [...entities];
                updated[entityIdx] = {
                    ...updated[entityIdx],
                    fields: [...(updated[entityIdx].fields || []), { name: '', type: 'String', form: 'text', label: '', required: false }]
                };
                saveSchema(updated);
            };

            const updateField = (entityIdx, fieldIdx, fieldKey, value) => {
                const updated = [...entities];
                const fields = [...(updated[entityIdx].fields || [])];
                fields[fieldIdx] = { ...fields[fieldIdx], [fieldKey]: value };
                if (fieldKey === 'name' && !fields[fieldIdx].label) {
                    fields[fieldIdx].label = value.charAt(0).toUpperCase() + value.slice(1);
                }
                updated[entityIdx] = { ...updated[entityIdx], fields };
                saveSchema(updated);
            };

            const removeField = (entityIdx, fieldIdx) => {
                const updated = [...entities];
                updated[entityIdx] = {
                    ...updated[entityIdx],
                    fields: (updated[entityIdx].fields || []).filter((_, i) => i !== fieldIdx)
                };
                saveSchema(updated);
            };

            const moveEntity = (idx, dir) => {
                const to = idx + dir;
                if (to < 0 || to >= entities.length) return;
                const updated = [...entities];
                [updated[idx], updated[to]] = [updated[to], updated[idx]];
                saveSchema(updated);
                if (editingIdx === idx) setEditingIdx(to);
                else if (editingIdx === to) setEditingIdx(idx);
            };

            const entity = editingIdx !== null ? entities[editingIdx] : null;

            return (
                <div className="schema-tab" style={{ padding: '16px' }}>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '16px' }}>
                        <h3 style={{ margin: 0, fontSize: '1.1em', fontWeight: 600 }}>🗄️ Schéma de données</h3>
                        <div style={{ display: 'flex', gap: '8px' }}>
                            <button className="btn btn-secondary" onClick={() => setShowTemplate(true)} style={{ fontSize: '0.82em', padding: '6px 14px' }}>
                                📚 Modèles
                            </button>
                        </div>
                    </div>

                    {entities.length === 0 && !entity && (
                        <div style={{ textAlign: 'center', padding: '32px 16px', color: '#8892b0', background: '#1a1a2e', borderRadius: '10px', border: '1px dashed #2a2a40' }}>
                            <div style={{ fontSize: '32px', marginBottom: '8px' }}>🗄️</div>
                            <p style={{ marginBottom: '12px' }}>Aucune entité définie</p>
                            <p style={{ fontSize: '0.85em', marginBottom: '16px' }}>Ajoutez des entités manuellement ou importez depuis les modèles</p>
                            <button className="btn btn-primary" onClick={() => setShowTemplate(true)} style={{ fontSize: '0.85em' }}>📚 Importer un modèle</button>
                        </div>
                    )}

                    {/* Entity List */}
                    <div style={{ display: 'flex', gap: '16px' }}>
                        <div style={{ flex: entity ? '0 0 280px' : '1', maxHeight: '500px', overflowY: 'auto' }}>
                            {entities.map((e, i) => (
                                <div key={i}
                                    onClick={() => setEditingIdx(i)}
                                    style={{
                                        display: 'flex', alignItems: 'center', gap: '10px',
                                        padding: '10px 12px', borderRadius: '8px', cursor: 'pointer',
                                        background: editingIdx === i ? '#2a2a45' : 'transparent',
                                        border: '1px solid ' + (editingIdx === i ? '#6c5ce7' : '#2a2a40'),
                                        marginBottom: '6px', transition: 'all .15s'
                                    }}>
                                    <span style={{ fontSize: '1.2em' }}>{e.icon || '📦'}</span>
                                    <div style={{ flex: 1 }}>
                                        <div style={{ fontWeight: 500, fontSize: '0.9em' }}>{e.name}</div>
                                        <div style={{ fontSize: '0.75em', color: '#8892b0' }}>{(e.fields || []).length} champ{(e.fields || []).length > 1 ? 's' : ''}</div>
                                    </div>
                                    <div style={{ display: 'flex', gap: '4px' }}>
                                        <button onClick={(ev) => { ev.stopPropagation(); moveEntity(i, -1); }} disabled={i === 0}
                                            style={{ background: 'none', border: 'none', color: '#8892b0', cursor: 'pointer', padding: '2px 4px', fontSize: '0.8em' }}>↑</button>
                                        <button onClick={(ev) => { ev.stopPropagation(); moveEntity(i, 1); }} disabled={i === entities.length - 1}
                                            style={{ background: 'none', border: 'none', color: '#8892b0', cursor: 'pointer', padding: '2px 4px', fontSize: '0.8em' }}>↓</button>
                                        <button onClick={(ev) => { ev.stopPropagation(); removeEntity(i); }}
                                            style={{ background: 'none', border: 'none', color: '#e17055', cursor: 'pointer', padding: '2px 4px', fontSize: '0.9em' }}>✕</button>
                                    </div>
                                </div>
                            ))}
                            {/* Add entity form */}
                            <div style={{ display: 'flex', gap: '6px', marginTop: '8px' }}>
                                <input
                                    placeholder="Nouvelle entité..."
                                    value={newEntityName}
                                    onChange={e => setNewEntityName(e.target.value)}
                                    onKeyDown={e => { if (e.key === 'Enter') addEntity(); }}
                                    style={{ flex: 1, background: '#1a1a2e', border: '1px solid #2a2a40', borderRadius: '6px', padding: '8px 10px', color: '#e4e4ed', fontSize: '0.82em' }}
                                />
                                <button onClick={addEntity} disabled={!newEntityName.trim()}
                                    style={{ background: '#6c5ce7', color: '#fff', border: 'none', borderRadius: '6px', padding: '8px 12px', cursor: 'pointer', fontSize: '0.82em', opacity: newEntityName.trim() ? 1 : 0.4 }}>
                                    + Ajouter
                                </button>
                            </div>
                        </div>

                        {/* Entity detail editor */}
                        {entity && (
                            <div style={{ flex: 1, borderLeft: '1px solid #2a2a40', paddingLeft: '16px', maxHeight: '500px', overflowY: 'auto' }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '12px' }}>
                                    <input value={entity.icon || ''} onChange={e => updateEntity(editingIdx, 'icon', e.target.value)}
                                        placeholder="📦" style={{ width: '40px', textAlign: 'center', background: '#1a1a2e', border: '1px solid #2a2a40', borderRadius: '6px', padding: '6px', color: '#e4e4ed', fontSize: '1em' }} />
                                    <input value={entity.name || ''} onChange={e => updateEntity(editingIdx, 'name', e.target.value)}
                                        style={{ flex: 1, background: '#1a1a2e', border: '1px solid #2a2a40', borderRadius: '6px', padding: '8px 10px', color: '#e4e4ed', fontSize: '0.9em', fontWeight: 600 }} />
                                    <button onClick={() => setEditingIdx(null)} style={{ background: 'none', border: 'none', color: '#8892b0', cursor: 'pointer', fontSize: '1.1em' }}>✕</button>
                                </div>

                                {/* Fields */}
                                <div style={{ fontSize: '0.78em', color: '#8892b0', marginBottom: '8px', textTransform: 'uppercase', letterSpacing: '0.05em' }}>
                                    Champs
                                </div>
                                {(entity.fields || []).map((f, fi) => (
                                    <div key={fi} style={{ background: '#1a1a2e', border: '1px solid #2a2a40', borderRadius: '6px', padding: '10px', marginBottom: '6px' }}>
                                        <div style={{ display: 'flex', gap: '6px', alignItems: 'center', marginBottom: '6px' }}>
                                            <input value={f.name} onChange={e => updateField(editingIdx, fi, 'name', e.target.value)}
                                                placeholder="nom_champ" style={{ flex: 1, background: '#12121a', border: '1px solid #2a2a40', borderRadius: '4px', padding: '4px 8px', color: '#e4e4ed', fontSize: '0.82em', fontFamily: 'monospace' }} />
                                            <select value={f.type} onChange={e => updateField(editingIdx, fi, 'type', e.target.value)}
                                                style={{ background: '#12121a', border: '1px solid #2a2a40', borderRadius: '4px', padding: '4px 6px', color: '#e4e4ed', fontSize: '0.78em' }}>
                                                {PRISMA_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                                            </select>
                                            <select value={f.form} onChange={e => updateField(editingIdx, fi, 'form', e.target.value)}
                                                style={{ background: '#12121a', border: '1px solid #2a2a40', borderRadius: '4px', padding: '4px 6px', color: '#e4e4ed', fontSize: '0.78em' }}>
                                                {FORM_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                                            </select>
                                            <button onClick={() => removeField(editingIdx, fi)} style={{ background: 'none', border: 'none', color: '#e17055', cursor: 'pointer', fontSize: '0.85em', padding: '2px 4px' }}>✕</button>
                                        </div>
                                        <div style={{ display: 'flex', gap: '6px', alignItems: 'center' }}>
                                            <input value={f.label || ''} onChange={e => updateField(editingIdx, fi, 'label', e.target.value)}
                                                placeholder="Libellé" style={{ flex: 1, background: '#12121a', border: '1px solid #2a2a40', borderRadius: '4px', padding: '4px 8px', color: '#e4e4ed', fontSize: '0.78em' }} />
                                            <label style={{ fontSize: '0.75em', color: '#8892b0', display: 'flex', alignItems: 'center', gap: '4px' }}>
                                                <input type="checkbox" checked={!!f.required} onChange={e => updateField(editingIdx, fi, 'required', e.target.checked)} style={{ accentColor: '#6c5ce7' }} /> Req.
                                            </label>
                                            <input value={f.default !== undefined ? String(f.default) : ''} onChange={e => updateField(editingIdx, fi, 'default', e.target.value)}
                                                placeholder="Défaut" style={{ width: '70px', background: '#12121a', border: '1px solid #2a2a40', borderRadius: '4px', padding: '4px 6px', color: '#e4e4ed', fontSize: '0.75em' }} />
                                        </div>
                                    </div>
                                ))}
                                <button onClick={() => addField(editingIdx)}
                                    style={{ width: '100%', background: 'none', border: '1px dashed #2a2a40', borderRadius: '6px', padding: '8px', color: '#6c5ce7', cursor: 'pointer', fontSize: '0.82em', marginTop: '4px' }}>
                                    + Ajouter un champ
                                </button>
                            </div>
                        )}
                    </div>

                    {/* Template library modal */}
                    {showTemplate && (
                        <div style={{ position: 'fixed', inset: 0, zIndex: 1000, background: 'rgba(0,0,0,0.6)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '24px' }}
                            onClick={e => { if (e.target === e.currentTarget) setShowTemplate(false); }}>
                            <div style={{ background: '#1a1a2e', border: '1px solid #2a2a40', borderRadius: '12px', padding: '24px', maxWidth: '500px', width: '100%', maxHeight: '80vh', overflowY: 'auto' }}>
                                <h4 style={{ margin: '0 0 16px', fontSize: '1em', fontWeight: 600 }}>📚 Modèles d'entités</h4>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                                    {Object.entries(ENTITY_TEMPLATES).map(([key, tmpl]) => (
                                        <div key={key} onClick={() => addEntityFromTemplate(key)}
                                            style={{ display: 'flex', alignItems: 'center', gap: '10px', padding: '12px', borderRadius: '8px', border: '1px solid #2a2a40', cursor: 'pointer', transition: 'all .15s' }}
                                            onMouseEnter={e => e.currentTarget.style.borderColor = '#6c5ce7'}
                                            onMouseLeave={e => e.currentTarget.style.borderColor = '#2a2a40'}>
                                            <span style={{ fontSize: '1.5em' }}>{tmpl.icon}</span>
                                            <div>
                                                <div style={{ fontWeight: 500, fontSize: '0.85em' }}>{tmpl.name}</div>
                                                <div style={{ fontSize: '0.72em', color: '#8892b0' }}>{tmpl.fields.length} champs</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => setShowTemplate(false)}
                                    style={{ width: '100%', marginTop: '12px', background: '#2a2a40', color: '#e4e4ed', border: 'none', borderRadius: '6px', padding: '8px', cursor: 'pointer', fontSize: '0.85em' }}>
                                    Fermer
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ============================================
        // ONGLET AGENTS BMAD
        // ============================================

        const BmadAgentsTab = ({ answers, project, settings, setShowSettings, onCostUpdate }) => {
            const [briefLoading, setBriefLoading] = useState(false);
            const [brief, setBrief] = useState(null);

            const agents = [
                { name: 'Analyst', icon: '🔬', role: 'Analyse des besoins et recherche marche', commands: '/analyze, /research, /competitive-analysis' },
                { name: 'PM', icon: '📋', role: 'Gestion de projet, PRD, priorites', commands: '/create-prd, /prioritize, /roadmap' },
                { name: 'Architect', icon: '🏗️', role: 'Architecture technique, design patterns', commands: '/design-system, /tech-stack, /architecture' },
                { name: 'UX Designer', icon: '🎨', role: 'Experience utilisateur, wireframes, flows', commands: '/wireframe, /user-flow, /prototype' },
                { name: 'Scrum Master', icon: '🏃', role: 'Sprints, ceremonies, user stories', commands: '/create-stories, /sprint-plan, /retrospective' },
                { name: 'Dev Lead', icon: '💻', role: 'Implementation, code review, standards', commands: '/implement, /review, /refactor' },
                { name: 'QA Engineer', icon: '🧪', role: 'Tests, qualite, validation', commands: '/test-plan, /qa-checklist, /bug-report' },
                { name: 'DevOps', icon: '🚀', role: 'CI/CD, deploiement, monitoring', commands: '/deploy, /pipeline, /monitor' }
            ];

            const pipelineSteps = ['Questionnaire', 'Brief', 'PRD', 'Architecture', 'Stories', 'Code'];

            const generateBrief = async () => {
                if (needsLLMKey(settings)) {
                    setShowSettings(true);
                    return;
                }
                setBriefLoading(true);
                try {
                    const answersText = Object.entries(answers).map(([key, val]) => {
                        const allQ = Object.values(QUESTIONS_DATA).flatMap(p => p.questions);
                        const q = allQ.find(q => q.id === key);
                        return q ? `${q.text}: ${Array.isArray(val) ? val.join(', ') : val}` : '';
                    }).filter(Boolean).join('\n');

                    const prompt = `Tu es un Business Analyst de la methode BMAD (Build Measure Analyze Deploy). A partir de ces reponses de questionnaire, genere un Brief de projet structure.

Projet: ${project.name}
Reponses:
${answersText || '(Aucune reponse encore)'}

Genere un brief structure avec:
1. Resume executif (2-3 phrases)
2. Probleme a resoudre
3. Public cible
4. Fonctionnalites cles (liste)
5. Contraintes techniques
6. Criteres de succes
7. Prochaines etapes BMAD recommandees

Reponds en texte structure (pas de JSON).`;

                    const result = await callLLM(settings, [{ role: 'user', content: prompt }]);
                    const costUSD = estimateCostUSD('llm', settings.llm.model, prompt.length, result.length);
                    if (onCostUpdate) onCostUpdate({ llmCalls: 1, llmUSD: costUSD, ocrCalls: 0, ocrUSD: 0, embCalls: 0, embTokens: 0, embUSD: 0 });
                    setBrief(result);
                } catch (err) {
                    alert('Erreur: ' + err.message);
                } finally {
                    setBriefLoading(false);
                }
            };

            return (
                <div className="fade-in">
                    <h2 style={{ marginBottom: '10px' }}>🤖 Agents BMAD</h2>
                    <p style={{ color: '#666', marginBottom: '20px' }}>
                        La <strong>BMAD Method</strong> (Build Measure Analyze Deploy) orchestre 21 agents IA agiles pour couvrir tout le cycle de vie d'un projet logiciel.
                    </p>

                    <div className="alert alert-info mb-20">
                        <strong>Installation locale :</strong> <code style={{ background: '#e0e0e0', padding: '2px 8px', borderRadius: '4px' }}>npx bmad-method install</code> — ajoute les agents directement dans ton IDE (Cursor, VS Code, Windsurf).
                    </div>

                    <h3 style={{ marginBottom: '15px' }}>Pipeline BMAD</h3>
                    <div className="bmad-pipeline">
                        {pipelineSteps.map((step, idx) => (
                            <React.Fragment key={step}>
                                <div className={`bmad-pipeline-step ${idx === 0 ? 'active' : ''}`}>{step}</div>
                                {idx < pipelineSteps.length - 1 && <span className="bmad-pipeline-arrow">→</span>}
                            </React.Fragment>
                        ))}
                    </div>

                    <h3 style={{ marginTop: '30px', marginBottom: '15px' }}>8 Agents Cles</h3>
                    <div className="bmad-agent-grid">
                        {agents.map((agent, idx) => (
                            <div key={idx} className="bmad-agent-card">
                                <div style={{ fontSize: '1.8em', marginBottom: '8px' }}>{agent.icon}</div>
                                <strong style={{ fontSize: '1.1em' }}>{agent.name}</strong>
                                <p style={{ color: '#666', margin: '8px 0', fontSize: '0.9em', lineHeight: '1.4' }}>{agent.role}</p>
                                <div style={{ fontSize: '0.8em', color: 'var(--primary)', fontFamily: 'monospace' }}>{agent.commands}</div>
                            </div>
                        ))}
                    </div>

                    <div style={{ marginTop: '30px', padding: '25px', background: 'var(--light)', borderRadius: '15px' }}>
                        <h3 style={{ marginBottom: '15px' }}>📄 Generer un Brief BMAD</h3>
                        <p style={{ color: '#666', marginBottom: '15px' }}>
                            A partir des reponses au questionnaire, l'IA genere un brief de projet structure selon la methode BMAD.
                        </p>
                        {(needsLLMKey(settings)) && (
                            <div className="alert alert-warning mb-20">
                                ⚠️ Configure ta cle API dans les Reglages pour generer un brief.
                                <button onClick={() => setShowSettings(true)} style={{ background: 'var(--primary)', color: 'white', border: 'none', borderRadius: '5px', padding: '5px 15px', cursor: 'pointer', marginLeft: '10px' }}>⚙️ Reglages</button>
                            </div>
                        )}
                        <button className="btn btn-primary" onClick={generateBrief} disabled={briefLoading || needsLLMKey(settings)}>
                            {briefLoading ? '⏳ Generation en cours...' : '✨ Generer un Brief BMAD'}
                        </button>

                        {brief && (
                            <div style={{ marginTop: '20px', background: 'white', padding: '25px', borderRadius: '10px', whiteSpace: 'pre-wrap', lineHeight: '1.7', border: '2px solid var(--primary)' }}>
                                {brief}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ============================================
        // ONGLET MEMOIRE PAI
        // ============================================

        const PaiMemoryTab = ({ paiMemory, setPaiMemory, projects, currentProject, settings, setShowSettings, onCostUpdate }) => {
            const [contextLoading, setContextLoading] = useState(false);
            const [contextResult, setContextResult] = useState(null);
            const [newNote, setNewNote] = useState({ hot: '', warm: '', cold: '' });

            const now = Date.now();
            const thirtyDays = 30 * 24 * 60 * 60 * 1000;

            const hotProjects = projects.filter(p => p.id === currentProject.id);
            const warmProjects = projects.filter(p => p.id !== currentProject.id && (now - new Date(p.updatedAt || p.createdAt).getTime()) < thirtyDays);
            const coldProjects = projects.filter(p => p.id !== currentProject.id && (now - new Date(p.updatedAt || p.createdAt).getTime()) >= thirtyDays);

            const addNote = (tier) => {
                if (!newNote[tier].trim()) return;
                setPaiMemory(prev => ({
                    ...prev,
                    [tier]: { ...prev[tier], notes: [...prev[tier].notes, { id: Date.now(), text: newNote[tier], date: new Date().toISOString() }] }
                }));
                setNewNote(prev => ({ ...prev, [tier]: '' }));
            };

            const removeNote = (tier, noteId) => {
                setPaiMemory(prev => ({
                    ...prev,
                    [tier]: { ...prev[tier], notes: prev[tier].notes.filter(n => n.id !== noteId) }
                }));
            };

            const generateContext = async () => {
                if (needsLLMKey(settings)) { setShowSettings(true); return; }
                setContextLoading(true);
                try {
                    const memoryText = ['hot', 'warm', 'cold'].map(tier => {
                        const tierProjects = tier === 'hot' ? hotProjects : tier === 'warm' ? warmProjects : coldProjects;
                        const notes = paiMemory[tier].notes.map(n => n.text).join(', ');
                        return `[${tier.toUpperCase()}] Projets: ${tierProjects.map(p => p.name).join(', ') || 'aucun'}. Notes: ${notes || 'aucune'}`;
                    }).join('\n');

                    const prompt = `Tu es un systeme de memoire contextuelle PAI (Personal AI). Genere un fichier memory.md structure a partir de ces donnees:

${memoryText}

Projet actif: ${currentProject.name}

Genere un resume contexte concis (memory.md) qui peut etre injecte dans un prompt IA pour donner du contexte sur l'utilisateur, ses projets et ses notes. Format Markdown, 15-20 lignes max.`;

                    const result = await callLLM(settings, [{ role: 'user', content: prompt }]);
                    const costUSD = estimateCostUSD('llm', settings.llm.model, prompt.length, result.length);
                    if (onCostUpdate) onCostUpdate({ llmCalls: 1, llmUSD: costUSD, ocrCalls: 0, ocrUSD: 0, embCalls: 0, embTokens: 0, embUSD: 0 });
                    setContextResult(result);
                } catch (err) {
                    alert('Erreur: ' + err.message);
                } finally {
                    setContextLoading(false);
                }
            };

            const renderTier = (tier, label, emoji, projects, borderClass) => (
                <div className={`pai-tier ${borderClass}`}>
                    <h4 style={{ marginBottom: '10px' }}>{emoji} {label}</h4>
                    {projects.length > 0 ? (
                        <div style={{ marginBottom: '10px' }}>
                            {projects.map(p => (
                                <span key={p.id} style={{ display: 'inline-block', background: 'var(--light)', padding: '4px 12px', borderRadius: '15px', fontSize: '0.85em', margin: '3px' }}>
                                    {p.name}
                                </span>
                            ))}
                        </div>
                    ) : (
                        <p style={{ color: '#999', fontSize: '0.85em', marginBottom: '10px' }}>Aucun projet</p>
                    )}

                    {paiMemory[tier].notes.map(note => (
                        <div key={note.id} className="pai-note">
                            <span style={{ fontSize: '0.9em' }}>{note.text}</span>
                            <button onClick={() => removeNote(tier, note.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--danger)', fontSize: '1.1em' }}>✕</button>
                        </div>
                    ))}

                    <div style={{ display: 'flex', gap: '8px', marginTop: '10px' }}>
                        <input
                            type="text"
                            className="input-field"
                            placeholder="Ajouter une note..."
                            value={newNote[tier]}
                            onChange={e => setNewNote(prev => ({ ...prev, [tier]: e.target.value }))}
                            onKeyPress={e => e.key === 'Enter' && addNote(tier)}
                            style={{ flex: 1, padding: '8px 12px' }}
                        />
                        <button className="btn btn-primary" onClick={() => addNote(tier)} style={{ padding: '8px 16px' }}>+</button>
                    </div>
                </div>
            );

            return (
                <div className="fade-in">
                    <h2 style={{ marginBottom: '10px' }}>🧠 Memoire PAI</h2>
                    <p style={{ color: '#666', marginBottom: '20px' }}>
                        Systeme de memoire contextuelle a 3 niveaux pour enrichir tes interactions avec l'IA.
                    </p>

                    <div className="alert alert-info mb-20">
                        <strong>Comment ca marche :</strong> Les projets sont automatiquement classes selon leur activite. Ajoute des notes manuelles pour enrichir le contexte. Genere un fichier <code>memory.md</code> injectable dans tes prompts IA.
                    </div>

                    {renderTier('hot', 'Hot — Projet actif', '🔴', hotProjects, 'hot')}
                    {renderTier('warm', 'Warm — Projets recents (< 30 jours)', '🟠', warmProjects, 'warm')}
                    {renderTier('cold', 'Cold — Projets anciens (> 30 jours)', '🔵', coldProjects, 'cold')}

                    <div style={{ marginTop: '25px', padding: '25px', background: 'var(--light)', borderRadius: '15px' }}>
                        <h3 style={{ marginBottom: '15px' }}>📄 Generer Contexte IA</h3>
                        {(needsLLMKey(settings)) && (
                            <div className="alert alert-warning mb-20">
                                ⚠️ Configure ta cle API pour generer le contexte.
                                <button onClick={() => setShowSettings(true)} style={{ background: 'var(--primary)', color: 'white', border: 'none', borderRadius: '5px', padding: '5px 15px', cursor: 'pointer', marginLeft: '10px' }}>⚙️ Reglages</button>
                            </div>
                        )}
                        <button className="btn btn-primary" onClick={generateContext} disabled={contextLoading || needsLLMKey(settings)}>
                            {contextLoading ? '⏳ Generation...' : '✨ Generer memory.md'}
                        </button>
                        {contextResult && (

        // ============================================
        // ONGLET IPCRA
        // ============================================

        const IpcraTab = ({ ipcraData, setIpcraData, settings, setShowSettings, onCostUpdate }) => {

            const wizardQuestions = [

                { question: "Est-ce une responsabilite/role recurrent ?", yes: 'casquettes', no: 3 },
                { question: "Est-ce une ressource/reference utile ?", yes: 'ressources', no: 'inbox' },
                { question: "Est-ce encore pertinent ?", yes: 'ressources', no: 'archives' }
            ];

            const startWizard = () => {
                if (!wizardItem.trim()) return;
                setWizardStep(0);
                setWizardResult(null);
            };

            const answerWizard = (answer) => {
                const current = wizardQuestions[wizardStep];
                const next = answer ? current.yes : current.no;
                if (typeof next === 'number') {
                    setWizardStep(next);
                } else {
                    setWizardResult(next);
                    setIpcraData(prev => ({
                        ...prev,
                        [next]: [...prev[next], { id: Date.now(), text: wizardItem, date: new Date().toISOString() }]

            const removeItem = (category, itemId) => {
                setIpcraData(prev => ({
                    ...prev,
                    [category]: prev[category].filter(i => typeof i === 'object' ? i.id !== itemId : true)

            const addCasquette = () => {
                if (!newCasquette.trim()) return;
                setIpcraData(prev => ({ ...prev, casquettes: [...prev.casquettes, newCasquette.trim()] }));

            const removeCasquette = (idx) => {

            const addSlowBurn = () => {
                if (!newSlowBurn.trim()) return;
                setIpcraData(prev => ({ ...prev, slowBurn: [...prev.slowBurn, { id: Date.now(), text: newSlowBurn, date: new Date().toISOString() }] }));

            const removeSlowBurn = (id) => {

            const generateStructure = async () => {
                if (needsLLMKey(settings)) { setShowSettings(true); return; }
                setStructureLoading(true);

                    const dataText = `Inbox: ${ipcraData.inbox.map(i => i.text).join(', ') || 'vide'}
Projets: ${ipcraData.projets.map(i => i.text).join(', ') || 'vide'}
Casquettes: ${ipcraData.casquettes.join(', ')}
Ressources: ${ipcraData.ressources.map(i => i.text).join(', ') || 'vide'}
Archives: ${ipcraData.archives.map(i => i.text).join(', ') || 'vide'}
Slow Burn: ${ipcraData.slowBurn.map(i => i.text).join(', ') || 'vide'}`;

                    const prompt = `Tu es un expert de la methode IPCRA (Inbox, Projets, Casquettes, Ressources, Archives) d'Eliott Meunier. Analyse ces donnees et propose une organisation optimale:

${dataText}

Propose:
1. Des reorganisations si certains elements sont mal classes
2. Des projets qui pourraient etre archives
3. Des casquettes manquantes
4. Comment optimiser le flux de travail
5. L'equation qualite: comment ameliorer (capacite IA x qualite contexte)

Reponds en texte structure.`;

        // ============================================
        // ONGLET COÛTS
        // ============================================
        const CostsTab = ({ project }) => {

            const rows = [
                { label: '🤖 LLM (chat, reco, décomposition)', calls: c.llmCalls, tokens: (c.llmInputTokens||0)+(c.llmOutputTokens||0), usd: c.llmUSD || 0 },
                { label: '🔍 OCR API (Mistral/OpenAI/Claude Vision)', calls: c.ocrCalls, tokens: '-', usd: c.ocrUSD || 0 },

                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: '15px', marginBottom: '30px' }}>
