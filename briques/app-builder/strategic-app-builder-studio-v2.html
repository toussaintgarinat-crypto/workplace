        // ============================================
        // ONGLET RAG — BASE DE DOCS
        // ============================================
        const RagDocsTab = ({ project, settings, setShowSettings, onUpdateCosts, onSave }) => {
            const [docs, setDocs] = React.useState(project.docs || []);
            const [status, setStatus] = React.useState(null);
            const [selectedDoc, setSelectedDoc] = React.useState(null);
            const [ocrResult, setOcrResult] = React.useState(null);
            const [editedText, setEditedText] = React.useState('');
            const [processing, setProcessing] = React.useState(false);
            const [processingStep, setProcessingStep] = React.useState('');
            const [folderRagOver, setFolderRagOver] = React.useState(false);
            const ragEnabled = settings.rag?.enabled;
            const colName = `proj_${project.id.replace(/[^a-z0-9]/gi,'_')}`;

            const saveDocs = (newDocs) => {
                setDocs(newDocs);
                onSave({ ...project, docs: newDocs });
            };

            const processFile = async (file) => {
                setProcessing(true); setOcrResult(null); setStatus(null);
                try {
                    let text = '';
                    let confidence = 100;

                    // PDF numérique → PDF.js
                    if (file.type === 'application/pdf') {
                        setProcessingStep('📄 Extraction PDF...');
                        try { text = await extractPdfText(file); }
                        catch(e) { text = ''; }
                    }

                    // Texte brut
                    if (!text && (file.type.startsWith('text/') || file.name.match(/\.(txt|md|csv|json|js|py|rs|ts|html)$/i))) {
                        setProcessingStep('📝 Lecture du fichier...');
                        text = await file.text();
                        confidence = 100;
                    }

                    // Image → Tesseract
                    if (!text && file.type.startsWith('image/')) {
                        setProcessingStep('🔍 OCR Tesseract (local)...');
                        const r = await ocrTesseract(file);
                        text = r.text; confidence = r.confidence;
                        onUpdateCosts(project.id, { ocrCalls: 1, ocrUSD: 0 });
                    }

                    // PDF scanné / image sans texte → Tesseract fallback
                    if (!text && file.type === 'application/pdf') {
                        setProcessingStep('🔍 OCR Tesseract (PDF scanné)...');
                        const r = await ocrTesseract(file);
                        text = r.text; confidence = r.confidence;
                        onUpdateCosts(project.id, { ocrCalls: 1, ocrUSD: 0 });
                    }

                    setOcrResult({ text, confidence, file, fileName: file.name });
                    setEditedText(text);
                    setProcessingStep('');
                } catch(err) {
                    setStatus({ error: '❌ ' + err.message });
                } finally {
                    setProcessing(false);
                }
            };

            const FOLDER_RAG_EXTS = /\.(txt|md|mdx|csv|json|js|jsx|ts|tsx|py|rs|go|java|cs|php|rb|swift|kt|c|cpp|h|hpp|vue|svelte|html|css|scss|less|yaml|yml|toml|sh|bash|sql|xml|dart|lua|r|scala)$/i;
            const FOLDER_RAG_IGNORE = /node_modules|\.git|dist|build|\.next|\.nuxt|\.cache|__pycache__|\.DS_Store|\.env$|package-lock\.json|yarn\.lock|pnpm-lock/;

            const processFolder = async (files) => {
                const validFiles = Array.from(files)
                    .filter(f => FOLDER_RAG_EXTS.test(f.name) && !FOLDER_RAG_IGNORE.test(f.webkitRelativePath || f.name));
                if (validFiles.length === 0) { setStatus({ error: 'Aucun fichier texte/code trouvé dans ce dossier.' }); return; }

                setProcessing(true); setStatus(null);
                const folderName = (validFiles[0].webkitRelativePath || '').split('/')[0] || 'dossier';
                let newDocs = [...docs];
                let added = 0;

                try {
                    for (let i = 0; i < validFiles.length; i++) {
                        const file = validFiles[i];
                        setProcessingStep(`📁 ${i + 1}/${validFiles.length} — ${file.name}`);
                        const text = await file.text().catch(() => '');
                        if (!text.trim()) continue;
                        const docName = file.webkitRelativePath || file.name;
                        const chunks = chunkText(text, settings.rag?.chunkSize || 400);
                        const docId = Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                        const doc = {
                            id: docId, name: docName, text,
                            chunks: chunks.length, chars: text.length,
                            confidence: 100, indexed: false,
                            storedInMilvus: false, localChunks: null,
                            addedAt: new Date().toISOString(), fromFolder: folderName
                        };
                        if (!settings.rag?.enabled) {
                            doc.localChunks = chunks.map((c, idx) => ({ id: `${docId}_${idx}`, text: c }));
                            doc.indexed = true;
                        }
                        newDocs.push(doc);
                        added++;
                    }
                    saveDocs(newDocs);
                    setStatus({ success: `✅ ${added} fichier(s) du dossier "${folderName}" ajoutés à la base !` });
                } catch(err) {
                    setStatus({ error: '❌ ' + err.message });
                } finally {
                    setProcessing(false); setProcessingStep('');
                }
            };

            const improveWithAPI = async () => {
                if (!ocrResult) return;
                const provider = settings.rag?.ocrFallback || 'mistral';
                setProcessing(true); setProcessingStep(`🚀 OCR ${provider} en cours...`);
                try {
                    const r = await ocrWithAPI(settings, ocrResult.file, provider);
                    setEditedText(r.text);
                    setOcrResult(prev => ({ ...prev, text: r.text, confidence: r.confidence, improvedBy: provider }));
                    const cost = estimateCostUSD('ocr', provider, r.text.length);
                    onUpdateCosts(project.id, { ocrCalls: 1, ocrUSD: cost });
                    setStatus({ success: `✅ Amélioré avec ${provider} (confiance: ${r.confidence}%)` });
                } catch(err) {
                    setStatus({ error: '❌ ' + err.message });
                } finally {
                    setProcessing(false); setProcessingStep('');
                }
            };

            // Vectorise un texte déjà disponible (ETL ou OCR validé)
            const vectorizeText = async (text, docName, docId, existingDocIndex = -1) => {
                setProcessing(true);
                try {
                    const chunks = chunkText(text, settings.rag?.chunkSize || 400);
                    let stored = false;

                    const ragBackend = settings.rag?.ragBackend || 'milvus';

                    if (ragEnabled) {
                        if (ragBackend === 'openrag') {
                            setProcessingStep('🧩 Envoi vers OpenRAG...');
                            await openragUploadDoc(settings, text, docName);
                            stored = true;
                        } else {
                            setProcessingStep(`🧠 Embedding ${chunks.length} chunks...`);
                            const vectors = await callEmbedding(settings, chunks);
                            const dim = vectors[0].length;
                            const embCost = estimateCostUSD('embedding', settings.rag?.embeddingModel || 'text-embedding-3-small', text.length);
                            onUpdateCosts(project.id, { embCalls: 1, embTokens: Math.ceil(text.length/4), embUSD: embCost });

                            setProcessingStep('💾 Stockage dans Milvus...');
                            await milvusEnsureCol(settings, colName, dim);
                            await milvusInsertChunks(settings, colName, chunks, vectors, docName, docId);
                            stored = true;
                        }
                    }

                    const updatedDoc = {
                        id: docId, name: docName,
                        addedAt: new Date().toISOString(),
                        chunks: chunks.length, chars: text.length,
                        confidence: 100,
                        indexed: true,
                        storedInMilvus: stored && ragBackend === 'milvus',
                        storedInOpenRAG: stored && ragBackend === 'openrag',
                        text: !stored ? text : null,  // TF-IDF fallback
                        localChunks: !stored ? chunks : null
                    };

                    let newDocs;
                    if (existingDocIndex >= 0) {
                        newDocs = docs.map((d, i) => i === existingDocIndex ? updatedDoc : d);
                    } else {
                        newDocs = [...docs, updatedDoc];
                    }
                    saveDocs(newDocs);
                    const backendLabel = ragBackend === 'openrag' ? ' dans OpenRAG' : stored ? ' dans Milvus' : ' en local';
                    setStatus({ success: `✅ "${docName}" indexé — ${chunks.length} chunks${backendLabel}` });
                    return true;
                } catch(err) {
                    setStatus({ error: '❌ ' + err.message });
                    return false;
                } finally {
                    setProcessing(false); setProcessingStep('');
                }
            };

            const validateAndStore = async () => {
                if (!editedText.trim()) return;
                const docId = Date.now().toString();
                const ok = await vectorizeText(editedText, ocrResult.fileName, docId);
                if (ok) { setOcrResult(null); setEditedText(''); }
            };

            const deleteDoc = async (doc) => {
                if (!window.confirm(`Supprimer "${doc.name}" de la base ?`)) return;
                try {
                    if (ragEnabled) {
                        if (doc.storedInMilvus) await milvusDeleteDoc(settings, colName, doc.id);
                        else if (doc.storedInOpenRAG) await openragDeleteDoc(settings, doc.id);
                    }
                    saveDocs(docs.filter(d => d.id !== doc.id));
                } catch(err) {
                    setStatus({ error: '❌ Erreur suppression: ' + err.message });
                }
            };

            return (
                <div className="fade-in">
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'20px', flexWrap:'wrap', gap:'10px' }}>
                        <h2>🧠 Base de Documents — {project.name}</h2>
                        <div style={{ display:'flex', alignItems:'center', gap:'12px' }}>
                            <label style={{ display:'flex', alignItems:'center', gap:'8px', cursor:'pointer', background: ragEnabled ? '#e8f5e9':'#fff3e0', padding:'8px 15px', borderRadius:'20px', border:`2px solid ${ragEnabled?'#4caf50':'#ff9800'}`, fontSize:'0.9em', fontWeight:'600' }}>
                                <input type="checkbox" checked={!!ragEnabled} onChange={e => {
                                    const newS = { ...settings, rag: { ...settings.rag, enabled: e.target.checked } };
                                    // updateSettings est pas dispo ici → passer par setShowSettings ou prop
                                }} style={{ width:'16px', height:'16px' }} />
                                {ragEnabled ? `🧠 RAG ON (${(settings.rag?.ragBackend || 'milvus') === 'openrag' ? 'OpenRAG' : 'Milvus'})` : '🔍 Tesseract seul (gratuit)'}
                            </label>
                            <button className="btn btn-secondary" onClick={() => setShowSettings(true)}>⚙️ Config RAG</button>
                        </div>
                    </div>

                    {!ragEnabled && (
                        <div className="alert alert-info" style={{ marginBottom:'15px', fontSize:'0.9em' }}>
                            Mode <strong>Tesseract gratuit</strong> : extraction OCR locale, stockage des chunks en localStorage. Coche <strong>RAG + Milvus</strong> dans ⚙️ Réglages pour activer l'embedding sémantique et Milvus.
                        </div>
                    )}

                    {status?.success && <div className="alert alert-success" style={{ marginBottom:'15px' }}>{status.success}</div>}
                    {status?.error   && <div className="alert alert-warning" style={{ marginBottom:'15px' }}>{status.error}</div>}
                    {processing && <div className="alert alert-info" style={{ marginBottom:'15px' }}>⏳ {processingStep || 'Traitement...'}</div>}

                    {/* Zones de dépôt — fichier + dossier */}
                    {!ocrResult && !processing && (
                        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px', marginBottom:'20px' }}>
                            {/* Fichier unique */}
                            <div style={{ border:'2px dashed var(--border)', borderRadius:'12px', padding:'28px', textAlign:'center', cursor:'pointer', transition:'all 0.2s' }}
                                onDragOver={e => { e.preventDefault(); e.currentTarget.style.borderColor='var(--primary)'; e.currentTarget.style.background='#f0f4ff'; }}
                                onDragLeave={e => { e.currentTarget.style.borderColor='var(--border)'; e.currentTarget.style.background=''; }}
                                onDrop={e => { e.preventDefault(); e.currentTarget.style.borderColor='var(--border)'; e.currentTarget.style.background=''; const f=e.dataTransfer.files[0]; if(f) processFile(f); }}
                                onClick={() => document.getElementById('ragFileInput').click()}
                            >
                                <div style={{ fontSize:'2.2em', marginBottom:'8px' }}>📄</div>
                                <div style={{ fontWeight:'600', marginBottom:'4px' }}>Un fichier</div>
                                <div style={{ fontSize:'0.8em', color:'#888' }}>PDF, Image, TXT, MD, code...</div>
                                <input id="ragFileInput" type="file" style={{ display:'none' }}
                                    accept=".pdf,.png,.jpg,.jpeg,.tiff,.bmp,.gif,.webp,.txt,.md,.csv,.json,.js,.ts,.py,.rs,.html"
                                    onChange={e => { const f=e.target.files[0]; if(f) processFile(f); e.target.value=''; }} />
                            </div>
                            {/* Dossier entier */}
                            <div style={{ border:`2px dashed ${folderRagOver ? 'var(--primary)' : '#f59e0b'}`, borderRadius:'12px', padding:'28px', textAlign:'center', cursor:'pointer', transition:'all 0.2s', background: folderRagOver ? '#fffbeb' : 'transparent' }}
                                onDragOver={e => { e.preventDefault(); setFolderRagOver(true); }}
                                onDragLeave={() => setFolderRagOver(false)}
                                onDrop={e => { e.preventDefault(); setFolderRagOver(false); const files = e.dataTransfer.files; if(files.length) processFolder(files); }}
                                onClick={() => document.getElementById('ragFolderInput').click()}
                            >
                                <div style={{ fontSize:'2.2em', marginBottom:'8px' }}>📁</div>
                                <div style={{ fontWeight:'600', marginBottom:'4px', color:'#d97706' }}>Dossier entier</div>
                                <div style={{ fontSize:'0.8em', color:'#888' }}>Glisse ou clique • JS/TS/Py/Go/Java...</div>
                                <div style={{ fontSize:'0.72em', color:'#aaa', marginTop:'4px' }}>node_modules / .git ignorés</div>
                                <input id="ragFolderInput" type="file" webkitdirectory="true" multiple style={{ display:'none' }}
                                    onChange={e => { if(e.target.files.length) processFolder(e.target.files); e.target.value=''; }} />
                            </div>
                        </div>
                    )}

                    {/* Preview OCR + validation */}
                    {ocrResult && (
                        <div style={{ background:'#f8f9fa', borderRadius:'12px', padding:'20px', marginBottom:'20px' }}>
                            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'15px', flexWrap:'wrap', gap:'10px' }}>
                                <div>
                                    <strong>📄 {ocrResult.fileName}</strong>
                                    <span style={{ marginLeft:'10px', padding:'3px 10px', borderRadius:'10px', fontSize:'0.8em', fontWeight:'600',
                                        background: ocrResult.confidence >= 80 ? '#e8f5e9' : ocrResult.confidence >= 50 ? '#fff3e0' : '#ffebee',
                                        color: ocrResult.confidence >= 80 ? '#2e7d32' : ocrResult.confidence >= 50 ? '#e65100' : '#c62828'
                                    }}>
                                        Confiance Tesseract: {ocrResult.confidence}%
                                        {ocrResult.confidence < 70 && ' ⚠️ Qualité faible'}
                                    </span>
                                    {ocrResult.improvedBy && <span style={{ marginLeft:'8px', background:'#e3f2fd', color:'#1565c0', padding:'3px 10px', borderRadius:'10px', fontSize:'0.8em' }}>✨ Amélioré par {ocrResult.improvedBy}</span>}
                                </div>
                                <div style={{ display:'flex', gap:'8px' }}>
                                    {ocrResult.confidence < 85 && !ocrResult.improvedBy && (
                                        <button className="btn btn-secondary" onClick={improveWithAPI} disabled={processing} style={{ fontSize:'0.85em' }}>
                                            🚀 Améliorer avec {(settings.rag?.ocrFallback || 'mistral').charAt(0).toUpperCase() + (settings.rag?.ocrFallback || 'mistral').slice(1)} OCR
                                        </button>
                                    )}
                                    <button className="btn btn-secondary" onClick={() => { setOcrResult(null); setEditedText(''); }} style={{ fontSize:'0.85em' }}>✕ Annuler</button>
                                    <button className="btn btn-primary" onClick={validateAndStore} disabled={processing || !editedText.trim()} style={{ fontSize:'0.85em' }}>
                                        ✅ Valider & Indexer
                                    </button>
                                </div>
                            </div>
                            <label style={{ display:'block', fontWeight:'600', marginBottom:'8px', fontSize:'0.9em' }}>
                                Texte extrait — modifiable avant indexation :
                            </label>
                            <textarea value={editedText} onChange={e => setEditedText(e.target.value)}
                                style={{ width:'100%', minHeight:'200px', fontFamily:'monospace', fontSize:'0.82em', padding:'12px', borderRadius:'8px', border:'1px solid var(--border)', resize:'vertical' }}
                            />
                            <div style={{ fontSize:'0.8em', color:'#888', marginTop:'5px' }}>
                                {editedText.length} caractères → ~{Math.ceil(editedText.length/4)} tokens → ~{chunkText(editedText, settings.rag?.chunkSize||400).length} chunks
                            </div>
                        </div>
                    )}

                    {/* Liste des documents */}
                    <h3 style={{ marginBottom:'15px' }}>
                        📚 Documents ({docs.length})
                        <span style={{ fontSize:'0.8em', fontWeight:400, color:'#888', marginLeft:'10px' }}>
                            {docs.filter(d => d.indexed || d.storedInMilvus || d.storedInOpenRAG).length} indexé(s), {docs.filter(d => !d.indexed && !d.storedInMilvus && !d.storedInOpenRAG).length} en attente
                        </span>
                    </h3>
                    {docs.length === 0 ? (
                        <div style={{ textAlign:'center', color:'#999', padding:'30px' }}>Aucun document. Dépose un fichier ci-dessus.</div>
                    ) : (
                        <div style={{ display:'flex', flexDirection:'column', gap:'10px' }}>
                            {docs.map((doc, idx) => (
                                <div key={doc.id} style={{ background: doc.autoFromEtl && !doc.indexed ? '#fff8e1' : '#f8f9fa', borderRadius:'10px', padding:'15px', border: doc.autoFromEtl && !doc.indexed ? '1px solid #ffcc80' : '1px solid transparent', display:'flex', justifyContent:'space-between', alignItems:'center', gap:'10px', flexWrap:'wrap' }}>
                                    <div style={{ flex:1, minWidth:0 }}>
                                        <div style={{ fontWeight:'600', marginBottom:'4px', display:'flex', alignItems:'center', gap:'8px', flexWrap:'wrap' }}>
                                            📄 {doc.name}
                                            {doc.autoFromEtl && <span style={{ background:'#ff9800', color:'white', fontSize:'0.72em', padding:'2px 8px', borderRadius:'10px', fontWeight:700 }}>ETL</span>}
                                            {(doc.indexed || doc.storedInMilvus || doc.storedInOpenRAG) && <span style={{ background:'#4caf50', color:'white', fontSize:'0.72em', padding:'2px 8px', borderRadius:'10px', fontWeight:700 }}>✓ Indexé</span>}
                                            {!doc.indexed && !doc.storedInMilvus && !doc.storedInOpenRAG && <span style={{ background:'#9e9e9e', color:'white', fontSize:'0.72em', padding:'2px 8px', borderRadius:'10px', fontWeight:700 }}>En attente</span>}
                                        </div>
                                        <div style={{ fontSize:'0.82em', color:'#666', display:'flex', gap:'12px', flexWrap:'wrap' }}>
                                            {doc.chunks && <span>{doc.chunks} chunks</span>}
                                            {doc.chars && <span>{(doc.chars/1000).toFixed(1)}k chars</span>}
                                            {doc.text && !doc.chunks && <span>{(doc.text.length/1000).toFixed(1)}k chars</span>}
                                            {doc.size && !doc.text && !doc.chars && <span>{(doc.size/1000).toFixed(1)}k chars</span>}
                                            {doc.confidence != null && <span>Confiance: {doc.confidence}%</span>}
                                            {doc.improvedBy && <span style={{ color:'#1565c0' }}>✨ via {doc.improvedBy}</span>}
                                            {(doc.indexed || doc.storedInMilvus || doc.storedInOpenRAG) && (
                                                <span style={{ color: doc.storedInOpenRAG ? '#6a1b9a' : doc.storedInMilvus ? '#2e7d32' : '#666' }}>
                                                    {doc.storedInOpenRAG ? '🧩 OpenRAG' : doc.storedInMilvus ? '🔷 Milvus' : '💾 Local'}
                                                </span>
                                            )}
                                            <span>{new Date(doc.addedAt).toLocaleDateString('fr-FR')}</span>
                                        </div>
                                        {doc.autoFromEtl && !doc.indexed && (
                                            <div style={{ fontSize:'0.8em', color:'#e65100', marginTop:'4px' }}>
                                                ⚡ Importé via ETL — clique sur <strong>Vectoriser</strong> pour l'indexer dans la base documentaire.
                                            </div>
                                        )}
                                    </div>
                                    <div style={{ display:'flex', gap:'8px', flexShrink:0 }}>
                                        {!doc.indexed && !doc.storedInMilvus && !doc.storedInOpenRAG && doc.text && (
                                            <button
                                                onClick={async () => {
                                                    await vectorizeText(doc.text, doc.name, doc.id, idx);
                                                }}
                                                disabled={processing}
                                                style={{ background:'#4caf50', color:'white', border:'none', borderRadius:'8px', padding:'6px 12px', cursor:'pointer', fontSize:'0.85em', fontWeight:600 }}>
                                                🧠 Vectoriser
                                            </button>
                                        )}
                                        <button onClick={() => deleteDoc(doc)} style={{ background:'rgba(220,53,69,0.1)', border:'1px solid rgba(220,53,69,0.3)', borderRadius:'8px', padding:'6px 12px', cursor:'pointer', color:'#dc3545', fontSize:'0.85em' }}
                                            onMouseOver={e => { e.currentTarget.style.background='#dc3545'; e.currentTarget.style.color='white'; }}
                                            onMouseOut={e => { e.currentTarget.style.background='rgba(220,53,69,0.1)'; e.currentTarget.style.color='#dc3545'; }}>
                                            🗑️ Supprimer
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };


        // ============================================
        // ONGLET TECH STACK — Simulateur Architecture SaaS
        // ============================================

        const TechStackTab = ({ project, answers, onSave, settings, savedStack: externalStack, setSavedStack: externalSetStack }) => {
            const [activeLayer, setActiveLayer] = React.useState('all');
            const [activeGroup, setActiveGroup] = React.useState('all');
            const [activeBrique, setActiveBrique] = React.useState(null);
            const [activeSolution, setActiveSolution] = React.useState(null);
            const [filterLockIn, setFilterLockIn] = React.useState('all');
            const [filterMode, setFilterMode] = React.useState('all');
            const [filterCountry, setFilterCountry] = React.useState('all');
            const [localStack, setLocalStack] = React.useState(project.techStack || {});
            const savedStack = externalStack !== undefined ? externalStack : localStack;
            const setSavedStack = externalSetStack || setLocalStack;
            const [searchQuery, setSearchQuery] = React.useState('');

            const groups = [
                { id: 'all', label: '🌐 Tout', color: '#667eea' },
                { id: 'security', label: '🔐 Sécurité', color: '#ef4444' },
                { id: 'payments', label: '💳 Paiements', color: '#10b981' },
                { id: 'data', label: '🗄️ Données', color: '#3b82f6' },
                { id: 'infra', label: '🌐 Infra', color: '#8b5cf6' },
                { id: 'frontend', label: '🎨 Frontend', color: '#f59e0b' },
                { id: 'communication', label: '📡 Communication', color: '#ec4899' }
            ];

            const layers = [
                { id: 'all', label: '🌐 Toutes les couches', color: '#667eea' },
                { id: 'front', label: '🎨 Frontend', color: '#f59e0b' },
                { id: 'back', label: '⚙️ Backend', color: '#8b5cf6' },
                { id: 'db', label: '🗄️ Base de données', color: '#3b82f6' }
            ];

            // Auto-detect relevant briques from questionnaire
            const getRelevantBriques = React.useCallback(() => {
                const features = Array.isArray(answers.p2q5) ? answers.p2q5 : (answers.p2q5 ? [answers.p2q5] : []);
                const platforms = Array.isArray(answers.p2q2) ? answers.p2q2 : (answers.p2q2 ? [answers.p2q2] : []);
                const relevant = new Set();
                Object.entries(TECH_STACK_DB).forEach(([key, brique]) => {
                    const hasFeatTrigger = brique.questionnaireTrigger?.length > 0;
                    const hasPlatTrigger = brique.platformTrigger?.length > 0;
                    if (!hasFeatTrigger && !hasPlatTrigger) { relevant.add(key); return; }
                    if (hasFeatTrigger && brique.questionnaireTrigger.some(t => features.includes(t))) relevant.add(key);
                    if (hasPlatTrigger && brique.platformTrigger.some(t => platforms.includes(t))) relevant.add(key);
                });
                return relevant;
            }, [answers]);

            const relevantBriques = getRelevantBriques();

            const filteredBriques = Object.entries(TECH_STACK_DB).filter(([key, brique]) => {
                if (activeLayer !== 'all' && brique.layer !== activeLayer) return false;
                if (activeGroup !== 'all' && brique.group !== activeGroup) return false;
                if (searchQuery && !brique.name.toLowerCase().includes(searchQuery.toLowerCase())) return false;
                return true;
            });

            const lockInColor = (level) => ({ 1: '#10b981', 2: '#f59e0b', 3: '#ef4444' }[level] || '#999');
            const lockInBg = (level) => ({ 1: 'rgba(16,185,129,0.15)', 2: 'rgba(245,158,11,0.15)', 3: 'rgba(239,68,68,0.15)' }[level] || '#f5f5f5');

            const saveStackChoice = (briqueKey, solution) => {
                const newStack = { ...savedStack, [briqueKey]: solution };
                setSavedStack(newStack);
                onSave({ ...project, techStack: newStack });
            };

            const removeSaved = (briqueKey) => {
                const newStack = { ...savedStack };
                delete newStack[briqueKey];
                setSavedStack(newStack);
                onSave({ ...project, techStack: newStack });
            };

            const filterSolutions = (solutions) => {
                return solutions.filter(s => {
                    if (filterLockIn !== 'all') {
                        const lvl = parseInt(filterLockIn);
                        if (s.lockIn !== lvl) return false;
                    }
                    if (filterMode === 'mvp' && !s.mvp) return false;
                    if (filterMode === 'scale' && !s.scale) return false;
                    if (filterCountry === 'fr' && s.country !== '🇫🇷') return false;
                    if (filterCountry === 'eu' && !['🇫🇷','🇩🇪','🇬🇧','🇳🇱','🇧🇪'].includes(s.country)) return false;
                    if (filterCountry === 'us' && s.country !== '🇺🇸') return false;
                    return true;
                });
            };

            const stackCount = Object.keys(savedStack).length;
            const totalBriques = Object.keys(TECH_STACK_DB).length;

            return (
                <div style={{ padding: '24px' }}>
                    {/* Header */}
                    <div style={{ marginBottom: '24px' }}>
                        <h2 style={{ fontSize: '1.8em', fontWeight: 700, marginBottom: '8px', display: 'flex', alignItems: 'center', gap: '12px' }}>
                            ⚙️ Simulateur Tech Stack
                            <span style={{ fontSize: '0.55em', background: 'linear-gradient(135deg, #667eea, #764ba2)', color: 'white', padding: '4px 12px', borderRadius: '20px', fontWeight: 600 }}>
                                {stackCount}/{totalBriques} briques choisies
                            </span>
                        </h2>
                        <p style={{ color: '#666', fontSize: '0.95em' }}>
                            Compare les solutions pour chaque brique technique. Les briques <span style={{ background: '#fff3cd', padding: '2px 6px', borderRadius: '4px', fontWeight: 600 }}>⭐ recommandées</span> correspondent aux réponses de ton questionnaire.
                        </p>
                    </div>

                    {/* Saved Stack Summary */}
                    {stackCount > 0 && (
                        <div style={{ background: 'linear-gradient(135deg, rgba(102,126,234,0.08), rgba(118,75,162,0.08))', border: '2px solid rgba(102,126,234,0.3)', borderRadius: '12px', padding: '16px', marginBottom: '20px' }}>
                            <h3 style={{ fontWeight: 700, marginBottom: '12px', fontSize: '1em', color: '#667eea' }}>📋 Mon Stack ({stackCount} briques)</h3>
                            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
                                {Object.entries(savedStack).map(([key, sol]) => (
                                    <div key={key} style={{ background: 'white', border: '1px solid rgba(102,126,234,0.3)', borderRadius: '8px', padding: '6px 10px', display: 'flex', alignItems: 'center', gap: '6px', fontSize: '0.85em' }}>
                                        <span>{TECH_STACK_DB[key]?.icon}</span>
                                        <span style={{ fontWeight: 600 }}>{TECH_STACK_DB[key]?.name}</span>
                                        <span style={{ color: '#888' }}>→</span>
                                        <span>{sol.name}</span>
                                        <span style={{ color: sol.country === '🇫🇷' ? '#ef4444' : '#999' }}>{sol.country}</span>
                                        <button onClick={() => removeSaved(key)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#dc3545', padding: '0 2px', fontSize: '1em', lineHeight: 1 }}>×</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Filters */}
                    <div style={{ background: '#f8f9fa', borderRadius: '12px', padding: '16px', marginBottom: '20px', display: 'flex', flexWrap: 'wrap', gap: '12px', alignItems: 'center' }}>
                        <input
                            type="text" placeholder="🔍 Rechercher une brique..."
                            value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                            style={{ flex: 1, minWidth: '160px', padding: '8px 12px', borderRadius: '8px', border: '1px solid #ddd', outline: 'none' }}
                        />
                        <select value={filterLockIn} onChange={e => setFilterLockIn(e.target.value)} style={{ padding: '8px 12px', borderRadius: '8px', border: '1px solid #ddd', background: 'white', cursor: 'pointer' }}>
                            <option value="all">🔒 Tous lock-in</option>
                            <option value="1">🟢 Faible</option>
                            <option value="2">🟠 Moyen</option>
                            <option value="3">🔴 Fort</option>
                        </select>
                        <select value={filterMode} onChange={e => setFilterMode(e.target.value)} style={{ padding: '8px 12px', borderRadius: '8px', border: '1px solid #ddd', background: 'white', cursor: 'pointer' }}>
                            <option value="all">Tous modes</option>
                            <option value="mvp">🚀 MVP</option>
                            <option value="scale">✅ Scale</option>
                        </select>
                        <select value={filterCountry} onChange={e => setFilterCountry(e.target.value)} style={{ padding: '8px 12px', borderRadius: '8px', border: '1px solid #ddd', background: 'white', cursor: 'pointer' }}>
                            <option value="all">🌍 Tous pays</option>
                            <option value="fr">🇫🇷 France</option>
                            <option value="eu">🇪🇺 Europe</option>
                            <option value="us">🇺🇸 USA</option>
                        </select>
                    </div>

                    {/* Layer Tabs — Front / Back / Database */}
                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px', marginBottom: '12px' }}>
                        {layers.map(l => (
                            <button key={l.id} onClick={() => setActiveLayer(l.id)}
                                style={{ padding: '6px 14px', borderRadius: '20px', border: `2px solid ${activeLayer === l.id ? l.color : '#e0e0e0'}`, background: activeLayer === l.id ? l.color : 'white', color: activeLayer === l.id ? 'white' : '#666', fontWeight: 700, cursor: 'pointer', transition: 'all 0.2s', fontSize: '0.85em' }}>
                                {l.label}
                            </button>
                        ))}
                    </div>

                    {/* Group Tabs */}
                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px', marginBottom: '20px' }}>
                        {groups.map(g => (
                            <button key={g.id} onClick={() => setActiveGroup(g.id)}
                                style={{ padding: '8px 16px', borderRadius: '20px', border: `2px solid ${activeGroup === g.id ? g.color : '#e0e0e0'}`, background: activeGroup === g.id ? g.color : 'white', color: activeGroup === g.id ? 'white' : '#666', fontWeight: 600, cursor: 'pointer', transition: 'all 0.2s', fontSize: '0.9em' }}>
                                {g.label}
                            </button>
                        ))}
                    </div>

                    {/* Briques Grid */}
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(260px, 1fr))', gap: '16px', marginBottom: '24px' }}>
                        {filteredBriques.map(([key, brique]) => {
                            const isRelevant = relevantBriques.has(key);
                            const chosen = savedStack[key];
                            const filteredSols = filterSolutions(brique.solutions || []);
                            const isActive = activeBrique === key;

                            return (
                                <div key={key}
                                    onClick={() => { setActiveBrique(isActive ? null : key); setActiveSolution(null); }}
                                    style={{ background: isActive ? 'linear-gradient(135deg, rgba(102,126,234,0.12), rgba(118,75,162,0.12))' : (isRelevant ? '#fffdf0' : 'white'), border: `2px solid ${isActive ? '#667eea' : (isRelevant ? '#f59e0b' : '#e0e0e0')}`, borderRadius: '12px', padding: '16px', cursor: 'pointer', transition: 'all 0.2s', position: 'relative' }}>
                                    {isRelevant && !chosen && <span style={{ position: 'absolute', top: '8px', right: '8px', fontSize: '0.7em', background: '#fef3c7', color: '#b45309', padding: '2px 8px', borderRadius: '10px', fontWeight: 700 }}>⭐ Recommandé</span>}
                                    {chosen && <span style={{ position: 'absolute', top: '8px', right: '8px', fontSize: '0.7em', background: '#d1fae5', color: '#065f46', padding: '2px 8px', borderRadius: '10px', fontWeight: 700 }}>✅ Choisi</span>}
                                    <div style={{ fontSize: '2em', marginBottom: '8px' }}>{brique.icon}</div>
                                    <div style={{ fontWeight: 700, fontSize: '1em', marginBottom: '4px', color: '#333' }}>{brique.name}</div>
                                    {chosen && <div style={{ fontSize: '0.8em', color: '#059669', fontWeight: 600, marginBottom: '4px' }}>{chosen.name} {chosen.country}</div>}
                                    <div style={{ fontSize: '0.8em', color: '#888' }}>{filteredSols.length} solution{filteredSols.length !== 1 ? 's' : ''}</div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Detail Panel */}
                    {activeBrique && TECH_STACK_DB[activeBrique] && (() => {
                        const brique = TECH_STACK_DB[activeBrique];
                        const filteredSols = filterSolutions(brique.solutions || []);
                        return (
                            <div style={{ background: 'white', border: '2px solid #667eea', borderRadius: '16px', padding: '24px' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '16px', flexWrap: 'wrap', gap: '12px' }}>
                                    <div>
                                        <h3 style={{ fontSize: '1.5em', fontWeight: 700, marginBottom: '8px' }}>{brique.icon} {brique.name}</h3>
                                        <p style={{ color: '#666', lineHeight: '1.6', maxWidth: '700px' }}>{brique.explanation}</p>
                                    </div>
                                    <button onClick={() => setActiveBrique(null)} style={{ background: '#f3f4f6', border: 'none', borderRadius: '8px', padding: '8px 12px', cursor: 'pointer', fontSize: '0.9em', color: '#666' }}>✕ Fermer</button>
                                </div>

                                {filteredSols.length === 0 && (
                                    <div style={{ textAlign: 'center', color: '#999', padding: '30px' }}>Aucune solution ne correspond aux filtres actuels.</div>
                                )}

                                <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                                    {filteredSols.map((sol, i) => {
                                        const isChosen = savedStack[activeBrique]?.name === sol.name;
                                        const isExpanded = activeSolution === i;
                                        return (
                                            <div key={i} style={{ background: isChosen ? '#f0fdf4' : '#f8f9fa', borderRadius: '12px', border: `2px solid ${isChosen ? '#10b981' : '#e0e0e0'}`, overflow: 'hidden' }}>
                                                {/* Solution Header - always visible */}
                                                <div onClick={() => setActiveSolution(isExpanded ? null : i)} style={{ padding: '16px', cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '12px' }}>
                                                    <div style={{ flex: 1 }}>
                                                        <div style={{ display: 'flex', alignItems: 'center', gap: '10px', flexWrap: 'wrap', marginBottom: '8px' }}>
                                                            <span style={{ fontWeight: 700, fontSize: '1.1em' }}>{sol.name} {sol.country}</span>
                                                            <span style={{ background: lockInBg(sol.lockIn), color: lockInColor(sol.lockIn), padding: '2px 10px', borderRadius: '10px', fontSize: '0.75em', fontWeight: 700 }}>🔒 {sol.lockInLabel}</span>
                                                            <span style={{ background: '#f3f4f6', padding: '2px 8px', borderRadius: '10px', fontSize: '0.75em' }}>⏱ {sol.setupTime}</span>
                                                            {sol.mvp && <span style={{ background: 'rgba(59,130,246,0.15)', color: '#1d4ed8', padding: '2px 8px', borderRadius: '10px', fontSize: '0.75em', fontWeight: 600 }}>🚀 MVP</span>}
                                                            {sol.scale && <span style={{ background: 'rgba(16,185,129,0.15)', color: '#065f46', padding: '2px 8px', borderRadius: '10px', fontSize: '0.75em', fontWeight: 600 }}>✅ Scale</span>}
                                                        </div>
                                                        <div style={{ fontSize: '0.85em', color: '#888' }}>
                                                            {sol.costs?.[0]?.price} — {sol.costs?.[0]?.details}
                                                        </div>
                                                    </div>
                                                    <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                                                        {isChosen ? (
                                                            <button onClick={(e) => { e.stopPropagation(); removeSaved(activeBrique); }} style={{ background: '#dcfce7', color: '#065f46', border: '1px solid #10b981', borderRadius: '8px', padding: '6px 14px', cursor: 'pointer', fontWeight: 600, fontSize: '0.85em' }}>
                                                                ✅ Choisi — Retirer
                                                            </button>
                                                        ) : (
                                                            <button onClick={(e) => { e.stopPropagation(); saveStackChoice(activeBrique, sol); }} style={{ background: 'linear-gradient(135deg, #667eea, #764ba2)', color: 'white', border: 'none', borderRadius: '8px', padding: '6px 14px', cursor: 'pointer', fontWeight: 600, fontSize: '0.85em' }}>
                                                                + Choisir
                                                            </button>
                                                        )}
                                                        <span style={{ color: '#999', fontSize: '1.2em' }}>{isExpanded ? '▲' : '▼'}</span>
                                                    </div>
                                                </div>

                                                {/* Expanded Details */}
                                                {isExpanded && (
                                                    <div style={{ padding: '0 16px 16px' }}>
                                                        <p style={{ color: '#555', lineHeight: '1.6', marginBottom: '16px', fontSize: '0.9em' }}>{sol.description}</p>

                                                        {/* Prix paliers */}
                                                        {sol.costs?.length > 1 && (
                                                            <div style={{ background: 'white', borderRadius: '8px', padding: '12px', marginBottom: '12px', border: '1px solid #e0e0e0' }}>
                                                                <div style={{ fontWeight: 700, color: '#667eea', marginBottom: '8px', fontSize: '0.9em' }}>💰 Détail prix par palier</div>
                                                                {sol.costs.map((c, ci) => (
                                                                    <div key={ci} style={{ display: 'flex', justifyContent: 'space-between', padding: '4px 0', borderBottom: ci < sol.costs.length-1 ? '1px solid #f0f0f0' : 'none', fontSize: '0.85em' }}>
                                                                        <span style={{ color: '#555' }}>{c.users}</span>
                                                                        <div style={{ textAlign: 'right' }}>
                                                                            <span style={{ fontWeight: 700, color: '#10b981' }}>{c.price}</span>
                                                                            <span style={{ color: '#999', display: 'block', fontSize: '0.85em' }}>{c.details}</span>
                                                                        </div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}

                                                        {/* Migration */}
                                                        {sol.migration && (
                                                            <div style={{ background: 'rgba(239,68,68,0.08)', border: '1px solid rgba(239,68,68,0.25)', borderRadius: '8px', padding: '12px', marginBottom: '12px' }}>
                                                                <div style={{ fontWeight: 700, color: '#dc2626', marginBottom: '8px', fontSize: '0.9em' }}>⚠️ Migration si tu changes</div>
                                                                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: '8px', marginBottom: '8px', fontSize: '0.85em' }}>
                                                                    <div><div style={{ color: '#999', fontSize: '0.85em' }}>Coût</div><div style={{ fontWeight: 700, color: '#dc2626' }}>{sol.migration.cost}</div></div>
                                                                    <div><div style={{ color: '#999', fontSize: '0.85em' }}>Durée</div><div style={{ fontWeight: 700, color: '#ea580c' }}>{sol.migration.time}</div></div>
                                                                    <div><div style={{ color: '#999', fontSize: '0.85em' }}>Risque</div><div style={{ fontWeight: 700, color: '#dc2626' }}>{sol.migration.risk}</div></div>
                                                                </div>
                                                                <div style={{ fontSize: '0.8em', color: '#666', fontStyle: 'italic' }}>{sol.migration.reason}</div>
                                                            </div>
                                                        )}

                                                        {/* Pros/Cons */}
                                                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '12px' }}>
                                                            <div>
                                                                <div style={{ fontWeight: 700, color: '#10b981', marginBottom: '8px', fontSize: '0.85em' }}>✅ Avantages</div>
                                                                <ul style={{ listStyle: 'none', padding: 0, margin: 0 }}>
                                                                    {sol.pros?.map((p, pi) => <li key={pi} style={{ fontSize: '0.82em', color: '#555', padding: '3px 0', display: 'flex', gap: '6px' }}><span style={{ color: '#10b981', flexShrink: 0 }}>•</span><span>{p}</span></li>)}
                                                                </ul>
                                                            </div>
                                                            <div>
                                                                <div style={{ fontWeight: 700, color: '#ef4444', marginBottom: '8px', fontSize: '0.85em' }}>⚠️ Inconvénients</div>
                                                                <ul style={{ listStyle: 'none', padding: 0, margin: 0 }}>
                                                                    {sol.cons?.map((c, ci) => <li key={ci} style={{ fontSize: '0.82em', color: '#555', padding: '3px 0', display: 'flex', gap: '6px' }}><span style={{ color: '#ef4444', flexShrink: 0 }}>•</span><span>{c}</span></li>)}
                                                                </ul>
                                                            </div>
                                                        </div>

                                                        {/* Tags */}
                                                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
                                                            {sol.tags?.map((t, ti) => <span key={ti} style={{ background: '#f3f4f6', color: '#666', padding: '3px 8px', borderRadius: '6px', fontSize: '0.75em' }}>#{t}</span>)}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        );
                    })()}
                </div>
            );
        };


        // ============================================
        // ONGLET RAG — SETTINGS (ajout dans SettingsModal)
        // ============================================

        // Render
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
