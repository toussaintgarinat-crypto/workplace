                                            <div style={{ fontWeight: '600' }}>Glisse ton fichier JSON ici ou clique</div>
                                            <input id="jsonFileInput" type="file" style={{ display: 'none' }}
                                                accept=".json"
                                                onChange={e => { const f = e.target.files[0]; if (f) handleFileImport(f, null); }} />
                                        </div>
                                        <div className="modal-actions">
                                            <button className="btn btn-secondary" onClick={() => { setShowImportModal(false); setImportStatus(null); }}>Annuler</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ============================================
        // VUE WORKSPACE (suite dans le prochain bloc)
        // ============================================

        const WorkspaceView = ({ project, projects, user, syncStatus, onBack, onSave, updateProjectCosts, currentTab, setCurrentTab, settings, updateSettings, showSettings, setShowSettings }) => {
            const [questionnaireMode, setQuestionnaireMode] = useState('guided'); // 'guided' ou 'chat'
            const [currentPhase, setCurrentPhase] = useState(1);
            const [answers, setAnswers] = useState(project.answers || {});
            const [showHelp, setShowHelp] = useState({});
            const [chatMessages, setChatMessages] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [reverseUrl, setReverseUrl] = useState('');
            const [reverseDescription, setReverseDescription] = useState('');
            const [reverseAnalysis, setReverseAnalysis] = useState(null);

            // V3.0 — Saved tech stack from project
            const [savedStack, setSavedStack] = useState(project.techStack || {});

            // V3.0 — Blueprint generation handler
            const generateBlueprint = () => {
                const yaml = generateBlueprint(project, answers, savedStack);
                if (!yaml) {
                    alert('Ajoute des briques avec image conteneur dans ⚙️ Tech Stack avant de générer un blueprint.');
                    return;
                }
                const blob = new Blob([yaml], { type: 'text/yaml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `blueprint-${project.name.replace(/\s+/g, '-').toLowerCase()}.yml`;
                a.click();
                URL.revokeObjectURL(url);
            };

            // PAI Memory state
            const [paiMemory, setPaiMemory] = useState(() => {
                const saved = localStorage.getItem('paiMemory');
                return saved ? JSON.parse(saved) : { hot: { notes: [] }, warm: { notes: [] }, cold: { notes: [] } };
            });
            useEffect(() => {
                localStorage.setItem('paiMemory', JSON.stringify(paiMemory));
            }, [paiMemory]);

            // IPCRA state
            const [ipcraData, setIpcraData] = useState(() => {
                const saved = localStorage.getItem('ipcraData');
                return saved ? JSON.parse(saved) : {
                    inbox: [], projets: [], casquettes: ['Developpeur', 'Designer', 'Marketeur'],
                    ressources: [], archives: [], slowBurn: []
                };
            });
            useEffect(() => {
                localStorage.setItem('ipcraData', JSON.stringify(ipcraData));
            }, [ipcraData]);

            const tabs = [
                { id: 'questionnaire', label: '📝 Questionnaire', icon: '📝' },
                { id: 'reverse', label: '🔍 Reverse Engineering', icon: '🔍' },
                { id: 'recommendations', label: '🎯 Recommandations', icon: '🎯' },
                { id: 'decomposer', label: '🧩 Décomposition', icon: '🧩' },
                { id: 'bmad', label: '🤖 Agents BMAD', icon: '🤖' },
                { id: 'paiMemory', label: '🧠 Memoire PAI', icon: '🧠' },
                { id: 'ipcra', label: '📂 IPCRA', icon: '📂' },
                { id: 'library', label: '📚 Bibliotheque', icon: '📚' },
                { id: 'export', label: '📥 Export', icon: '📥' },
                { id: 'schema', label: '🗄️ Schéma', icon: '🗄️' },
                { id: 'rag', label: '🧠 Base de Docs', icon: '🧠' },
                { id: 'costs', label: '💰 Coûts', icon: '💰' },
                { id: 'techstack', label: '⚙️ Tech Stack', icon: '⚙️' },
                { id: 'ops', label: '🚀 Ops & Déploiement', icon: '🚀' }
            ];

            useEffect(() => {
                // Calculer complétion
                const completion = {
                    phase1: calculateCompletionLocal(answers, 'phase1'),
                    phase2: calculateCompletionLocal(answers, 'phase2'),
                    phase3: calculateCompletionLocal(answers, 'phase3'),
                    phase4: calculateCompletionLocal(answers, 'phase4')
                };
                onSave({ ...project, answers, completion });
            }, [answers]);

            const calculateCompletionLocal = (ans, phase) => {
                const phaseQuestions = QUESTIONS_DATA[phase].questions;
                const answered = phaseQuestions.filter(q => ans[q.id]).length;
                return Math.round((answered / phaseQuestions.length) * 100);
            };

            const handleAnswer = (questionId, value) => {
                setAnswers(prev => ({ ...prev, [questionId]: value }));
            };

            const [chatLoading, setChatLoading] = useState(false);

            const handleChatSend = async () => {
                if (!chatInput.trim()) return;

                const userMessage = { role: 'user', content: chatInput };
                const updatedMessages = [...chatMessages, userMessage];
                setChatMessages(updatedMessages);
                const userQuery = chatInput;
                setChatInput('');

                if (needsLLMKey(settings)) {
                    setChatMessages(prev => [...prev, {
                        role: 'assistant',
                        content: "⚠️ Aucune clé API configurée. Va dans **Réglages** (⚙️) → **Chat IA** pour connecter un fournisseur. Tu peux aussi choisir **Ollama (Local)** pour un LLM gratuit sur ton ordinateur."
                    }]);
                    return;
                }

                setChatLoading(true);
                try {
                    // --- Injection RAG contextuelle ---
                    let ragContext = '';
                    if (settings.rag?.enabled && settings.rag?.autoInject !== false && project.docs && project.docs.length > 0) {
                        try {
                            const ragBackend = settings.rag?.ragBackend || 'milvus';
                            if (ragBackend === 'openrag' && project.docs.some(d => d.storedInOpenRAG)) {
                                // Mode OpenRAG : recherche hybride
                                const hits = await openragSearch(settings, userQuery, settings.rag.topK || 5);
                                if (hits.length > 0) {
                                    ragContext = '\n\n---\n**📚 Contexte documentaire (OpenRAG) :**\n' +
                                        hits.map((h, i) => `[Doc ${i+1} — ${h.source || ''}]\n${h.text}`).join('\n\n') +
                                        '\n---\n';
                                }
                            } else if (ragBackend === 'milvus' && settings.rag.milvusUrl && project.docs.some(d => d.indexed)) {
                                // Mode Milvus : recherche vectorielle
                                const qVecs = await callEmbedding(settings, [userQuery]);
                                if (qVecs && qVecs[0]) {
                                    const colName = `proj_${project.id}`;
                                    const hits = await milvusSearch(settings, colName, qVecs[0], settings.rag.topK || 5);
                                    if (hits.length > 0) {
                                        ragContext = '\n\n---\n**📚 Contexte documentaire (RAG) :**\n' +
                                            hits.map((h, i) => `[Doc ${i+1} — ${h.source || ''}]\n${h.text}`).join('\n\n') +
                                            '\n---\n';
                                    }
                                }
                            } else {
                                // Mode simple : TF-IDF keyword search
                                const docTexts = project.docs
                                    .filter(d => d.text)
                                    .map(d => ({ id: d.id, name: d.name, text: d.text }));
                                if (docTexts.length > 0) {
                                    const hits = tfidfSearch(docTexts, userQuery, settings.rag.topK || 5);
                                    if (hits.length > 0) {
                                        ragContext = '\n\n---\n**📚 Contexte documentaire :**\n' +
                                            hits.map((h, i) => `[${h.name}]\n${h.snippet}`).join('\n\n') +
                                            '\n---\n';
                                    }
                                }
                            }
                        } catch(ragErr) {
                            console.warn('RAG injection error:', ragErr);
                        }
                    }

                    // Injecter le contexte RAG dans le dernier message utilisateur si disponible
                    const apiMessages = updatedMessages.map((m, idx) => {
                        if (idx === updatedMessages.length - 1 && ragContext) {
                            return { role: m.role, content: m.content + ragContext };
                        }
                        return { role: m.role, content: m.content };
                    });

                    const inputChars = apiMessages.reduce((acc, m) => acc + m.content.length, 0);

                    // Streaming : ajouter un message placeholder
                    let streamContent = '';
                    let thinkContent = '';
                    setChatMessages(prev => [...prev, { role: 'assistant', content: '', thinking: '', streaming: true }]);

                    await new Promise((resolve, reject) => {
                        callLLMStream(
                            settings, apiMessages,
                            (chunk) => {
                                streamContent += chunk;
                                setChatMessages(prev => {
                                    const updated = [...prev];
                                    updated[updated.length - 1] = { role: 'assistant', content: streamContent, thinking: thinkContent, streaming: true };
                                    return updated;
                                });
                            },
                            (thinkChunk) => {
                                thinkContent += thinkChunk;
                                setChatMessages(prev => {
                                    const updated = [...prev];
                                    updated[updated.length - 1] = { role: 'assistant', content: streamContent, thinking: thinkContent, streaming: true };
                                    return updated;
                                });
                            },
                            () => {
                                setChatMessages(prev => {
                                    const updated = [...prev];
                                    updated[updated.length - 1] = { role: 'assistant', content: streamContent, thinking: thinkContent, streaming: false };
                                    return updated;
                                });
                                resolve();
                            },
                            (err) => reject(err)
                        );
                    });

                    const outputChars = streamContent.length;
                    const costUSD = estimateCostUSD('llm', settings.llm.model, inputChars, outputChars);
                    updateProjectCosts(project.id, { llmCalls: 1, llmUSD: costUSD, ocrCalls: 0, ocrUSD: 0, embCalls: 0, embTokens: 0, embUSD: 0 });
                } catch (err) {
                    setChatMessages(prev => {
                        const updated = [...prev];
                        // Remplace le placeholder streaming si présent
                        if (updated.length > 0 && updated[updated.length-1].streaming) {
                            updated[updated.length-1] = { role: 'assistant', content: `❌ Erreur : ${err.message}\n\nVérifie ta clé API dans les Réglages (⚙️).`, streaming: false };
                        } else {
                            updated.push({ role: 'assistant', content: `❌ Erreur : ${err.message}\n\nVérifie ta clé API dans les Réglages (⚙️).` });
                        }
                        return updated;
                    });
                } finally {
                    setChatLoading(false);
                }
            };

            const [reverseLoading, setReverseLoading] = useState(false);

            const analyzeWebsite = async () => {
                if (!reverseUrl && !reverseDescription) return;

                if (needsLLMKey(settings)) {
                    alert('Configure ta clé API dans les Réglages (⚙️) pour utiliser le Reverse Engineering.');
                    return;
                }

                setReverseLoading(true);
                setReverseAnalysis(null);
                try {
                    const prompt = `Analyse cette application/site web et retourne un JSON valide (sans markdown, juste le JSON brut).

${reverseUrl ? `URL : ${reverseUrl}` : ''}
${reverseDescription ? `Description : ${reverseDescription}` : ''}

Retourne UNIQUEMENT ce format JSON :
{
  "technologies": ["Tech1", "Tech2", "Tech3"],
  "features": ["Fonctionnalité 1", "Fonctionnalité 2"],
  "bricks": [{"name": "Nom brique", "days": 3}],
  "totalDays": 15,
  "mvpDays": 5,
  "summary": "Résumé en 2-3 phrases",
  "mvpSuggestion": "Suggestion MVP simplifié en 2-3 phrases"
}

Sois réaliste sur les estimations de jours. Identifie les vraies technologies probables. Liste 5-8 fonctionnalités et 4-8 briques.`;

                    const result = await callLLM(settings, [{ role: 'user', content: prompt }]);
                    const costUSD = estimateCostUSD('llm', settings.llm.model, prompt.length, result.length);
                    updateProjectCosts(project.id, { llmCalls: 1, llmUSD: costUSD, ocrCalls: 0, ocrUSD: 0, embCalls: 0, embTokens: 0, embUSD: 0 });
                    const jsonMatch = result.match(/\{[\s\S]*\}/);
                    if (!jsonMatch) throw new Error('Réponse invalide');
                    const analysis = JSON.parse(jsonMatch[0]);
                    analysis.url = reverseUrl;
                    setReverseAnalysis(analysis);
                } catch (err) {
                    alert('Erreur analyse : ' + err.message);
                } finally {
                    setReverseLoading(false);
                }
            };

            const createProjectFromAnalysis = () => {
                if (!reverseAnalysis) return;
                const name = reverseUrl ? new URL(reverseUrl).hostname.replace('www.', '') : 'Analyse';
                const newProject = {
                    id: Date.now().toString(),
                    name: `Clone ${name}`,
                    type: 'reverse',
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString(),
                    answers: {},
                    reverseAnalysis: reverseAnalysis,
                    recommendations: null,
                    completion: { phase1: 0, phase2: 0, phase3: 0, phase4: 0 }
                };
                const updated = [...projects.filter(p => p.id !== project.id), newProject];
                onSave(newProject);
            };

            return (
                <div className="app-container fade-in">
                    <div className="app-header">
                        <div className="header-left">
                            <button className="btn btn-secondary" onClick={onBack}>
                                ← Retour
                            </button>
                            <div className="header-title">
                                <h1>{project.name}</h1>
                                <div className="header-version">
                                    {project.type === 'reverse' ? '🔍 Reverse Engineering' : '✨ Projet Stratégique'}
                                </div>
                            </div>
                        </div>
                        <div className="header-right">
                            <button className="btn btn-secondary" onClick={() => setShowSettings(true)} title="Réglages">
                                ⚙️ Réglages
                            </button>
                            {syncStatus !== 'offline' && (
                                <div className={`sync-status ${syncStatus === 'syncing' ? 'syncing' : ''}`}>
                                    <div className="sync-dot"></div>
                                    {syncStatus === 'syncing' ? 'Sauvegarde...' : 'Sauvegardé'}
                                </div>
                            )}

        };

        // Composants onglets
        const QuestionnaireTab = ({ mode, setMode, currentPhase, setCurrentPhase, answers, handleAnswer, showHelp, setShowHelp, chatMessages, chatInput, setChatInput, handleChatSend, project, settings, setShowSettings, chatLoading }) => {
            const phaseData = QUESTIONS_DATA[`phase${currentPhase}`];
            const [isRecording, setIsRecording] = React.useState(false);
            const [voiceEnabled, setVoiceEnabled] = React.useState(false);
            const [folderChatLoading, setFolderChatLoading] = React.useState(false);
            const [importFiles, setImportFiles] = React.useState([]);
            const [importAnalyzing, setImportAnalyzing] = React.useState(false);
            const [importMsg, setImportMsg] = React.useState(null);
            const recognitionRef = React.useRef(null);
            const messagesEndRef = React.useRef(null);
            const folderChatInputRef = React.useRef(null);
            const importFilesRef = React.useRef(null);
            const importFolderRef = React.useRef(null);

            const FOLDER_TEXT_EXTS = /\.(txt|md|mdx|csv|json|js|jsx|ts|tsx|py|rs|go|java|cs|php|rb|swift|kt|c|cpp|h|hpp|vue|svelte|html|css|scss|less|yaml|yml|toml|sh|bash|zsh|sql|xml|dart|lua|r|scala|env\.example|gitignore|Dockerfile|makefile)$/i;
            const FOLDER_IGNORE = /node_modules|\.git|dist|build|\.next|\.nuxt|\.cache|__pycache__|\.DS_Store|\.env$|package-lock\.json|yarn\.lock|pnpm-lock/;
            const IMPORT_EXTS = /\.(txt|md|mdx|pdf|csv|json|js|jsx|ts|tsx|py|rs|go|java|cs|php|rb|swift|kt|c|cpp|h|hpp|vue|svelte|html|css|scss|yaml|yml|toml|sh|sql|xml|dart|lua|r|scala)$/i;

            const handleFolderForChat = async (files) => {
                const validFiles = Array.from(files)
                    .filter(f => FOLDER_TEXT_EXTS.test(f.name) && !FOLDER_IGNORE.test(f.webkitRelativePath || f.name))
                    .slice(0, 60);
                if (validFiles.length === 0) return;
                setFolderChatLoading(true);
                try {
                    const folderName = (validFiles[0].webkitRelativePath || '').split('/')[0] || 'projet';
                    let content = `📁 Dossier "${folderName}" — ${validFiles.length} fichier(s) :\n\n`;
                    let totalChars = 0;
                    const MAX = 25000;
                    for (const file of validFiles) {
                        if (totalChars >= MAX) { content += `\n[… ${validFiles.length - validFiles.indexOf(file)} fichiers supplémentaires non inclus (limite contexte)]`; break; }
                        const path = file.webkitRelativePath || file.name;
                        const text = await file.text().catch(() => '');
                        if (!text.trim()) continue;
                        const excerpt = text.substring(0, 4000);
                        content += `### ${path}\n\`\`\`\n${excerpt}${text.length > 4000 ? '\n[… tronqué]' : ''}\n\`\`\`\n\n`;
                        totalChars += excerpt.length;
                    }
                    setChatInput(content);
                } finally {
                    setFolderChatLoading(false);
                    if (folderChatInputRef.current) folderChatInputRef.current.value = '';
                }
            };

            const addImportFiles = (files) => {
                const arr = Array.from(files).filter(f => {
                    const name = f.name;
                    const path = f.webkitRelativePath || name;
                    return IMPORT_EXTS.test(name) && !FOLDER_IGNORE.test(path);
                }).slice(0, 80);
                if (arr.length === 0) { setImportMsg({ error: 'Aucun fichier compatible trouvé (PDF, TXT, MD, JSON, code...)' }); return; }
                setImportFiles(prev => {
                    const existing = new Set(prev.map(f => f.name + f.size));
                    const newOnes = arr.filter(f => !existing.has(f.name + f.size));
                    return [...prev, ...newOnes];
                });
                setImportMsg(null);
            };

            const analyzeDocsAndFill = async () => {
                if (!importFiles.length) return;
                if (needsLLMKey(settings)) {
                    setImportMsg({ error: 'Configure un provider LLM gratuit dans les Réglages (Groq recommandé — compte email suffit).' });
                    return;
                }
                setImportAnalyzing(true);
                setImportMsg(null);
                try {
                    let context = '';
                    let totalChars = 0;
                    const MAX = 28000;
                    for (const file of importFiles) {
                        if (totalChars >= MAX) { context += '\n\n[Limite de contexte atteinte — autres fichiers ignorés]'; break; }
                        let text = '';
                        if (file.name.toLowerCase().endsWith('.pdf')) {
                            try { text = await extractPdfText(file); } catch(e) { text = ''; }
                        } else {
                            text = await file.text().catch(() => '');
                        }
                        if (!text.trim()) continue;
                        const excerpt = text.substring(0, 5000);
                        context += `\n\n=== ${file.webkitRelativePath || file.name} ===\n${excerpt}${text.length > 5000 ? '\n[... tronqué]' : ''}`;
                        totalChars += excerpt.length;
                    }

                    const prompt = `Tu es un expert en analyse de projets d'application. Analyse les documents ci-dessous et génère des réponses JSON pour ce questionnaire stratégique.

RÈGLES STRICTES:
- Réponds UNIQUEMENT avec un objet JSON valide, sans markdown ni explications
- Déduis les infos depuis les documents
- Pour les champs "options", utilise EXACTEMENT une des valeurs listées
- Pour les champs "multi-options", utilise un tableau des valeurs listées
- Pour les champs "textarea", génère un texte clair en français

FORMAT JSON ATTENDU (toutes les clés):
{
  "p1q1": "étapes principales du processus (texte)",
  "p1q2": "ordre des étapes (texte)",
  "p1q3": "choix que font les utilisateurs (texte)",
  "p1q4": "informations à stocker (texte)",
  "p1q5": "ce qui peut mal se passer (texte)",
  "p2q1": "grand_public OU entreprises OU interne OU professions",
  "p2q2": ["web","ios","android","desktop"],
  "p2q3": "small OU medium OU large OU massive",
  "p2q4": "solo OU small OU medium OU large",
  "p2q5": ["auth","payment","chat","realtime","geo","ai","files","search"],
  "p2q6": "tight OU moderate OU comfortable OU enterprise",
  "p2q7": "standard OU rgpd OU sensitive OU local",
  "p3q1": "saas OU marketplace OU ecommerce OU freemium OU ads OU license",
  "p3q2": "clients cibles (texte)",
  "p3q3": "proposition de valeur unique (texte)",
  "p3q4": "concurrents principaux (texte)",
  "p3q5": "bootstrap OU small OU medium OU large",
  "p4q1": "valeurs fondamentales (texte)",
  "p4q2": "impact sociétal voulu (texte)",
  "p4q3": ["privacy","accessibility","transparency","sustainability","fairness"],
  "p4q4": "organic OU funded OU bootstrap OU exit"
}

DOCUMENTS À ANALYSER:
${context}`;

                    const response = await callLLM([{ role: 'user', content: prompt }], settings, null);

                    let json;
                    try {
                        json = JSON.parse(response.trim());
                    } catch {
                        const m1 = response.match(/```(?:json)?\s*([\s\S]*?)```/);
                        if (m1) { json = JSON.parse(m1[1].trim()); }
                        else {
                            const m2 = response.match(/\{[\s\S]*\}/);
                            if (m2) json = JSON.parse(m2[0]);
                            else throw new Error('Le LLM n\'a pas renvoyé de JSON valide');
                        }
                    }

                    let filled = 0;
                    Object.entries(json).forEach(([key, value]) => {
                        if (value !== null && value !== undefined && value !== '') {
                            handleAnswer(key, value);
                            filled++;
                        }
                    });

                    setImportMsg({ success: `✅ ${filled} champs remplis automatiquement depuis ${importFiles.length} document(s) ! Parcours les phases pour vérifier et compléter.` });
                    setImportFiles([]);
                    if (importFilesRef.current) importFilesRef.current.value = '';
                    if (importFolderRef.current) importFolderRef.current.value = '';
                } catch(e) {
                    setImportMsg({ error: `Erreur : ${e.message}` });
                } finally {
                    setImportAnalyzing(false);
                }
            };

            React.useEffect(() => {
                if (messagesEndRef.current) {
                    messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [chatMessages]);

            // Lecture vocale de la dernière réponse IA
            React.useEffect(() => {
                if (!voiceEnabled || chatMessages.length === 0) return;
                const last = chatMessages[chatMessages.length - 1];
                if (last.role === 'assistant' && window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                    const utter = new SpeechSynthesisUtterance(last.content.replace(/[*_`#]/g, ''));
                    utter.lang = 'fr-FR';
                    window.speechSynthesis.speak(utter);
                }
            }, [chatMessages]);

            const startVoiceInput = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    alert('La reconnaissance vocale n\'est pas supportée par ce navigateur. Utilise Chrome ou Edge.');
                    return;
                }
                if (isRecording) {
                    recognitionRef.current?.stop();
                    setIsRecording(false);
                    return;
                }
                const recognition = new SpeechRecognition();
                recognition.lang = 'fr-FR';
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.onstart = () => setIsRecording(true);
                recognition.onend = () => setIsRecording(false);
                recognition.onresult = (e) => {
                    const transcript = e.results[0][0].transcript;
                    setChatInput(prev => prev + (prev ? ' ' : '') + transcript);
                };
                recognition.onerror = (e) => {
                    setIsRecording(false);
                    if (e.error !== 'aborted') alert('Erreur micro : ' + e.error);
                };
                recognitionRef.current = recognition;
                recognition.start();
            };

            return (
                <div className="fade-in">
                    {/* HEADER : titre + mode toggle pills */}
                    <div style={{
                        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                        marginBottom: '24px', paddingBottom: '20px',
                        borderBottom: '2px solid #f0f0f0'
                    }}>
                        <div>
                            <h2 style={{ fontSize: '1.5em', fontWeight: 700, margin: 0 }}>
                                📝 Questionnaire
                            </h2>
                            <p style={{ margin: '4px 0 0', fontSize: '0.85em', color: '#999' }}>
                                Phase {currentPhase}/4 — {phaseData?.title}
                            </p>
                        </div>
                        <div style={{
                            display: 'flex', gap: '4px',
                            background: '#f3f4f6', borderRadius: '12px',
                            padding: '4px'
                        }}>
                            <button
                                onClick={() => setMode('guided')}
                                style={{
                                    padding: '8px 18px', borderRadius: '10px', border: 'none',
                                    background: mode === 'guided' ? 'white' : 'transparent',
                                    color: mode === 'guided' ? '#667eea' : '#888',
                                    fontWeight: 700, fontSize: '0.85em', cursor: 'pointer',
                                    boxShadow: mode === 'guided' ? '0 2px 8px rgba(0,0,0,0.08)' : 'none',
                                    transition: 'all 0.2s', display: 'flex', alignItems: 'center', gap: '6px'
                                }}
                            >📋 Guidé</button>
                            <button
                                onClick={() => setMode('chat')}
                                style={{
                                    padding: '8px 18px', borderRadius: '10px', border: 'none',
                                    background: mode === 'chat' ? 'white' : 'transparent',
                                    color: mode === 'chat' ? '#667eea' : '#888',
                                    fontWeight: 700, fontSize: '0.85em', cursor: 'pointer',
                                    boxShadow: mode === 'chat' ? '0 2px 8px rgba(0,0,0,0.08)' : 'none',
                                    transition: 'all 0.2s', display: 'flex', alignItems: 'center', gap: '6px'
                                }}
                            >💬 Chat</button>
                        </div>
                    </div>

                    {/* BARRE COMPACTE : import + progression fusionnés */}
                    <div style={{
                        display: 'flex', gap: '16px', marginBottom: '24px',
                        flexWrap: 'wrap'
                    }}>
                        {/* Import compact */}
                        <div
                            onDragOver={e => { e.preventDefault(); e.currentTarget.style.borderColor = '#667eea'; }}
                            onDragLeave={e => { e.currentTarget.style.borderColor = '#e0e0e0'; }}
                            onDrop={e => { e.preventDefault(); e.currentTarget.style.borderColor = '#e0e0e0'; addImportFiles(e.dataTransfer.files); }}
                            style={{
                                flex: '1 1 280px',
                                background: 'white', borderRadius: '12px',
                                border: '2px dashed #e0e0e0', padding: '14px 18px',
                                display: 'flex', alignItems: 'center', gap: '14px',
                                transition: 'border-color 0.2s', cursor: 'pointer',
                                minWidth: '200px'
                            }}
                        >
                            <span style={{
                                fontSize: '1.4em', width: '40px', height: '40px',
                                display: 'flex', alignItems: 'center', justifyContent: 'center',
                                background: '#eef2ff', borderRadius: '10px', flexShrink: 0
                            }}>🤖</span>
                            <div style={{ flex: 1 }}>
                                <div style={{ fontWeight: 600, fontSize: '0.88em', color: '#333' }}>
                                    Importer des documents
                                </div>
                                <div style={{ fontSize: '0.75em', color: '#999', marginTop: '2px' }}>
                                    PDF · TXT · MD · Code
                                </div>
                            </div>
                            <div style={{ display: 'flex', gap: '4px', flexShrink: 0 }}>
                                <button onClick={(e) => { e.stopPropagation(); importFilesRef.current?.click(); }}
                                    style={{
                                        padding: '6px 12px', borderRadius: '8px', border: '1px solid #ddd',
                                        background: 'white', cursor: 'pointer', fontSize: '0.78em',
                                        fontWeight: 600, color: '#667eea'
                                    }}
                                >📄</button>
                                <button onClick={(e) => { e.stopPropagation(); importFolderRef.current?.click(); }}
                                    style={{
                                        padding: '6px 12px', borderRadius: '8px', border: '1px solid #ddd',
                                        background: 'white', cursor: 'pointer', fontSize: '0.78em',
                                        fontWeight: 600, color: '#667eea'
                                    }}
                                >📁</button>
                            </div>
                            <input ref={importFilesRef} type="file" multiple accept=".pdf,.txt,.md,.mdx,.csv,.json,.js,.jsx,.ts,.tsx,.py,.rs,.go,.java,.cs,.php,.rb,.html,.css,.yaml,.yml,.xml,.sql,.sh" style={{ display: 'none' }}
                                onChange={e => { if (e.target.files.length) addImportFiles(e.target.files); }} />
                            <input ref={importFolderRef} type="file" webkitdirectory="true" multiple style={{ display: 'none' }}
                                onChange={e => { if (e.target.files.length) addImportFiles(e.target.files); }} />
                        </div>

                        {/* Progression compacte */}
                        <div style={{
                            flex: '1 1 200px',
                            background: 'white', borderRadius: '12px',
                            border: '1px solid #f0f0f0', padding: '14px 18px',
                            display: 'flex', alignItems: 'center', gap: '12px'
                        }}>
                            <div style={{ display: 'flex', gap: '4px', flexShrink: 0 }}>
                                {[1, 2, 3, 4].map(phase => (
                                    <div key={phase} onClick={() => setCurrentPhase(phase)}
                                        style={{
                                            width: '32px', height: '32px', borderRadius: '50%',
                                            display: 'flex', alignItems: 'center', justifyContent: 'center',
                                            fontSize: '0.75em', fontWeight: 700, cursor: 'pointer',
                                            background: phase === currentPhase ? 'linear-gradient(135deg, #667eea, #764ba2)' :
                                                phase < currentPhase ? '#d1fae5' : '#f3f4f6',
                                            color: phase === currentPhase ? 'white' :
                                                phase < currentPhase ? '#065f46' : '#bbb',
                                            transition: 'all 0.2s',
                                            boxShadow: phase === currentPhase ? '0 3px 10px rgba(102,126,234,0.3)' : 'none'
                                        }}
                                    >
                                        {phase < currentPhase ? '✓' : phase}
                                    </div>
                                ))}
                            </div>
                            <div style={{ flex: 1, minWidth: '60px' }}>
                                <div style={{ fontSize: '0.78em', color: '#999', fontWeight: 600 }}>
                                    Complété
                                </div>
                                <div style={{
                                    fontSize: '1.1em', fontWeight: 800,
                                    background: 'linear-gradient(135deg, #667eea, #764ba2)',
                                    WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent'
                                }}>
                                    {Math.round(
                                        ['phase1','phase2','phase3','phase4']
                                            .reduce((sum, p) => sum + (project.completion[p] || 0), 0) / 4
                                    )}%
                                </div>
                            </div>
                        </div>

                        {/* Analyser bouton (apparaît quand fichiers sélectionnés) */}
                        {importFiles.length > 0 && (
                            <div style={{
                                flex: '1 1 100%',
                                background: '#f0fdf4', borderRadius: '12px',
                                border: '1px solid #bbf7d0', padding: '12px 18px',
                                display: 'flex', alignItems: 'center', gap: '12px',
                                flexWrap: 'wrap'
                            }}>
                                <span style={{ fontSize: '0.82em', color: '#065f46', fontWeight: 600 }}>
                                    📄 {importFiles.length} fichier(s) sélectionné(s)
                                </span>
                                <div style={{ flex: 1, display: 'flex', flexWrap: 'wrap', gap: '4px' }}>
                                    {importFiles.slice(0, 8).map((f, i) => (
                                        <span key={i} style={{
                                            background: '#dcfce7', borderRadius: '6px',
                                            padding: '2px 8px', fontSize: '0.72em', color: '#065f46'
                                        }}>
                                            {f.name.length > 20 ? f.name.slice(0, 17) + '…' : f.name}
                                            <button onClick={() => setImportFiles(prev => prev.filter((_, j) => j !== i))}
                                                style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#999', marginLeft: '4px', fontSize: '0.9em', padding: 0 }}>✕</button>
                                        </span>
                                    ))}
                                    {importFiles.length > 8 && (
                                        <span style={{ fontSize: '0.72em', color: '#999', alignSelf: 'center' }}>
                                            +{importFiles.length - 8}
                                        </span>
                                    )}
                                </div>
                                <button onClick={analyzeDocsAndFill} disabled={importAnalyzing}
                                    style={{
                                        padding: '8px 20px', borderRadius: '8px', border: 'none',
                                        background: importAnalyzing ? '#d1d5db' : 'linear-gradient(135deg, #059669, #047857)',
                                        color: 'white', fontWeight: 700, fontSize: '0.82em',
                                        cursor: importAnalyzing ? 'wait' : 'pointer',
                                        display: 'flex', alignItems: 'center', gap: '6px', flexShrink: 0
                                    }}
                                >
                                    {importAnalyzing ? '⏳ Analyse…' : '✨ Remplir automatiquement'}
                                </button>
                                <button onClick={() => setImportFiles([])}
                                    style={{
                                        background: 'none', border: 'none', color: '#ef4444',
                                        cursor: 'pointer', fontSize: '0.78em', fontWeight: 600
                                    }}
                                >✕ Vider</button>
                            </div>
                        )}
                        {importMsg && (
                            <div style={{
                                flex: '1 1 100%', padding: '10px 16px', borderRadius: '10px',
                                fontSize: '0.85em', fontWeight: 600,
                                background: importMsg.success ? '#d1fae5' : '#fee2e2',
                                color: importMsg.success ? '#065f46' : '#991b1b',
                                border: `1px solid ${importMsg.success ? '#6ee7b7' : '#fca5a5'}`
                            }}>
                                {importMsg.success || importMsg.error}
                            </div>
                        )}
                    </div>

                    {mode === 'guided' ? (
                        <>
                            {/* EN-TÊTE PHASE */}
                            <div style={{
                                background: 'white', borderRadius: '16px',
                                border: '1px solid #f0f0f0',
                                padding: '24px', marginBottom: '24px',
                                boxShadow: '0 2px 12px rgba(0,0,0,0.04)'
                            }}>
                                <div style={{
                                    display: 'flex', justifyContent: 'space-between',
                                    alignItems: 'flex-start', flexWrap: 'wrap', gap: '12px'
                                }}>
                                    <div>
                                        <div style={{ fontSize: '2em', marginBottom: '4px' }}>{phaseData.icon}</div>
                                        <h3 style={{ fontSize: '1.4em', fontWeight: 700, margin: 0, color: '#1a1a1a' }}>
                                            {phaseData.title}
                                        </h3>
                                        <p style={{ color: '#888', fontSize: '0.88em', marginTop: '4px', lineHeight: '1.5' }}>
                                            {phaseData.subtitle}
                                        </p>
                                    </div>
                                    <div style={{
                                        background: '#f3f4f6', borderRadius: '10px',
                                        padding: '8px 16px', textAlign: 'center',
                                        minWidth: '80px'
                                    }}>
                                        <div style={{ fontSize: '1.3em', fontWeight: 800, color: '#667eea' }}>
                                            {project.completion[`phase${currentPhase}`] || 0}%
                                        </div>
                                        <div style={{ fontSize: '0.7em', color: '#999', fontWeight: 600 }}>
                                            complété
                                        </div>
                                    </div>
                                </div>
                                {['phase1','phase2','phase3','phase4'].map((p, idx) => {
                                    const pct = project.completion[p] || 0;
                                    return (
                                        <div key={p} style={{
                                            display: 'flex', alignItems: 'center', gap: '10px',
                                            marginTop: idx === 0 ? '16px' : '6px'
                                        }}>
                                            <span style={{
                                                fontSize: '0.75em', fontWeight: 600, color: '#999',
                                                minWidth: '100px'
                                            }}>
                                                {QUESTIONS_DATA[p]?.icon} {QUESTIONS_DATA[p]?.title?.split(' — ')[0]}
                                            </span>
                                            <div style={{
                                                flex: 1, height: '6px', background: '#f0f0f0',
                                                borderRadius: '3px', overflow: 'hidden'
                                            }}>
                                                <div style={{
                                                    width: `${pct}%`, height: '100%',
                                                    background: `linear-gradient(90deg, 
                                                        ${p === 'phase1' ? '#667eea' : p === 'phase2' ? '#10b981' : p === 'phase3' ? '#f59e0b' : '#8b5cf6'}, 
                                                        ${p === 'phase1' ? '#764ba2' : p === 'phase2' ? '#047857' : p === 'phase3' ? '#b45309' : '#6d28d9'})`,
                                                    borderRadius: '3px',
                                                    transition: 'width 0.5s ease'
                                                }} />
                                            </div>
                                            <span style={{ fontSize: '0.75em', fontWeight: 700, color: '#666', minWidth: '32px', textAlign: 'right' }}>
                                                {pct}%
                                            </span>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* PHASE INDICATOR - stepper horizontal */}
                            <div style={{
                                display: 'flex', alignItems: 'center', justifyContent: 'center',
                                gap: '8px', marginBottom: '28px', padding: '16px',
                                background: 'white', borderRadius: '14px',
                                border: '1px solid #f0f0f0'
                            }}>
                                {[1, 2, 3, 4].map((phase, idx) => (
                                    <React.Fragment key={phase}>
                                        <div
                                            onClick={() => setCurrentPhase(phase)}
                                            style={{
                                                display: 'flex', alignItems: 'center', gap: '8px',
                                                padding: '6px 14px', borderRadius: '10px',
                                                cursor: 'pointer', transition: 'all 0.2s',
                                                background: phase === currentPhase ? 'linear-gradient(135deg, #667eea, #764ba2)' :
                                                    phase < currentPhase ? '#d1fae5' : 'transparent',
                                                color: phase === currentPhase ? 'white' :
                                                    phase < currentPhase ? '#065f46' : '#999',
                                                fontWeight: phase === currentPhase ? 700 : 500,
                                                fontSize: '0.82em'
                                            }}
                                        >
                                            <span style={{
                                                width: '24px', height: '24px', borderRadius: '50%',
                                                display: 'flex', alignItems: 'center', justifyContent: 'center',
                                                fontSize: '0.8em', fontWeight: 700,
                                                background: phase === currentPhase ? 'rgba(255,255,255,0.25)' : 'transparent',
                                                border: phase === currentPhase ? 'none' : `2px solid ${phase < currentPhase ? '#10b981' : '#ddd'}`
                                            }}>
                                                {phase < currentPhase ? '✓' : phase}
                                            </span>
                                            <span style={{ whiteSpace: 'nowrap' }}>
                                                {QUESTIONS_DATA[`phase${phase}`]?.icon} {QUESTIONS_DATA[`phase${phase}`]?.title?.split(' — ')[0]}
                                            </span>
                                        </div>
                                        {idx < 3 && (
                                            <div style={{
                                                width: '20px', height: '2px',
                                                background: phase <= currentPhase ? '#10b981' : '#e0e0e0',
                                                borderRadius: '1px'
                                            }} />
                                        )}
                                    </React.Fragment>
                                ))}
                            </div>

                            {/* QUESTIONS */}
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                                {phaseData.questions.map((question, qIndex) => (
                                    <div key={question.id}
                                        style={{
                                            background: 'white', borderRadius: '16px',
                                            border: `1px solid ${answers[question.id] ? '#d1fae5' : '#eee'}`,
                                            padding: '24px',
                                            boxShadow: answers[question.id]
                                                ? '0 4px 20px rgba(16,185,129,0.08)'
                                                : '0 2px 12px rgba(0,0,0,0.03)',
                                            transition: 'all 0.2s',
                                            position: 'relative'
                                        }}
                                    >
                                        {/* Numéro de question */}
                                        <div style={{
                                            position: 'absolute', top: '-10px', left: '20px',
                                            background: answers[question.id] ? '#10b981' : '#667eea',
                                            color: 'white', borderRadius: '20px',
                                            padding: '2px 12px', fontSize: '0.7em', fontWeight: 700
                                        }}>
                                            Question {qIndex + 1}/{phaseData.questions.length}
                                        </div>

                                        <div style={{ display: 'flex', gap: '12px', marginBottom: '16px', marginTop: '4px' }}>
                                            <div style={{ flex: 1 }}>
                                                <div style={{
                                                    fontWeight: 600, fontSize: '1em', color: '#1a1a1a',
                                                    lineHeight: '1.5'
                                                }}>
                                                    {question.text}
                                                </div>
                                                {showHelp[question.id] && (
                                                    <div style={{
                                                        marginTop: '10px', padding: '12px 16px',
                                                        background: '#eef2ff', borderRadius: '10px',
                                                        fontSize: '0.85em', color: '#4f46e5',
                                                        lineHeight: '1.6', borderLeft: '3px solid #667eea'
                                                    }}>
                                                        💡 {question.help}
                                                    </div>
                                                )}
                                            </div>
                                            <div style={{ display: 'flex', gap: '6px', flexShrink: 0, alignItems: 'flex-start' }}>
                                                {answers[question.id] && (
                                                    <span style={{ color: '#10b981', fontSize: '1.2em' }}>✓</span>
                                                )}
                                                <div
                                                    onClick={() => setShowHelp(prev => ({ ...prev, [question.id]: !prev[question.id] }))}
                                                    style={{
                                                        width: '28px', height: '28px', borderRadius: '50%',
                                                        background: showHelp[question.id] ? '#667eea' : '#f3f4f6',
                                                        color: showHelp[question.id] ? 'white' : '#999',
                                                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                                                        cursor: 'pointer', fontSize: '0.8em', fontWeight: 700,
                                                        transition: 'all 0.2s'
                                                    }}
                                                    title="Aide"
                                                >?</div>
                                            </div>
                                        </div>

                                        {/* TEXTAREA */}
                                        {question.type === 'textarea' && (
                                            <textarea
                                                style={{
                                                    width: '100%', minHeight: '100px', padding: '14px 16px',
                                                    borderRadius: '12px', border: '2px solid #e5e7eb',
                                                    fontSize: '0.9em', fontFamily: 'inherit', lineHeight: '1.6',
                                                    outline: 'none', resize: 'vertical',
                                                    transition: 'border-color 0.2s',
                                                    background: answers[question.id] ? '#fafdfa' : 'white'
                                                }}
                                                placeholder={question.placeholder}
                                                value={answers[question.id] || ''}
                                                onChange={(e) => handleAnswer(question.id, e.target.value)}
                                                onFocus={e => e.target.style.borderColor = '#667eea'}
                                                onBlur={e => e.target.style.borderColor = '#e5e7eb'}
                                            />
                                        )}

                                        {/* OPTIONS */}
                                        {question.type === 'options' && (
                                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(160px, 1fr))', gap: '10px' }}>
                                                {question.options.map(opt => {
                                                    const isSelected = answers[question.id] === opt.value;
                                                    return (
                                                        <div
                                                            key={opt.value}
                                                            onClick={() => handleAnswer(question.id, opt.value)}
                                                            style={{
                                                                padding: '14px 16px', borderRadius: '12px',
                                                                border: `2px solid ${isSelected ? '#667eea' : '#eee'}`,
                                                                background: isSelected ? 'linear-gradient(135deg, #eef2ff 0%, #faf5ff 100%)' : 'white',
                                                                cursor: 'pointer', transition: 'all 0.2s',
                                                                textAlign: 'center',
                                                                boxShadow: isSelected ? '0 4px 15px rgba(102,126,234,0.15)' : 'none',
                                                                transform: isSelected ? 'scale(1.02)' : 'scale(1)'
                                                            }}
                                                            onMouseEnter={e => { if (!isSelected) { e.currentTarget.style.borderColor = '#c4b5fd'; e.currentTarget.style.background = '#faf5ff'; } }}
                                                            onMouseLeave={e => { if (!isSelected) { e.currentTarget.style.borderColor = '#eee'; e.currentTarget.style.background = 'white'; } }}
                                                        >
                                                            <div style={{ fontSize: '1.6em', marginBottom: '6px' }}>{opt.icon}</div>
                                                            <div style={{
                                                                fontWeight: isSelected ? 700 : 500,
                                                                fontSize: '0.85em', color: isSelected ? '#4f46e5' : '#555'
                                                            }}>
                                                                {opt.label}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}

                                        {/* MULTI-OPTIONS */}
                                        {question.type === 'multi-options' && (
                                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(160px, 1fr))', gap: '10px' }}>
                                                {question.options.map(opt => {
                                                    const selected = (answers[question.id] || []).includes(opt.value);
                                                    return (
                                                        <div
                                                            key={opt.value}
                                                            onClick={() => {
                                                                const current = answers[question.id] || [];
                                                                const newValue = selected
                                                                    ? current.filter(v => v !== opt.value)
                                                                    : [...current, opt.value];
                                                                handleAnswer(question.id, newValue);
                                                            }}
                                                            style={{
                                                                padding: '14px 16px', borderRadius: '12px',
                                                                border: `2px solid ${selected ? '#10b981' : '#eee'}`,
                                                                background: selected ? '#f0fdf4' : 'white',
                                                                cursor: 'pointer', transition: 'all 0.2s',
                                                                textAlign: 'center',
                                                                boxShadow: selected ? '0 4px 15px rgba(16,185,129,0.12)' : 'none'
                                                            }}
                                                            onMouseEnter={e => { if (!selected) { e.currentTarget.style.borderColor = '#a7f3d0'; e.currentTarget.style.background = '#f0fdf4'; } }}
                                                            onMouseLeave={e => { if (!selected) { e.currentTarget.style.borderColor = '#eee'; e.currentTarget.style.background = 'white'; } }}
                                                        >
                                                            <div style={{ fontSize: '1.6em', marginBottom: '6px' }}>{opt.icon}</div>
                                                            <div style={{
                                                                fontWeight: selected ? 700 : 500,
                                                                fontSize: '0.85em', color: selected ? '#065f46' : '#555'
                                                            }}>
                                                                {opt.label}
                                                            </div>
                                                            {selected && <div style={{ fontSize: '0.7em', color: '#10b981', marginTop: '4px', fontWeight: 700 }}>✓ Sélectionné</div>}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}

                                        {/* Skip button discret */}
                                        <div style={{ marginTop: '12px', textAlign: 'right' }}>
                                            <button
                                                onClick={() => handleAnswer(question.id, 'Skipped')}
                                                style={{
                                                    background: 'none', border: 'none', color: '#bbb',
                                                    fontSize: '0.78em', cursor: 'pointer', fontWeight: 500
                                                }}
                                            >Passer cette question →</button>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* NAVIGATION */}
                            <div style={{
                                display: 'flex', gap: '12px', marginTop: '28px', marginBottom: '10px'
                            }}>
                                <button
                                    onClick={() => setCurrentPhase(Math.max(1, currentPhase - 1))}
                                    disabled={currentPhase === 1}
                                    style={{
                                        flex: 1, padding: '14px 24px',
                                        borderRadius: '12px',
                                        background: currentPhase === 1 ? '#f3f4f6' : 'white',
                                        border: `2px solid ${currentPhase === 1 ? '#e5e7eb' : '#e5e7eb'}`,
                                        color: currentPhase === 1 ? '#bbb' : '#555',
                                        fontWeight: 600, fontSize: '0.9em', cursor: currentPhase === 1 ? 'not-allowed' : 'pointer',
                                        transition: 'all 0.2s',
                                        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '6px'
                                    }}
                                >← Phase {currentPhase - 1 || ''}</button>
                                <button
                                    onClick={() => setCurrentPhase(Math.min(4, currentPhase + 1))}
                                    style={{
                                        flex: 1, padding: '14px 24px',
                                        borderRadius: '12px',
                                        background: 'linear-gradient(135deg, #667eea, #764ba2)',
                                        border: 'none',
                                        color: 'white',
                                        fontWeight: 700, fontSize: '0.9em', cursor: 'pointer',
                                        boxShadow: '0 6px 20px rgba(102,126,234,0.3)',
                                        transition: 'all 0.2s',
                                        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '6px'
                                    }}
                                >{currentPhase === 4 ? '✨ Terminer' : `Phase ${currentPhase + 1} →`}</button>
                            </div>
                        </>
                    ) : (
                        <div className="chat-container" style={{
                            background: 'white', borderRadius: '16px',
                            border: '1px solid #f0f0f0', padding: '20px',
                            boxShadow: '0 2px 12px rgba(0,0,0,0.04)'
                        }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px', flexWrap: 'wrap', gap: '10px' }}>
                                {needsLLMKey(settings) ? (
                                    <div className="alert alert-warning" style={{ flex: 1, margin: 0 }}>
                                        ⚠️ Chat IA non configuré. <button onClick={() => setShowSettings(true)} style={{ background: 'var(--primary)', color: 'white', border: 'none', borderRadius: '5px', padding: '5px 15px', cursor: 'pointer', marginLeft: '10px' }}>⚙️ Réglages</button>
                                    </div>
                                ) : (
                                    <div className="alert alert-info" style={{ flex: 1, margin: 0 }}>
                                        💬 {LLM_PROVIDERS[settings.llm.provider]?.name?.split('(')[0].trim()} — Discute de ton projet avec l'IA
                                    </div>
                                )}
                                <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                                    <button
                                        onClick={() => setVoiceEnabled(v => !v)}
                                        title={voiceEnabled ? 'Désactiver la lecture vocale des réponses' : 'Activer la lecture vocale des réponses'}
                                        style={{
                                            background: voiceEnabled ? 'var(--primary)' : 'var(--light)',
                                            color: voiceEnabled ? 'white' : '#555',
                                            border: '1px solid var(--border)', borderRadius: '8px',
                                            padding: '8px 12px', cursor: 'pointer', fontSize: '0.9em'
                                        }}
                                    >
                                        {voiceEnabled ? '🔊 Voix ON' : '🔇 Voix OFF'}
                                    </button>
                                </div>
                            </div>

                            <div className="chat-messages">
                                {chatMessages.length === 0 && (
                                    <div style={{ textAlign: 'center', color: '#999', padding: '40px' }}>
                                        {(settings.llm.apiKey || settings.llm.provider === 'ollama' || settings.llm.provider === 'colab')
                                            ? "Commence à discuter de ton projet... L'IA va t'aider ! Tu peux aussi parler avec le 🎤"
                                            : "Configure ta clé API dans les Réglages pour activer le chat IA."
                                        }
                                    </div>
                                )}
                                {chatMessages.map((msg, idx) => (
                                    <div key={idx} className={`chat-message ${msg.role}`}>
                                        <div className="chat-avatar">{msg.role === 'user' ? '🧑' : '🤖'}</div>
                                        <div style={{ flex: 1 }}>
                                            {msg.thinking && (
                                                <div style={{ background: 'rgba(102,126,234,0.08)', border: '1px solid rgba(102,126,234,0.2)', borderRadius: '8px', padding: '8px 12px', marginBottom: '8px', fontSize: '0.82em', color: '#667eea', fontStyle: 'italic', maxHeight: '120px', overflowY: 'auto' }}>
                                                    <span style={{ fontWeight: 700, display: 'block', marginBottom: '4px' }}>🧠 Réflexion interne :</span>
                                                    <span style={{ whiteSpace: 'pre-wrap', opacity: 0.85 }}>{msg.thinking}</span>
                                                </div>
                                            )}
                                            <div className="chat-bubble" style={{ whiteSpace: 'pre-wrap' }}>
                                                {msg.content || (msg.streaming ? '' : '')}
                                                {msg.streaming && <span style={{ display: 'inline-block', width: '8px', height: '14px', background: 'var(--primary)', marginLeft: '2px', borderRadius: '2px', animation: 'pulse 0.8s infinite' }} />}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                                <div ref={messagesEndRef} />
                            </div>

                            {chatLoading && (
                                <div style={{ textAlign: 'center', padding: '10px', color: 'var(--primary)' }}>
                                    ⏳ L'IA réfléchit...
                                </div>
                            )}

                            <div className="chat-input-container" style={{ display: 'flex', gap: '8px' }}>
                                <input
                                    type="text"
                                    className="chat-input"
                                    placeholder={needsLLMKey(settings) ? "Configure d'abord ta clé API dans les Réglages" : "Décris ton projet, pose des questions... (Entrée pour envoyer)"}
                                    value={chatInput}
                                    onChange={(e) => setChatInput(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && !chatLoading && handleChatSend()}
                                    disabled={chatLoading}
                                    style={{ flex: 1 }}
                                />
                                <button
                                    onClick={() => folderChatInputRef.current?.click()}
                                    title="Importer un dossier comme contexte IA"
                                    disabled={folderChatLoading}
                                    style={{
                                        background: folderChatLoading ? '#fff3cd' : 'var(--light)',
                                        color: folderChatLoading ? '#856404' : '#555',
                                        border: '1px solid var(--border)', borderRadius: '10px',
                                        padding: '10px 14px', cursor: 'pointer', fontSize: '1.2em'
                                    }}
                                >
                                    {folderChatLoading ? '⏳' : '📁'}
                                </button>
                                <input ref={folderChatInputRef} type="file" webkitdirectory="true" multiple style={{ display: 'none' }}
                                    onChange={e => handleFolderForChat(e.target.files)} />
                                <button
                                    onClick={startVoiceInput}
                                    title={isRecording ? 'Arrêter l\'enregistrement' : 'Parler (reconnaissance vocale)'}
                                    style={{
                                        background: isRecording ? '#dc3545' : 'var(--light)',
                                        color: isRecording ? 'white' : '#555',
                                        border: '1px solid var(--border)', borderRadius: '10px',
                                        padding: '10px 14px', cursor: 'pointer', fontSize: '1.2em',
                                        animation: isRecording ? 'pulse 1s infinite' : 'none'
                                    }}
                                >
                                    {isRecording ? '⏹️' : '🎤'}
                                </button>
                                <button className="btn btn-primary" onClick={handleChatSend} disabled={chatLoading}>
                                    {chatLoading ? '⏳' : '➤ Envoyer'}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ============================================
        // ONGLET RECOMMANDATIONS
        // ============================================

        const RecommendationsTab = ({ answers, project, settings, setShowSettings, onCostUpdate }) => {
            const [reco, setReco] = useState(null);
            const [loading, setLoading] = useState(false);

            const answeredCount = Object.keys(answers).filter(k => answers[k] && (typeof answers[k] === 'string' ? answers[k].trim() : true)).length;
            const totalQuestions = Object.values(QUESTIONS_DATA).reduce((sum, phase) => sum + phase.questions.length, 0);

            const generateRecommendations = async () => {
                if (needsLLMKey(settings)) return;
                setLoading(true);
                try {
                    const answersText = Object.entries(answers).map(([key, val]) => {
                        const allQ = Object.values(QUESTIONS_DATA).flatMap(p => p.questions);
                        const q = allQ.find(q => q.id === key);
                        return q ? `${q.text} → ${Array.isArray(val) ? val.join(', ') : val}` : '';
                    }).filter(Boolean).join('\n');

                    const prompt = `Basé sur ces réponses de questionnaire stratégique pour un projet d'application, génère des recommandations détaillées en JSON pur (sans markdown).

Projet : ${project.name}
Réponses :
${answersText}

Retourne UNIQUEMENT ce JSON :
{
  "stackFrontend": "Technologie recommandée + justification courte",
  "stackBackend": "Technologie recommandée + justification courte",
  "stackDatabase": "Technologie recommandée + justification courte",
  "stackHosting": "Plateforme recommandée + justification courte",
  "roadmap": [
    {"phase": "Phase 1 - MVP", "duration": "X semaines", "tasks": ["Tâche 1", "Tâche 2"]},
    {"phase": "Phase 2 - Croissance", "duration": "X semaines", "tasks": ["Tâche 1", "Tâche 2"]},
    {"phase": "Phase 3 - Scale", "duration": "X semaines", "tasks": ["Tâche 1", "Tâche 2"]}
  ],
  "strategy": "Conseil stratégique en 3-4 phrases",
  "risks": ["Risque 1", "Risque 2", "Risque 3"],
  "quickWins": ["Action rapide 1", "Action rapide 2", "Action rapide 3"]
}`;

                    const result = await callLLM(settings, [{ role: 'user', content: prompt }]);
                    const costUSD = estimateCostUSD('llm', settings.llm.model, prompt.length, result.length);
                    if (onCostUpdate) onCostUpdate({ llmCalls: 1, llmUSD: costUSD, ocrCalls: 0, ocrUSD: 0, embCalls: 0, embTokens: 0, embUSD: 0 });
                    const jsonMatch = result.match(/\{[\s\S]*\}/);
                    if (!jsonMatch) throw new Error('Réponse invalide');
                    setReco(JSON.parse(jsonMatch[0]));
                } catch (err) {
                    alert('Erreur : ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="fade-in">
                    <h2 style={{ marginBottom: '20px' }}>🎯 Recommandations</h2>

                    {(needsLLMKey(settings)) && (
                        <div className="alert alert-warning mb-20">
                            ⚠️ Configure ta clé API pour générer des recommandations.
                            <button onClick={() => setShowSettings(true)} style={{ background: 'var(--primary)', color: 'white', border: 'none', borderRadius: '5px', padding: '5px 15px', cursor: 'pointer', marginLeft: '10px' }}>⚙️ Réglages</button>
                        </div>
                    )}

                    <div className="alert alert-info mb-20">
                        📊 Questionnaire rempli : <strong>{answeredCount}/{totalQuestions} questions</strong> ({Math.round(answeredCount/totalQuestions*100)}%)
                        {answeredCount < 5 && <span> — Réponds à plus de questions pour de meilleures recommandations.</span>}
                    </div>

                    {!reco && (

        // ============================================
        // ONGLET EXPORT
