services:
  synopsis:
    build: .
    image: workplace/synopsis:1.2.3
    container_name: workplace-synopsis
    ports:
      - "6090:6090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # joindre les services hôtes sous Linux
    volumes:
      - synopsis_clips:/clips
    env_file:
      - path: ../../.env
        required: false
    environment:
      - PORT=6090
      - CLIP_OUTPUT_DIR=/clips
      - LLM_MODEL=${LLM_MODEL:-deepseek/deepseek-v4-flash}
      # GATEWAY_URL non listée ici : vient du .env racine via env_file. La redéclarer en
      # `=${VAR:-défaut}` l'écraserait toujours par le défaut littéral (piège « env shadow » —
      # l'interpolation ne lit pas env_file). Défaut http://host.docker.internal:4001 porté par
      # le code (main.py, lib/llm_client.py) si la variable est absente.
      # Brique transcription (Whisper) : voie d'entrée des vidéos NON-YouTube (URL/fichier).
      - TRANSCRIPTION_URL=${TRANSCRIPTION_URL:-http://host.docker.internal:5980}
      # CORS_ORIGINS : ABSENTE d'`environment` EXPRÈS — elle vient du .env racine via
      # env_file. `${CORS_ORIGINS:-*}` s'interpole depuis le dossier du compose, PAS
      # depuis l'env_file : la ligne écrasait une liste d'origines restreinte par `*`.
      # Piège env-shadow à défaut RÉEL — sans symptôme, contrairement au défaut vide.
      # Le code a déjà `getenv("CORS_ORIGINS", "*")`. Cf. S211 / a1ccb7d.
      - API_KEYS=${API_KEYS:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6090/sante')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  synopsis_clips:
