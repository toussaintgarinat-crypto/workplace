dbs:
  - path: /data/calendar.db
    replicas:
      - type: s3
        endpoint: ${AWS_ENDPOINT}
        bucket: ${SAUVEGARDE_S3_BUCKET}
        path: agenda
        region: ${AWS_REGION}
        access-key-id: ${AWS_ACCESS_KEY_ID}
        secret-access-key: ${AWS_SECRET_ACCESS_KEY}
        force-path-style: true
        sync-interval: 1s
