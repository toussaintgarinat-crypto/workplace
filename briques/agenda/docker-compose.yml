services:

  # ── Agenda (FastAPI, repris de workspace/calendar) ────────────────
  agenda:
    # Build-context = racine du monorepo pour embarquer shared/ (lib partagée S120).
    build:
      context: ../..
      dockerfile: briques/agenda/backend/Dockerfile
    # Nom fixe : permet à Traefik de router par nom de conteneur sur proxy_net
    # (cf. oria-stack/infra/traefik/dynamic/agenda.yml → http://agenda:8400).
    container_name: agenda
    env_file:
      # Secrets/réglages partagés à la racine — source UNIQUE de la clé de service
      # (S168) : AGENDA_KEY (pilotage /service par le Cœur en X-API-Key) et
      # AGENDA_URL_PUBLIQUE (racine des liens d'invitation) viennent d'ICI, pas
      # redéclarés dans `environment` (les redéclarer en `VAR=${VAR:-}` les écraserait
      # par du vide — piège « env shadow »). ⚠ AGENDA_KEY vide ⇒ la surface /service
      # traite l'appel du Cœur comme « anonymous » → agenda vu VIDE par l'assistant.
      - path: ../../.env
        required: false
    ports:
      - "8400:8400"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # joindre les services hôtes sous Linux
    environment:
      # SQLite par défaut (DATABASE_URL vide), pas de Redis.
      - DATABASE_URL=
      - REDIS_URL=
      - CORS_ORIGINS=http://localhost:5100,http://localhost:3000
      - ATTACHMENTS_DIR=/data/calendar/attachments
      # ── Auth ──────────────────────────────────────────────────────────────
      # Défaut false = mono-utilisateur « perso », identité via en-tête X-User-Id
      # (OK sur réseau interne). Pour un VRAI partage multi-personnes, passer
      # AUTH_ENABLED=true : les invités se connectent via Keycloak (page
      # d'acceptation), et l'assistant appelle en S2S avec CALENDAR_SERVICE_TOKEN.
      - AUTH_ENABLED=${AGENDA_AUTH_ENABLED:-false}
      - CALENDAR_SERVICE_TOKEN=${CALENDAR_SERVICE_TOKEN:-}
      # Keycloak : KEYCLOAK_URL = vu par la brique (validation JWT, réseau interne) ;
      # KEYCLOAK_PUBLIC_URL = vu par le navigateur de l'invité (ex https://auth.${DOMAIN}).
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://host.docker.internal:8080}
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL:-}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-forge}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-calendar-app}
      # Audience attendue dans le jeton (verify_aud). Défaut = le client de l'agenda :
      # un jeton émis pour une autre app du même realm est rejeté. N'a d'effet que si
      # AUTH_ENABLED=true. Requiert le mapper d'audience sur le client calendar-app
      # (présent dans forge-realm.json ; pour un Keycloak déjà importé, l'ajouter à la
      # main ou ré-importer le realm — sinon mettre KEYCLOAK_AUDIENCE="" pour désactiver).
      - KEYCLOAK_AUDIENCE=${KEYCLOAK_AUDIENCE:-calendar-app}
      # ── Pont Google Agenda (S27) ──────────────────────────────────────────
      # Coffre de tokens OAuth chiffrés (AES-GCM). Obligatoire dès qu'on connecte
      # un compte Google. En prod : au coffre chiffré, jamais en clair ici.
      - VAULT_SECRET=${AGENDA_VAULT_SECRET:-}
      # Identifiants OAuth d'un projet Google Cloud (scope calendar.readonly).
      # Vides ⇒ pont désactivé (les endpoints /google/* renvoient 503).
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Doit matcher l'URI enregistrée côté Google Cloud, à l'octet près.
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8400/google/callback}
    volumes:
      - agenda_data:/data
    networks:
      - default
      - proxy_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8400/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  litestream:
    image: litestream/litestream:0.5.15
    container_name: workplace_agenda_litestream
    depends_on:
      agenda:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    volumes:
      - agenda_data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    networks:
      - default
      - proxy_net
    command: ["replicate"]
    restart: unless-stopped

volumes:
  agenda_data:

networks:
  default:
    # Subnet fixé explicitement : les pools d'adresses par défaut de Docker
    # (172.17–172.31/16 puis 192.168.0.0/16 découpé en /20) sont épuisés par
    # les ~35 autres briques déjà démarrées sur cette machine — sans ceci,
    # `docker compose up` échoue avec "all predefined address pools have
    # been fully subnetted". 192.168.64.0/24 est dans le seul bloc /20 encore
    # libre (192.168.64.0/20) au 2026-08-04 (vérifié via `docker network
    # inspect` sur tous les réseaux existants).
    ipam:
      config:
        - subnet: 192.168.64.0/24
  proxy_net:
    external: true
    name: proxy_net
