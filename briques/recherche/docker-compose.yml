services:
  recherche:
    build:
      context: .
      args:
        PLAYWRIGHT: ${RECHERCHE_PLAYWRIGHT:-0}
    container_name: workplace_recherche
    image: workplace/recherche:1.0.0          # tag épinglé (pas de :latest flottant)
    env_file:
      # Réglages partagés à la racine (source unique). Facultatif.
      - path: ../../.env
        required: false
    ports:
      - "6040:6040"
    environment:
      # ── Moteurs de recherche (HuntR : fusion multi-providers, cf. providers.py) ──
      # SearXNG souverain (conteneur voisin) : URL INTERNE au réseau Docker du stack.
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      # Ordre/sélection surchargeable (CSV, ex. "duckduckgo,searxng" ou "tavily,brave").
      - RECHERCHE_PROVIDERS=${RECHERCHE_PROVIDERS:-}
      # Repli DuckDuckGo sans-infra (réseau sortant vers DDG). 0 = éteint.
      - RECHERCHE_DDG=${RECHERCHE_DDG:-1}
      - RECHERCHE_N_DEFAUT=${RECHERCHE_N_DEFAUT:-8}
      # Moteurs à clé (extension multi-tenant) — VIDE = inerte.
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - EXA_API_KEY=${EXA_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY:-}
      - KAGI_API_KEY=${KAGI_API_KEY:-}
      - BING_API_KEY=${BING_API_KEY:-}
      # ── Filtres de source (opt-in, inertes par défaut, cf. source_filters.py) ────
      - RECHERCHE_STARTER_BLOCKLIST=${RECHERCHE_STARTER_BLOCKLIST:-0}  # 1 = blocklist propagande/désinfo
      - RECHERCHE_BLOCKLIST=${RECHERCHE_BLOCKLIST:-}                   # CSV de domaines à exclure
      - RECHERCHE_ALLOWLIST=${RECHERCHE_ALLOWLIST:-}                   # CSV de domaines à privilégier
      - RECHERCHE_ALLOWLIST_MODE=${RECHERCHE_ALLOWLIST_MODE:-boost}    # off | boost | strict
      # ── Lecture de page (cf. extraction.py) ─────────────────────────────────────
      - RECHERCHE_MAX_OCTETS=${RECHERCHE_MAX_OCTETS:-3145728}     # 3 Mo
      - RECHERCHE_TIMEOUT=${RECHERCHE_TIMEOUT:-25}
      - RECHERCHE_ROBOTS=${RECHERCHE_ROBOTS:-1}                   # respecte robots.txt
      # ── Playwright (lecture pages JS/SPA) ──────────────────────────────────────
      # 0 = désactivé (défaut, image légère). 1 = activé (rebuild requis avec PLAYWRIGHT=1).
      - RECHERCHE_PLAYWRIGHT=${RECHERCHE_PLAYWRIGHT:-0}
      # ── Synthèse LLM (/synthétiser → gateway Workplace) ────────────────────────
      # GATEWAY_URL non listée ici : vient du .env racine via env_file. La redéclarer en
      # `=${VAR:-défaut}` l'écraserait toujours par le défaut littéral (piège « env shadow »).
      # Défaut http://gateway:4001 porté par le code (synthese.py).
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
      - SYNTHESE_MODEL=${SYNTHESE_MODEL:-deepseek/deepseek-v4-flash}
      # Origines navigateur autorisées (CSV). VIDE/"*" = ouvert (dev/démo).
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # Clés API acceptées : viennent du .env racine via env_file (ne PAS redéclarer
      # ici en =${API_KEYS:-} → l'écraserait par du vide, piège « env shadow »).
    depends_on:
      - searxng
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6040/sante')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Métamoteur SearXNG : agrège Google/Bing/DDG/Wikipédia… et rend du JSON. NON exposé
  # au public — seul `recherche` l'appelle, sur le réseau interne de ce compose.
  searxng:
    # Tag tierce ÉPINGLÉ (codé en dur exprès — le lanceur fait `cd dossier && docker
    # compose up -d` sans sourcer le .env racine, donc un ${SEARXNG_TAG:-…} retomberait
    # toujours sur le défaut : piège « env shadow »).
    image: searxng/searxng:2026.6.22-952896d29
    container_name: workplace_searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-dev-searxng-secret-NON-SECRET}
    volumes:
      - ./searxng:/etc/searxng:rw     # settings.yml (format JSON activé, limiteur off)
    restart: unless-stopped
    # Pas de `ports:` → SearXNG reste INTERNE (joignable seulement via le service recherche).
