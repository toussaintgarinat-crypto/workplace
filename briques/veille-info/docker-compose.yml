services:
  veille-info:
    build: .
    container_name: workplace_veille_info
    image: workplace/veille-info:0.1.0   # tag épinglé (pas de :latest flottant)
    env_file:
      - path: ../../.env
        required: false
    ports:
      - "6120:6120"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # joindre Gateway/voix sous Linux (motif synopsis/studio)
    environment:
      - PORT=6120
      - VEILLE_INFO_DB=/data/veille_info.db
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # API_KEYS, VEILLE_INFO_KEY : ABSENTS du `environment` exprès — viennent du .env racine
      # via env_file (piège « env shadow » : ne PAS les redéclarer en `=${VAR:-}`, cf.
      # fix-env-shadow-composes).
      # GATEWAY_URL : le .env racine ne le définit pas (aucune brique ne le fait) → codé en dur
      # ici, motif synopsis/studio. GATEWAY_KEY vient du .env racine (clé maîtresse partagée).
      - GATEWAY_URL=http://host.docker.internal:4001
      # go/deepseek-v4-pro : déjà défini + financé côté Gateway (litellm_config.yaml,
      # clé OPENCODE_ZEN_API_KEY) — pas de nouvelle clé nécessaire. Sans ça, résumé par défaut
      # sur deepseek/deepseek-v4-flash (cf. lib/llm_client.py).
      - LLM_MODEL=go/deepseek-v4-pro
    volumes:
      - veille_info_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6120/sante')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  veille_info_data:
