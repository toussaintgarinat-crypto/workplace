services:
  veille-info:
    build: .
    container_name: workplace_veille_info
    image: workplace/veille-info:0.1.0   # tag épinglé (pas de :latest flottant)
    env_file:
      - path: ../../.env
        required: false
    ports:
      - "6120:6120"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # joindre Gateway/voix sous Linux (motif synopsis/studio)
    environment:
      - PORT=6120
      - VEILLE_INFO_DB=/data/veille_info.db
      # CORS_ORIGINS : ABSENTE d'`environment` EXPRÈS — elle vient du .env racine via
      # env_file. `${CORS_ORIGINS:-*}` s'interpole depuis le dossier du compose, PAS
      # depuis l'env_file : la ligne écrasait une liste d'origines restreinte par `*`.
      # Piège env-shadow à défaut RÉEL — sans symptôme, contrairement au défaut vide.
      # Le code a déjà `getenv("CORS_ORIGINS", "*")`. Cf. S211 / a1ccb7d.
      # API_KEYS, VEILLE_INFO_KEY, VEILLE_INFO_PUBLIC_URL : ABSENTS du `environment` exprès —
      # viennent du .env racine via env_file (piège « env shadow » : `VAR=${VAR:-}` s'interpole
      # depuis le shell/.env du dossier projet, PAS depuis env_file, et écraserait par du vide,
      # cf. fix-env-shadow-composes). VEILLE_INFO_PUBLIC_URL vide par défaut dans .env.example
      # (motif GEO_PUBLIC_URL, cf. briques/atelier-veille/docker-compose.yml) : le lien
      # audio-global du mail envoyé dérive alors l'URL de l'hôte de la requête courante
      # (LAN/localhost, cf. main.py::lien_audio_global). Ne renseigner une valeur dans le .env
      # racine QUE pour un déploiement particulier (route atteinte via un hostname Docker
      # interne — atelier-veille/Gateway — qu'un vrai destinataire de mail ne peut pas résoudre).
      # GATEWAY_URL : le .env racine ne le définit pas (aucune brique ne le fait) → codé en dur
      # ici, motif synopsis/studio. GATEWAY_KEY vient du .env racine (clé maîtresse partagée).
      - GATEWAY_URL=http://host.docker.internal:4001
      # go/deepseek-v4-pro : déjà défini + financé côté Gateway (litellm_config.yaml,
      # clé OPENCODE_ZEN_API_KEY) — pas de nouvelle clé nécessaire. Sans ça, résumé par défaut
      # sur deepseek/deepseek-v4-flash (cf. lib/llm_client.py).
      - LLM_MODEL=go/deepseek-v4-pro
    volumes:
      - veille_info_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6120/sante')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  veille_info_data:
