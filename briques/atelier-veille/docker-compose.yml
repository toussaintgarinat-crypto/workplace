services:
  atelier-veille:
    build: .
    container_name: workplace_atelier_veille
    image: workplace/atelier-veille:0.1.0   # tag épinglé (pas de :latest flottant)
    env_file:
      - path: ../../.env
        required: false
    ports:
      - "6130:6130"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # joindre geo/veille-info sous Linux
    environment:
      - PORT=6130
      # CORS_ORIGINS : ABSENTE d'`environment` EXPRÈS — elle vient du .env racine via
      # env_file. `${CORS_ORIGINS:-*}` s'interpole depuis le dossier du compose, PAS
      # depuis l'env_file : la ligne écrasait une liste d'origines restreinte par `*`.
      # Piège env-shadow à défaut RÉEL — sans symptôme, contrairement au défaut vide.
      # Le code a déjà `getenv("CORS_ORIGINS", "*")`. Cf. S211 / a1ccb7d.
      - VEILLE_INFO_URL=http://host.docker.internal:6120
      - VEILLE_PROSPECTION_URL=http://host.docker.internal:6140
      - GEO_URL=http://host.docker.internal:6110
      - FORGE_URL=http://host.docker.internal:5700
      # GEO_PUBLIC_URL, VEILLE_INFO_KEY : ABSENTS du `environment` exprès — viennent du .env
      # racine via env_file (piège « env shadow » : `VAR=${VAR:-}` s'interpole depuis le
      # shell/.env du dossier projet, PAS depuis env_file, et écraserait par du vide, cf.
      # fix-env-shadow-composes). GEO_PUBLIC_URL vide par défaut dans .env.example — /config
      # dérive alors l'URL de la carte de l'hôte de la requête courante (LAN/mesh/localhost,
      # cf. main.py::config). Un défaut figé ici (ex. http://localhost:6110/) recasserait la
      # carte hors localhost (piège S128, cf. core/urls_ui.py). VEILLE_INFO_KEY vide
      # aujourd'hui (mono-tenant, gate horloge no-op).
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6130/sante')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
