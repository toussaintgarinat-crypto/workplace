<!DOCTYPE html>
<!-- BACK-OFFICE restaurateur — connexion multi-tenant + gestion d'un ou plusieurs
     restaurants : carte (prix/photo/dispo/plat du jour), tables & QR, écran cuisine,
     tablette d'addition (reste à payer live + validation espèces). FR / EN. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurant — back-office</title>
<style>
  :root { --bg:#0f1420; --carte:#1a2030; --bord:#2a3346; --texte:#e8edf6; --doux:#94a3b8;
          --accent:#7c83ff; --or:#ff8a5b; --ok:#34d399; --att:#fbbf24; --rouge:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--texte); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  a { color:var(--accent); }
  input, select, textarea { font:inherit; }
  .champ { width:100%; padding:12px; border-radius:10px; border:1px solid var(--bord); background:var(--bg); color:var(--texte); margin-bottom:10px; }
  .btn { padding:11px 16px; border:none; border-radius:10px; font-weight:700; cursor:pointer; background:var(--accent); color:#fff; }
  .btn.or { background:var(--or); color:#0f1420; }
  .btn.fant { background:transparent; border:1px solid var(--bord); color:var(--doux); }
  .btn.danger { background:transparent; border:1px solid var(--rouge); color:var(--rouge); }
  .btn:disabled { opacity:.4; }
  .lang { display:flex; gap:4px; }
  .lang button { background:var(--carte); border:1px solid var(--bord); color:var(--doux); border-radius:8px; padding:5px 10px; cursor:pointer; }
  .lang button.on { color:var(--or); border-color:var(--or); }

  /* Connexion */
  #connexion { max-width:380px; margin:8vh auto; padding:0 20px; }
  #connexion h1 { font-size:1.6rem; }
  #connexion .carte { background:var(--carte); border:1px solid var(--bord); border-radius:16px; padding:24px; }
  .bascule { text-align:center; margin-top:14px; color:var(--doux); font-size:.9rem; }
  .err { color:var(--rouge); font-size:.86rem; min-height:18px; margin-bottom:8px; }

  /* App */
  header { display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--bord); flex-wrap:wrap; }
  header .marque { font-weight:800; font-size:1.1rem; }
  header select { background:var(--carte); border:1px solid var(--bord); color:var(--texte); border-radius:9px; padding:8px 10px; }
  header .sp { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .onglets { display:flex; gap:4px; padding:10px 20px 0; flex-wrap:wrap; }
  .onglets button { background:transparent; border:none; color:var(--doux); padding:8px 14px; border-radius:9px; font-weight:600; cursor:pointer; }
  .onglets button.on { background:var(--carte); color:var(--accent); }
  main { padding:20px; max-width:1000px; }
  h2 { font-size:1.1rem; }
  .grille { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }

  .plat { background:var(--carte); border:1px solid var(--bord); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .plat.indispo { opacity:.55; }
  .plat .haut { display:flex; gap:12px; }
  .plat img { width:60px; height:60px; border-radius:10px; object-fit:cover; background:#0d1119; flex:none; }
  .plat .nom { font-weight:700; }
  .plat .prix { color:var(--or); font-weight:800; cursor:pointer; }
  .plat .prix:hover { text-decoration:underline; }
  .plat .desc { color:var(--doux); font-size:.84rem; }
  .bascules { display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .bascule-pet { font-size:.78rem; padding:6px 10px; border-radius:8px; border:1px solid var(--bord); background:transparent; color:var(--doux); cursor:pointer; }
  .bascule-pet.on { color:var(--ok); border-color:var(--ok); }
  .bascule-pet.jour.on { color:var(--or); border-color:var(--or); }
  .pied { display:flex; gap:8px; margin-top:auto; }
  .pied label { flex:1; }

  .table-c { background:var(--carte); border:1px solid var(--bord); border-radius:14px; padding:16px; }
  .table-c .num { font-size:1.3rem; font-weight:800; }
  .qr { background:#fff; border-radius:10px; padding:8px; margin:10px 0; display:inline-block; }
  .qr svg { display:block; width:160px; height:160px; }
  .url { font-size:.74rem; color:var(--doux); word-break:break-all; }

  .conv { background:var(--carte); border:1px solid var(--bord); border-radius:12px; padding:14px; margin-bottom:10px; }
  .conv.regle { border-color:var(--ok); }
  .conv .tete { display:flex; justify-content:space-between; align-items:center; }
  .conv .nom { font-weight:700; }
  .conv .det { color:var(--doux); font-size:.84rem; margin-top:4px; }
  .pill { font-size:.74rem; font-weight:700; padding:3px 9px; border-radius:7px; }
  .pill.ok { color:var(--ok); background:rgba(52,211,153,.12); }
  .pill.att { color:var(--att); background:rgba(251,191,36,.12); }
  .recap { display:flex; justify-content:space-between; font-size:1.25rem; font-weight:800; margin:14px 2px; }
  .vide { color:var(--doux); padding:30px 0; }
  .ligne-form { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:18px; }
  .ligne-form > div { flex:1; min-width:120px; }
  .ligne-form label { font-size:.8rem; color:var(--doux); display:block; margin-bottom:4px; }
  .ligne-form .champ { margin-bottom:0; }
</style>
</head>
<body>

<!-- ÉCRAN CONNEXION -->
<div id="connexion" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <h1 id="c-titre">Restaurant</h1>
    <div class="lang"><button data-l="fr">FR</button><button data-l="en">EN</button></div>
  </div>
  <div class="carte">
    <div class="err" id="c-err"></div>
    <input class="champ" id="c-email" type="email" placeholder="email" autocomplete="username">
    <input class="champ" id="c-mdp" type="password" placeholder="••••••••" autocomplete="current-password">
    <input class="champ" id="c-resto" placeholder="" style="display:none">
    <button class="btn or" id="c-action" style="width:100%"></button>
    <div class="bascule" id="c-bascule"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <header>
    <span class="marque" id="marque">🍽︎</span>
    <select id="sel-resto" onchange="changerResto(this.value)"></select>
    <button class="btn fant" id="b-new-resto" onclick="nouveauResto()"></button>
    <div class="sp">
      <div class="lang"><button data-l="fr">FR</button><button data-l="en">EN</button></div>
      <button class="btn fant" id="b-deco" onclick="deconnexion()"></button>
    </div>
  </header>
  <div class="onglets">
    <button data-o="carte" class="on"></button>
    <button data-o="assistant"></button>
    <button data-o="tables"></button>
    <button data-o="additions"></button>
    <button data-o="cuisine"></button>
    <button data-o="reglages"></button>
  </div>
  <main id="vue"></main>
</div>

<script>
const T = {
 fr: {
  titre:"Restaurant", connexion:"Se connecter", inscription:"Créer un compte",
  vers_inscription:"Pas de compte ? Créer un compte", vers_connexion:"Déjà un compte ? Se connecter",
  nom_resto:"Nom du restaurant", deco:"Déconnexion", new_resto:"+ Restaurant",
  o_carte:"Carte", o_assistant:"Assistant carte", o_tables:"Tables & QR", o_additions:"Additions", o_cuisine:"Cuisine",
  ajouter_plat:"Ajouter un plat", nom:"Nom", desc:"Description", prix:"Prix (€)", ajouter:"Ajouter",
  asst_titre:"Importer une ancienne carte", asst_aide:"Photographiez ou déposez l'ancienne carte (image ou PDF). Je la lis (OCR) et je vous propose les plats : vous corrigez, puis vous ajoutez à votre carte.",
  asst_choisir:"Choisir une photo / un PDF", asst_lire:"Lire la carte", asst_lecture:"Lecture en cours…",
  asst_proposes:"Plats proposés (corrigez avant d'ajouter)", asst_aucun:"Aucun plat n'a pu être extrait.",
  asst_ajouter_tout:"Ajouter ces plats à ma carte", asst_ajoutes:"plats ajoutés à votre carte ✓",
  asst_retirer:"Retirer", asst_backend:"Lu par",
  gen_titre:"Générer une carte", gen_aide:"Décrivez le restaurant (cuisine, ambiance, gamme de prix). Je génère une carte complète que vous pourrez corriger avant de l'ajouter.",
  gen_concept:"Concept du restaurant", gen_concept_ex:"Ex : restaurant-bar musical convivial, cuisine bistrot + tapas + burgers, cocktails, gamme moyenne",
  gen_par_section:"Plats par section", gen_bouton:"Générer la carte", gen_encours:"Génération en cours…",
  dispo:"Disponible", jour:"Plat du jour", photo:"Photo", suppr:"Supprimer", carte_vide:"Aucun plat. Ajoutez votre premier plat.",
  formats:"Formats", des:"dès", formats_aide:"Formats et prix (taille=prix, séparés par des virgules). Ex : 25cl=3.50, 50cl=7, 1L=13, Girafe 2,5L=28. Vider = prix unique.",
  ajouter_table:"Ajouter une table", num_table:"N° de table", tables_vide:"Aucune table.",
  ouvrir_cuisine:"Ouvrir l'écran cuisine ↗", choisir_table:"Choisissez une table",
  du:"Dû", paye:"Payé", reste:"Reste à payer", regle:"Réglé ✓", attente:"En attente",
  paye_especes:"Payé en espèces", total_reste:"Reste sur la table", aucune_cmd:"Aucune commande sur cette table.",
  prix_invalide:"Prix invalide", nouveau_prix:"Nouveau prix en euros :", err_co:"Email ou mot de passe incorrect.",
  err_existe:"Un compte existe déjà avec cet email.", err_court:"Mot de passe : 8 caractères minimum.",
  err_resto:"Donnez un nom de restaurant.", devise:"fr-FR",
  categorie:"Catégorie", o_reglages:"Réglages", section:"Section (ex : Entrées, Plats, Boissons)",
  cloturer:"Clôturer la table", imprimer:"Imprimer le ticket", dont_tva:"dont TVA", pourboire:"Pourboire",
  reste_du_cloture:"Il reste à payer. Clôturer quand même (départ sans payer) ?",
  cloture_ok:"Table clôturée et remise à zéro ✓", ticket:"Ticket",
  reglages_resto:"Réglages du restaurant", taux_tva:"Taux de TVA (%)", enregistrer:"Enregistrer",
  securite:"Sécurité", changer_mdp:"Changer le mot de passe", ancien_mdp:"Mot de passe actuel",
  nouveau_mdp:"Nouveau mot de passe", mdp_change:"Mot de passe changé ✓ (autres appareils déconnectés)",
  mdp_faux:"Mot de passe actuel incorrect.", deco_partout:"Déconnecter tous les appareils",
  deco_partout_ok:"Tous les appareils ont été déconnectés."
 },
 en: {
  titre:"Restaurant", connexion:"Sign in", inscription:"Create account",
  vers_inscription:"No account? Create one", vers_connexion:"Have an account? Sign in",
  nom_resto:"Restaurant name", deco:"Sign out", new_resto:"+ Restaurant",
  o_carte:"Menu", o_assistant:"Menu assistant", o_tables:"Tables & QR", o_additions:"Bills", o_cuisine:"Kitchen",
  ajouter_plat:"Add a dish", nom:"Name", desc:"Description", prix:"Price (€)", ajouter:"Add",
  asst_titre:"Import an old menu", asst_aide:"Take a photo or drop the old menu (image or PDF). I read it (OCR) and propose the dishes: fix them, then add to your menu.",
  asst_choisir:"Choose a photo / PDF", asst_lire:"Read the menu", asst_lecture:"Reading…",
  asst_proposes:"Proposed dishes (review before adding)", asst_aucun:"No dish could be extracted.",
  asst_ajouter_tout:"Add these dishes to my menu", asst_ajoutes:"dishes added to your menu ✓",
  asst_retirer:"Remove", asst_backend:"Read by",
  gen_titre:"Generate a menu", gen_aide:"Describe the restaurant (cuisine, vibe, price range). I generate a full menu you can edit before adding it.",
  gen_concept:"Restaurant concept", gen_concept_ex:"E.g. friendly music bar-restaurant, bistro food + tapas + burgers, cocktails, mid-range",
  gen_par_section:"Dishes per section", gen_bouton:"Generate the menu", gen_encours:"Generating…",
  dispo:"Available", jour:"Today's special", photo:"Photo", suppr:"Delete", carte_vide:"No dishes yet. Add your first one.",
  formats:"Sizes", des:"from", formats_aide:"Sizes and prices (size=price, comma-separated). E.g. 25cl=3.50, 50cl=7, 1L=13, Giraffe 2.5L=28. Empty = single price.",
  ajouter_table:"Add a table", num_table:"Table no.", tables_vide:"No tables yet.",
  ouvrir_cuisine:"Open kitchen screen ↗", choisir_table:"Pick a table",
  du:"Due", paye:"Paid", reste:"Left to pay", regle:"Settled ✓", attente:"Pending",
  paye_especes:"Mark cash paid", total_reste:"Left on the table", aucune_cmd:"No orders on this table.",
  prix_invalide:"Invalid price", nouveau_prix:"New price in euros:", err_co:"Wrong email or password.",
  err_existe:"An account already exists with this email.", err_court:"Password: 8 characters minimum.",
  err_resto:"Enter a restaurant name.", devise:"en-GB",
  categorie:"Category", o_reglages:"Settings", section:"Section (e.g. Starters, Mains, Drinks)",
  cloturer:"Close table", imprimer:"Print receipt", dont_tva:"incl. VAT", pourboire:"Tip",
  reste_du_cloture:"There is still an amount due. Close anyway (left without paying)?",
  cloture_ok:"Table closed and reset ✓", ticket:"Receipt",
  reglages_resto:"Restaurant settings", taux_tva:"VAT rate (%)", enregistrer:"Save",
  securite:"Security", changer_mdp:"Change password", ancien_mdp:"Current password",
  nouveau_mdp:"New password", mdp_change:"Password changed ✓ (other devices signed out)",
  mdp_faux:"Current password incorrect.", deco_partout:"Sign out all devices",
  deco_partout_ok:"All devices have been signed out."
 }
};
let lang = localStorage.getItem('resto_lang') || 'fr';
let mode = 'connexion';            // connexion | inscription
let session = localStorage.getItem('resto_session') || '';
let restos = [], restoActif = localStorage.getItem('resto_actif') || '';
let onglet = 'carte', devise = 'EUR', tableAddition = '', wsAdmin = null, etatCourant = null;

const $ = s => document.querySelector(s);
const t = k => T[lang][k];
const H = () => ({'Content-Type':'application/json', Authorization:'Bearer '+session});
function euro(c){ return (c/100).toLocaleString(T[lang].devise, {style:'currency', currency:devise}); }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

document.querySelectorAll('.lang button').forEach(b=> b.onclick = ()=>{ lang=b.dataset.l; localStorage.setItem('resto_lang',lang); appliquer(); });
function appliquer(){
  document.documentElement.lang = lang;
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on', b.dataset.l===lang));
  // connexion
  $('#c-titre').textContent = t('titre');
  $('#c-action').textContent = mode==='connexion' ? t('connexion') : t('inscription');
  $('#c-bascule').textContent = mode==='connexion' ? t('vers_inscription') : t('vers_connexion');
  $('#c-resto').style.display = mode==='inscription' ? 'block' : 'none';
  $('#c-resto').placeholder = t('nom_resto');
  // app
  $('#b-deco').textContent = t('deco');
  $('#b-new-resto').textContent = t('new_resto');
  const o = {carte:'o_carte', assistant:'o_assistant', tables:'o_tables', additions:'o_additions', cuisine:'o_cuisine', reglages:'o_reglages'};
  document.querySelectorAll('.onglets button').forEach(b=>{ b.textContent=t(o[b.dataset.o]); b.classList.toggle('on', b.dataset.o===onglet); });
  if(session) rendre();
}

// ── Connexion ────────────────────────────────────────────────
$('#c-bascule').onclick = ()=>{ mode = mode==='connexion'?'inscription':'connexion'; $('#c-err').textContent=''; appliquer(); };
$('#c-action').onclick = async ()=>{
  $('#c-err').textContent='';
  const email=$('#c-email').value.trim(), mdp=$('#c-mdp').value;
  if(mode==='inscription'){
    if(mdp.length<8){ $('#c-err').textContent=t('err_court'); return; }
    const r = await fetch('/auth/inscription', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email, mot_de_passe:mdp, nom_restaurant:$('#c-resto').value.trim()})});
    if(r.status===409){ $('#c-err').textContent=t('err_existe'); return; }
    if(!r.ok){ $('#c-err').textContent=t('err_court'); return; }
    finConnexion(await r.json());
  } else {
    const r = await fetch('/auth/connexion', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email, mot_de_passe:mdp})});
    if(!r.ok){ $('#c-err').textContent=t('err_co'); return; }
    finConnexion(await r.json());
  }
};
function finConnexion(data){ session=data.session; localStorage.setItem('resto_session',session); demarrer(); }

function deconnexion(){ session=''; localStorage.removeItem('resto_session'); localStorage.removeItem('resto_actif');
  restoActif=''; if(wsAdmin) wsAdmin.close(); ecran(); }

// ── Démarrage / restaurants ──────────────────────────────────
async function demarrer(){
  const r = await fetch('/restaurants', {headers:H()});
  if(r.status===401){ deconnexion(); return; }
  restos = (await r.json()).restaurants;
  if(!restos.length){ await fetch('/restaurants', {method:'POST', headers:H(), body:JSON.stringify({nom:'Mon restaurant'})});
    restos = (await (await fetch('/restaurants',{headers:H()})).json()).restaurants; }
  if(!restos.find(x=>x.id===restoActif)) restoActif = restos[0].id;
  localStorage.setItem('resto_actif', restoActif);
  majSelecteur(); ecran(); brancherWS();
}
function majSelecteur(){
  $('#sel-resto').innerHTML = restos.map(r=>`<option value="${r.id}" ${r.id===restoActif?'selected':''}>${esc(r.nom)}</option>`).join('');
  const r = restos.find(x=>x.id===restoActif); devise = (r&&r.devise)||'EUR';
}
window.changerResto = id => { restoActif=id; localStorage.setItem('resto_actif',id); majSelecteur(); tableAddition=''; brancherWS(); rendre(); };
async function nouveauResto(){
  const nom = prompt(t('nom_resto')); if(!nom) return;
  await fetch('/restaurants', {method:'POST', headers:H(), body:JSON.stringify({nom})});
  demarrer();
}

function ecran(){
  $('#connexion').style.display = session ? 'none' : 'block';
  $('#app').style.display = session ? 'block' : 'none';
  appliquer();
}

document.querySelectorAll('.onglets button').forEach(b=> b.onclick = ()=>{ onglet=b.dataset.o; appliquer(); });

// ── Rendu des onglets ────────────────────────────────────────
function rendre(){
  if(onglet==='cuisine'){ window.open('/cuisine?resto='+restoActif, '_blank'); onglet='carte'; appliquer(); return; }
  if(onglet==='carte') vueCarte();
  else if(onglet==='assistant') vueAssistant();
  else if(onglet==='tables') vueTables();
  else if(onglet==='additions') vueAdditions();
  else if(onglet==='reglages') vueReglages();
}

// Carte
function plCarte(p){
  const img = p.photo?`<img src="${p.photo}">`:`<img>`;
  const aFormats = p.formats && p.formats.length;
  const prixHaut = aFormats
    ? `<div class="prix" onclick="editerFormats('${p.id}')">${t('des')} ${euro(p.prix_cents)} ›</div>`
    : `<div class="prix" onclick="editerPrix('${p.id}',${p.prix_cents})">${euro(p.prix_cents)}</div>`;
  const ligneFormats = aFormats
    ? `<div class="desc" style="color:var(--accent)">${p.formats.map(f=>esc(f.taille)+' '+euro(f.prix_cents)).join(' · ')}</div>` : '';
  return `<div class="plat ${p.disponible?'':'indispo'}">
    <div class="haut">${img}<div><div class="nom">${esc(p.nom)}</div>
    ${prixHaut}</div></div>
    ${p.description?`<div class="desc">${esc(p.description)}</div>`:''}
    ${ligneFormats}
    <div class="bascules">
      <button class="bascule-pet ${p.disponible?'on':''}" onclick="bascule('${p.id}','disponible',${!p.disponible})">${t('dispo')}</button>
      <button class="bascule-pet jour ${p.plat_du_jour?'on':''}" onclick="bascule('${p.id}','plat_du_jour',${!p.plat_du_jour})">${t('jour')}</button>
      <button class="bascule-pet" onclick="editerCategorie('${p.id}','${esc(p.categorie||'')}')">${t('categorie')}: ${esc(p.categorie||'—')}</button>
      <button class="bascule-pet ${aFormats?'on':''}" onclick="editerFormats('${p.id}')">${t('formats')}</button>
    </div>
    <div class="pied">
      <label class="btn fant" style="text-align:center">${t('photo')}<input type="file" accept="image/*" capture="environment" style="display:none" onchange="photo('${p.id}',this)"></label>
      <button class="btn danger" onclick="supprPlat('${p.id}')">${t('suppr')}</button>
    </div></div>`;
}
async function vueCarte(){
  const plats = (await (await fetch(`/restaurants/${restoActif}/plats`, {headers:H()})).json()).plats;
  const form = `<div class="ligne-form">
    <div><label>${t('nom')}</label><input class="champ" id="p-nom"></div>
    <div><label>${t('prix')}</label><input class="champ" id="p-prix" type="number" step="0.01" min="0"></div>
    <div><label>${t('categorie')}</label><input class="champ" id="p-cat" placeholder="${t('section')}"></div>
    <div style="flex:2"><label>${t('desc')}</label><input class="champ" id="p-desc"></div>
    <button class="btn or" onclick="ajouterPlat()">${t('ajouter')}</button></div>`;
  let cartes;
  if(!plats.length){ cartes = `<div class="vide">${t('carte_vide')}</div>`; }
  else {
    const groupes = {}; plats.forEach(p=>{ const k=(p.categorie||'').trim()||'§'; (groupes[k] ||= []).push(p); });
    cartes = Object.keys(groupes).map(k=>{
      const titre = k==='§' ? '' : `<h3 style="margin:18px 0 8px;color:#94a3b8">${esc(k)}</h3>`;
      return titre + `<div class="grille">`+groupes[k].map(plCarte).join('')+`</div>`;
    }).join('');
  }
  $('#vue').innerHTML = `<h2>${t('o_carte')}</h2>${form}${cartes}`;
}
window.ajouterPlat = async ()=>{
  const nom=$('#p-nom').value.trim(); if(!nom) return;
  const prix=Math.round(parseFloat($('#p-prix').value||'0')*100);
  await fetch(`/restaurants/${restoActif}/plats`, {method:'POST', headers:H(),
    body:JSON.stringify({nom, prix_cents:prix||0, description:$('#p-desc').value.trim(), categorie:$('#p-cat').value.trim()})});
  vueCarte();
};
window.editerCategorie = async (id, actuel)=>{
  const v = prompt(t('section'), actuel); if(v===null) return;
  await fetch(`/restaurants/${restoActif}/plats/${id}`, {method:'PATCH', headers:H(), body:JSON.stringify({categorie:v.trim()})});
  vueCarte();
};
window.editerPrix = async (id, actuel)=>{
  const v = prompt(t('nouveau_prix'), (actuel/100).toFixed(2)); if(v===null) return;
  const c = Math.round(parseFloat(v.replace(',','.'))*100);
  if(isNaN(c)||c<0){ alert(t('prix_invalide')); return; }
  await fetch(`/restaurants/${restoActif}/plats/${id}`, {method:'PATCH', headers:H(), body:JSON.stringify({prix_cents:c})});
  vueCarte();
};
window.editerFormats = async (id)=>{
  const plats = (await (await fetch(`/restaurants/${restoActif}/plats`, {headers:H()})).json()).plats;
  const p = plats.find(x=>x.id===id); if(!p) return;
  const actuel = (p.formats||[]).map(f=>`${f.taille}=${(f.prix_cents/100).toFixed(2)}`).join(', ');
  const v = prompt(t('formats_aide'), actuel);
  if(v===null) return;
  const formats = v.split(',').map(s=>s.trim()).filter(Boolean).map(part=>{
    const i = part.lastIndexOf('='); if(i<0) return null;
    const taille = part.slice(0,i).trim();
    const prix = Math.round(parseFloat(part.slice(i+1).replace(',','.'))*100);
    return (taille && !isNaN(prix) && prix>=0) ? {taille, prix_cents:prix} : null;
  }).filter(Boolean);
  await fetch(`/restaurants/${restoActif}/plats/${id}`, {method:'PATCH', headers:H(), body:JSON.stringify({formats})});
  vueCarte();
};
window.bascule = async (id, champ, val)=>{ await fetch(`/restaurants/${restoActif}/plats/${id}`, {method:'PATCH', headers:H(), body:JSON.stringify({[champ]:val})}); vueCarte(); };
window.supprPlat = async id=>{ await fetch(`/restaurants/${restoActif}/plats/${id}`, {method:'DELETE', headers:H()}); vueCarte(); };
window.photo = (id, input)=>{ const f=input.files[0]; if(!f) return; const fr=new FileReader();
  fr.onload = async ()=>{ await fetch(`/restaurants/${restoActif}/plats/${id}`, {method:'PATCH', headers:H(), body:JSON.stringify({photo:fr.result})}); vueCarte(); };
  fr.readAsDataURL(f); };

// Assistant carte (importer l'ancienne carte : OCR → proposition éditable → ajout)
let propositions = [];          // plats proposés par l'import, éditables avant ajout
let dernierImport = {};         // métadonnées du dernier import (backend OCR, note)
function vueAssistant(){
  propositions = []; dernierImport = {};
  $('#vue').innerHTML = `<h2>${t('o_assistant')}</h2>
    <div class="carte" style="padding:18px;border:1px solid var(--bord);border-radius:14px;max-width:760px">
      <div style="font-weight:700;margin-bottom:6px">${t('asst_titre')}</div>
      <div style="color:var(--doux);font-size:.92rem;margin-bottom:14px">${t('asst_aide')}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <label class="btn fant">${t('asst_choisir')}<input type="file" id="asst-f" accept="image/*,application/pdf" capture="environment" style="display:none"></label>
        <span id="asst-nom" style="color:var(--doux);font-size:.9rem"></span>
        <button class="btn or" id="asst-go" disabled onclick="lireAncienneCarte()">${t('asst_lire')}</button>
      </div>
      <div id="asst-etat" style="margin-top:12px;color:var(--doux)"></div>
    </div>
    <div class="carte" style="padding:18px;border:1px solid var(--bord);border-radius:14px;max-width:760px;margin-top:16px">
      <div style="font-weight:700;margin-bottom:6px">✨ ${t('gen_titre')}</div>
      <div style="color:var(--doux);font-size:.92rem;margin-bottom:14px">${t('gen_aide')}</div>
      <label style="font-size:.9rem;color:var(--doux)">${t('gen_concept')}</label>
      <textarea class="champ" id="gen-concept" rows="3" style="width:100%;margin:6px 0 12px" placeholder="${t('gen_concept_ex')}"></textarea>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <label style="font-size:.9rem;color:var(--doux)">${t('gen_par_section')}
          <input class="champ" id="gen-n" type="number" min="2" max="12" value="6" style="width:70px;margin-left:6px"></label>
        <button class="btn or" id="gen-go" onclick="genererCarte()">${t('gen_bouton')}</button>
      </div>
      <div id="gen-etat" style="margin-top:12px;color:var(--doux)"></div>
    </div>
    <div id="asst-res" style="margin-top:18px"></div>`;
  $('#asst-f').onchange = e=>{ const f=e.target.files[0];
    $('#asst-nom').textContent = f? f.name : '';
    $('#asst-go').disabled = !f; };
}
window.genererCarte = async ()=>{
  const concept = $('#gen-concept').value.trim(); if(!concept) return;
  const n = parseInt($('#gen-n').value||'6',10);
  $('#gen-go').disabled = true; $('#gen-etat').textContent = t('gen_encours'); $('#asst-res').innerHTML='';
  let data;
  try {
    const r = await fetch(`/restaurants/${restoActif}/carte/generer`, {method:'POST', headers:H(),
      body:JSON.stringify({concept, par_section:n})});
    data = await r.json();
  } catch(e){ data = {plats:[], note:String(e)}; }
  $('#gen-etat').textContent = ''; $('#gen-go').disabled = false;
  dernierImport = data || {};
  propositions = (data.plats||[]).map(p=>({nom:p.nom||'', description:p.description||'', prix_cents:p.prix_cents||0, categorie:p.categorie||''}));
  rendrePropositions();
};
window.lireAncienneCarte = async ()=>{
  const f = $('#asst-f').files[0]; if(!f) return;
  $('#asst-go').disabled = true; $('#asst-etat').textContent = t('asst_lecture'); $('#asst-res').innerHTML='';
  const b64 = await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(f); });
  let data;
  try {
    const r = await fetch(`/restaurants/${restoActif}/carte/importer`, {method:'POST', headers:H(),
      body:JSON.stringify({contenu_base64:b64, nom_fichier:f.name})});
    data = await r.json();
  } catch(e){ data = {plats:[], note:String(e)}; }
  $('#asst-etat').textContent = '';
  $('#asst-go').disabled = false;
  dernierImport = data || {};
  propositions = (data.plats||[]).map(p=>({nom:p.nom||'', description:p.description||'', prix_cents:p.prix_cents||0, categorie:p.categorie||''}));
  rendrePropositions();
};
window.retirerProposition = i=>{ propositions.splice(i,1); rendrePropositions(); };
function rendrePropositions(){
  const res = $('#asst-res'); if(!res) return;
  const data = dernierImport;
  if(!propositions.length){
    res.innerHTML = `<div class="vide">${t('asst_aucun')}${data && data.note?`<div style="margin-top:8px;font-size:.85rem">${esc(data.note)}</div>`:''}</div>`;
    return;
  }
  const backend = data && data.ocr && data.ocr.backend ? `<div style="color:var(--doux);font-size:.85rem;margin-bottom:8px">${t('asst_backend')} : ${esc(data.ocr.backend)}</div>` : '';
  const lignes = propositions.map((p,i)=>`<div class="ligne-form" style="align-items:flex-end">
    <div style="flex:2"><label>${t('nom')}</label><input class="champ" value="${esc(p.nom)}" oninput="propositions[${i}].nom=this.value"></div>
    <div><label>${t('prix')}</label><input class="champ" type="number" step="0.01" min="0" value="${(p.prix_cents/100).toFixed(2)}" oninput="propositions[${i}].prix_cents=Math.round(parseFloat(this.value||'0')*100)||0"></div>
    <div><label>${t('categorie')}</label><input class="champ" value="${esc(p.categorie)}" oninput="propositions[${i}].categorie=this.value"></div>
    <div style="flex:2"><label>${t('desc')}</label><input class="champ" value="${esc(p.description)}" oninput="propositions[${i}].description=this.value"></div>
    <button class="btn danger" onclick="retirerProposition(${i})">${t('asst_retirer')}</button>
  </div>`).join('');
  res.innerHTML = `<h3 style="margin:6px 0 10px;color:#94a3b8">${t('asst_proposes')}</h3>${backend}${lignes}
    <button class="btn or" style="margin-top:12px" onclick="ajouterPropositions()">${t('asst_ajouter_tout')}</button>`;
}
window.ajouterPropositions = async ()=>{
  const plats = propositions.filter(p=>(p.nom||'').trim());
  if(!plats.length) return;
  const r = await fetch(`/restaurants/${restoActif}/plats/lot`, {method:'POST', headers:H(), body:JSON.stringify({plats})});
  const d = await r.json();
  alert((d.ajoutes||0)+' '+t('asst_ajoutes'));
  onglet='carte'; appliquer();
};

// Tables & QR
async function vueTables(){
  const tables = (await (await fetch(`/restaurants/${restoActif}/tables`, {headers:H()})).json()).tables;
  const form = `<div class="ligne-form"><div><label>${t('num_table')}</label><input class="champ" id="t-num"></div>
    <button class="btn or" onclick="ajouterTable()">${t('ajouter')}</button></div>`;
  const liste = tables.length ? `<div class="grille">`+tables.map(tb=>
    `<div class="table-c"><div class="num">${t('num_table')} ${esc(tb.numero)}</div>
      <div class="qr" id="qr-${tb.id}">…</div>
      <div class="url">/carte/${tb.code}</div>
      <div style="margin-top:10px"><button class="btn danger" onclick="supprTable('${tb.id}')">${t('suppr')}</button></div></div>`
  ).join('')+`</div>` : `<div class="vide">${t('tables_vide')}</div>`;
  $('#vue').innerHTML = `<h2>${t('o_tables')}</h2>${form}${liste}`;
  // QR : l'endpoint exige l'auth → on fetch le SVG et on l'injecte (un <img> ne peut pas porter le Bearer).
  for(const tb of tables){
    const r = await fetch(`/restaurants/${restoActif}/tables/${tb.id}/qr.svg`, {headers:H()});
    if(r.ok){ const el=document.getElementById('qr-'+tb.id); if(el) el.innerHTML = await r.text(); }
  }
}
window.ajouterTable = async ()=>{ const num=$('#t-num').value.trim(); if(!num) return;
  await fetch(`/restaurants/${restoActif}/tables`, {method:'POST', headers:H(), body:JSON.stringify({numero:num})}); vueTables(); };
window.supprTable = async id=>{ await fetch(`/restaurants/${restoActif}/tables/${id}`, {method:'DELETE', headers:H()}); vueTables(); };

// Additions (tablette)
async function vueAdditions(){
  const tables = (await (await fetch(`/restaurants/${restoActif}/tables`, {headers:H()})).json()).tables;
  if(!tables.length){ $('#vue').innerHTML = `<h2>${t('o_additions')}</h2><div class="vide">${t('tables_vide')}</div>`; return; }
  if(!tables.find(x=>x.id===tableAddition)) tableAddition = tables[0].id;
  const opts = tables.map(tb=>`<option value="${tb.id}" ${tb.id===tableAddition?'selected':''}>${t('num_table')} ${esc(tb.numero)}</option>`).join('');
  $('#vue').innerHTML = `<h2>${t('o_additions')}</h2>
    <select class="champ" style="max-width:240px" onchange="tableAddition=this.value; chargerAddition()">${opts}</select>
    <div id="addition"></div>`;
  chargerAddition();
}
window.chargerAddition = async ()=>{
  const cible = $('#addition'); if(!cible) return;
  const e = await (await fetch(`/restaurants/${restoActif}/tables/${tableAddition}/addition`, {headers:H()})).json();
  if(!e.convives.length){ cible.innerHTML = `<div class="vide">${t('aucune_cmd')}</div>`; return; }
  etatCourant = e;
  const tvaLigne = (e.tva && e.tva.tva_cents) ? `<div class="tete" style="margin-top:6px;color:#94a3b8;font-size:.85rem"><span>${t('dont_tva')} (${e.tva.tva_taux}%)</span><span>${euro(e.tva.tva_cents)}</span></div>` : '';
  const pourbLigne = e.pourboire_cents ? `<div class="tete" style="margin-top:4px;color:#34d399;font-size:.9rem"><span>${t('pourboire')}</span><span>${euro(e.pourboire_cents)}</span></div>` : '';
  cible.innerHTML = e.convives.map(c=>{
    const det = c.details.map(d=>`${d.quantite}× ${esc(d.nom_plat)}`).join(', ');
    const pill = c.regle ? `<span class="pill ok">${t('regle')}${c.moyen?(' · '+c.moyen):''}</span>` : `<span class="pill att">${t('attente')}</span>`;
    const bouton = !c.regle ? `<button class="btn" style="margin-top:10px" onclick="especes('${esc(c.convive)}')">${t('paye_especes')} · ${euro(c.reste_cents)}</button>` : '';
    return `<div class="conv ${c.regle?'regle':''}"><div class="tete"><span class="nom">${esc(c.convive)}</span>${pill}</div>
      <div class="det">${det}</div>
      <div class="tete" style="margin-top:8px"><span>${t('du')}: <b>${euro(c.du_cents)}</b></span><span>${t('reste')}: <b>${euro(c.reste_cents)}</b></span></div>
      ${bouton}</div>`;
  }).join('')
    + tvaLigne + pourbLigne
    + `<div class="recap"><span>${t('total_reste')}</span><span>${euro(e.reste_cents)}</span></div>`
    + `<div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn fant" onclick="imprimerTicket()">🧾 ${t('imprimer')}</button>
        <button class="btn or" onclick="cloturer()">${t('cloturer')}</button></div>`;
};
window.especes = async (convive)=>{
  await fetch(`/restaurants/${restoActif}/tables/${tableAddition}/paiement-especes`, {method:'POST', headers:H(), body:JSON.stringify({convive})});
  chargerAddition();
};
window.cloturer = async ()=>{
  let force = false;
  if(etatCourant && etatCourant.reste_cents>0){ if(!confirm(t('reste_du_cloture'))) return; force = true; }
  const r = await fetch(`/restaurants/${restoActif}/tables/${tableAddition}/cloturer`, {method:'POST', headers:H(), body:JSON.stringify({force})});
  if(r.ok){ alert(t('cloture_ok')); chargerAddition(); }
};
window.imprimerTicket = ()=>{
  const e = etatCourant; if(!e) return;
  const r = restos.find(x=>x.id===restoActif) || {};
  const lignes = e.convives.map(c=> c.details.map(d=>`<tr><td>${d.quantite}× ${esc(d.nom_plat)}</td><td style="text-align:right">${euro(d.prix_cents*d.quantite)}</td></tr>`).join('')).join('');
  const tva = (e.tva && e.tva.tva_cents) ? `<tr><td>${t('dont_tva')} (${e.tva.tva_taux}%)</td><td style="text-align:right">${euro(e.tva.tva_cents)}</td></tr>` : '';
  const pb = e.pourboire_cents ? `<tr><td>${t('pourboire')}</td><td style="text-align:right">${euro(e.pourboire_cents)}</td></tr>` : '';
  const w = window.open('', '_blank', 'width=380,height=600');
  w.document.write(`<html><head><meta charset="utf-8"><title>${t('ticket')}</title>
    <style>body{font-family:monospace;padding:18px;color:#111}h2{text-align:center;margin:0}
    table{width:100%;border-collapse:collapse;margin-top:12px}td{padding:3px 0}
    .tot{border-top:1px dashed #000;font-weight:800;font-size:1.1rem}</style></head><body>
    <h2>${esc(r.nom||'Restaurant')}</h2>
    <div style="text-align:center;font-size:.8rem">${new Date().toLocaleString()}</div>
    <table>${lignes}${tva}${pb}<tr class="tot"><td>Total</td><td style="text-align:right">${euro(e.total_cents)}</td></tr></table>
    <p style="text-align:center;font-size:.8rem;margin-top:18px">Merci de votre visite</p>
    <script>window.print()<\/script></body></html>`);
  w.document.close();
};

// Réglages : TVA du restaurant + sécurité du compte (mot de passe, déconnexion partout).
function vueReglages(){
  const r = restos.find(x=>x.id===restoActif) || {};
  $('#vue').innerHTML = `<h2>${t('o_reglages')}</h2>
    <div class="conv" style="max-width:520px">
      <h3 style="margin-top:0">${t('reglages_resto')}</h3>
      <label class="liv-sub" style="font-size:.8rem;color:#94a3b8">${t('taux_tva')}</label>
      <div style="display:flex;gap:10px;align-items:center;margin-top:6px">
        <input class="champ" id="r-tva" type="number" step="0.1" min="0" value="${r.tva_taux ?? 10}" style="max-width:140px;margin:0">
        <button class="btn or" onclick="enregistrerResto()">${t('enregistrer')}</button>
      </div>
    </div>
    <div class="conv" style="max-width:520px;margin-top:14px">
      <h3 style="margin-top:0">${t('securite')}</h3>
      <div class="err" id="s-err"></div>
      <input class="champ" id="s-ancien" type="password" placeholder="${t('ancien_mdp')}" autocomplete="current-password">
      <input class="champ" id="s-nouveau" type="password" placeholder="${t('nouveau_mdp')}" autocomplete="new-password">
      <button class="btn" onclick="changerMdp()" style="width:100%">${t('changer_mdp')}</button>
      <button class="btn danger" onclick="decoPartout()" style="width:100%;margin-top:10px">${t('deco_partout')}</button>
    </div>`;
}
window.enregistrerResto = async ()=>{
  const tva = parseFloat($('#r-tva').value||'0');
  await fetch(`/restaurants/${restoActif}`, {method:'PATCH', headers:H(), body:JSON.stringify({tva_taux:isNaN(tva)?0:tva})});
  await demarrer(); onglet='reglages'; appliquer();
};
window.changerMdp = async ()=>{
  $('#s-err').textContent='';
  const ancien=$('#s-ancien').value, nouveau=$('#s-nouveau').value;
  if(nouveau.length<8){ $('#s-err').textContent=t('err_court'); return; }
  const r = await fetch('/auth/mot-de-passe', {method:'POST', headers:H(), body:JSON.stringify({ancien, nouveau})});
  if(r.status===403){ $('#s-err').textContent=t('mdp_faux'); return; }
  if(!r.ok){ $('#s-err').textContent=t('err_court'); return; }
  session = (await r.json()).session; localStorage.setItem('resto_session', session);  // garder l'appareil courant
  alert(t('mdp_change')); vueReglages();
};
window.decoPartout = async ()=>{
  const r = await fetch('/auth/deconnexion-partout', {method:'POST', headers:H()});
  if(r.ok){ session=(await r.json()).session; localStorage.setItem('resto_session', session); alert(t('deco_partout_ok')); }
};

// Temps réel admin : nouvelle commande / paiement → rafraîchir l'addition ou la cuisine ouverte.
function brancherWS(){
  if(wsAdmin){ try{ wsAdmin.close(); }catch(e){} }
  const proto = location.protocol==='https:'?'wss':'ws';
  wsAdmin = new WebSocket(`${proto}://${location.host}/ws/cuisine/${restoActif}?session=${encodeURIComponent(session)}`);
  wsAdmin.onmessage = ()=>{ if(onglet==='additions') chargerAddition(); };
  wsAdmin.onclose = ()=> setTimeout(()=>{ if(session) brancherWS(); }, 3000);
}

// ── Boot ─────────────────────────────────────────────────────
if(session) demarrer(); else ecran();
</script>
