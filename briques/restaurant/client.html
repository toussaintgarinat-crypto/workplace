<!DOCTYPE html>
<!-- App CLIENT — ouverte par le QR de la table. Aucune connexion : le code de table
     (dans l'URL) sert de capability. UX multi-pages (S81) : Carte (accueil tuiles de
     catégories + recherche → fiche plat) · Panier (récap par convive) · Addition.
     MULTI-CONVIVE : plusieurs convives par appareil, « pour qui » choisi à chaque ajout
     → fin du « tout sur une personne ». Paiement de SA part (mock honnête, incrément 1).
     Temps réel via WebSocket. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Commander à table</title>
<style>
  :root { --bg:#0f1420; --carte:#1a2030; --bord:#2a3346; --texte:#e8edf6; --doux:#94a3b8;
          --accent:#ff8a5b; --accent2:#7c83ff; --ok:#34d399; --attente:#fbbf24; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--texte); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom:84px; }
  header { padding:16px 18px 8px; position:sticky; top:0; background:linear-gradient(180deg,var(--bg) 78%,transparent); z-index:5; }
  .resto { font-size:1.3rem; font-weight:700; }
  .sous { color:var(--doux); font-size:.88rem; margin-top:2px; }
  .lang { position:absolute; top:16px; right:18px; display:flex; gap:4px; }
  .lang button { background:var(--carte); border:1px solid var(--bord); color:var(--doux); border-radius:8px; padding:4px 9px; font-size:.75rem; cursor:pointer; }
  .lang button.on { color:var(--accent); border-color:var(--accent); }
  main { padding:0 18px; }

  /* Recherche */
  .rech { position:relative; margin:4px 0 14px; }
  .rech input { width:100%; padding:12px 14px 12px 40px; border-radius:12px; border:1px solid var(--bord); background:var(--carte); color:var(--texte); font-size:1rem; }
  .rech::before { content:"🔎"; position:absolute; left:13px; top:50%; transform:translateY(-50%); font-size:.95rem; opacity:.7; }

  /* Tuiles de catégories (accueil carte) */
  .tuiles { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tuile { background:var(--carte); border:1px solid var(--bord); border-radius:16px; padding:18px 14px; cursor:pointer; min-height:96px; display:flex; flex-direction:column; justify-content:space-between; transition:border-color .15s; }
  .tuile:active { border-color:var(--accent2); }
  .tuile .nom { font-weight:700; font-size:1.05rem; }
  .tuile .cpt { color:var(--doux); font-size:.8rem; margin-top:6px; }

  /* En-tête de page catégorie */
  .barre-retour { display:flex; align-items:center; gap:10px; margin:2px 0 12px; }
  .retour { background:var(--carte); border:1px solid var(--bord); color:var(--texte); border-radius:10px; padding:8px 12px; font-weight:700; cursor:pointer; }
  .barre-retour .titre { font-weight:800; font-size:1.05rem; }

  /* Lignes de plat (liste catégorie / recherche) */
  .plat { background:var(--carte); border:1px solid var(--bord); border-radius:14px; padding:13px; margin-bottom:11px; display:flex; gap:12px; align-items:center; cursor:pointer; }
  .plat img { width:58px; height:58px; border-radius:10px; object-fit:cover; flex:none; background:#0d1119; }
  .plat .nom { font-weight:600; }
  .plat .desc { color:var(--doux); font-size:.82rem; margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .plat .prix { color:var(--accent); font-weight:700; margin-top:4px; font-size:.92rem; }
  .chev { margin-left:auto; color:var(--doux); font-size:1.3rem; flex:none; }
  .badge-jour { display:inline-block; font-size:.64rem; font-weight:700; color:#0f1420; background:var(--accent); border-radius:6px; padding:1px 6px; margin-left:6px; vertical-align:middle; }
  .cat-titre { font-size:.78rem; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--doux); margin:14px 4px 8px; }

  /* Panier */
  .conv { background:var(--carte); border:1px solid var(--bord); border-radius:14px; padding:14px; margin-bottom:12px; }
  .conv.moi { border-color:var(--accent); }
  .conv .tete { display:flex; justify-content:space-between; align-items:center; font-weight:700; margin-bottom:8px; }
  .conv .tete .actions { display:flex; gap:6px; }
  .conv .tete .actions button { background:transparent; border:1px solid var(--bord); color:var(--doux); border-radius:8px; padding:4px 8px; font-size:.75rem; cursor:pointer; }
  .lp { display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--bord); }
  .lp:first-of-type { border-top:none; }
  .lp .info { flex:1; min-width:0; }
  .lp .info .n { font-size:.92rem; }
  .lp .info .note { color:var(--doux); font-size:.76rem; font-style:italic; margin-top:1px; }
  .lp .pp { color:var(--accent); font-weight:700; font-size:.85rem; min-width:62px; text-align:right; }
  .pl { display:flex; align-items:center; gap:8px; }
  .pl button { width:32px; height:32px; border-radius:9px; border:none; background:var(--accent2); color:#fff; font-size:1.15rem; cursor:pointer; }
  .pl .q { min-width:18px; text-align:center; font-weight:700; }
  .conv .sst { display:flex; justify-content:space-between; margin-top:10px; font-weight:700; }
  .ajout-conv { width:100%; padding:12px; border:1px dashed var(--bord); border-radius:12px; background:transparent; color:var(--doux); font-weight:700; cursor:pointer; margin-bottom:14px; }

  /* Addition */
  .conv .ligne { display:flex; justify-content:space-between; color:var(--doux); font-size:.88rem; margin-top:4px; }
  .etat { font-size:.78rem; font-weight:700; padding:2px 8px; border-radius:6px; }
  .etat.ok { color:var(--ok); background:rgba(52,211,153,.12); }
  .etat.att { color:var(--attente); background:rgba(251,191,36,.12); }
  .tva-ligne { display:flex; justify-content:space-between; color:var(--doux); font-size:.8rem; margin:2px 4px; }
  .tips { display:flex; gap:8px; margin-top:10px; }
  .tips button { flex:1; padding:9px; border-radius:9px; border:1px solid var(--bord); background:transparent; color:var(--doux); font-weight:700; cursor:pointer; }
  .tips button.on { color:var(--accent); border-color:var(--accent); }
  .conv.repartir { border-style:dashed; }
  .conv .sous { color:var(--doux); font-size:.85rem; margin:-2px 0 4px; }
  .seg { display:flex; gap:8px; margin-top:8px; }
  .seg button { flex:1; padding:10px; border-radius:9px; border:1px solid var(--bord); background:transparent; color:var(--doux); font-weight:700; cursor:pointer; }
  .seg button.on { color:var(--accent); border-color:var(--accent); }
  .rond { width:32px; height:32px; border-radius:50%; border:1px solid var(--bord); background:transparent; color:var(--texte); font-weight:800; cursor:pointer; }
  .conv .ligne input { background:var(--fond); border:1px solid var(--bord); border-radius:8px; color:var(--texte); padding:6px 8px; }
  .conv.avis .etoiles { display:flex; gap:4px; margin:8px 0; }
  .conv.avis .etoile { background:none; border:none; font-size:2rem; line-height:1; color:var(--bord); cursor:pointer; padding:0; transition:color .1s; }
  .conv.avis .etoile.on { color:#f5b301; }
  .conv.avis textarea { width:100%; box-sizing:border-box; background:var(--fond); border:1px solid var(--bord); border-radius:8px; color:var(--texte); padding:8px; font:inherit; resize:vertical; }
  .conv.avis .merci { color:var(--accent); font-weight:700; padding:6px 0; }
  .recap { display:flex; justify-content:space-between; font-size:1.1rem; font-weight:800; margin:16px 4px; }
  .demo { font-size:.74rem; color:var(--attente); text-align:center; margin-top:8px; }

  .vide { color:var(--doux); text-align:center; padding:48px 12px; }
  .gros { width:100%; padding:15px; border:none; border-radius:12px; background:var(--accent); color:#0f1420; font-weight:800; font-size:1.05rem; cursor:pointer; }
  .gros:disabled { opacity:.4; }
  /* Flotte JUSTE AU-DESSUS du bottom-nav (≈62px) — sinon le nav intercepte le clic. */
  .barre-bas { position:fixed; bottom:calc(62px + env(safe-area-inset-bottom)); left:0; right:0; padding:10px 18px; z-index:9; }

  /* Bottom-nav */
  .nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--carte); border-top:1px solid var(--bord); padding-bottom:env(safe-area-inset-bottom); z-index:8; }
  .nav button { flex:1; background:transparent; border:none; color:var(--doux); padding:9px 0 11px; font-size:.72rem; font-weight:700; cursor:pointer; position:relative; }
  .nav button .ic { display:block; font-size:1.3rem; margin-bottom:2px; }
  .nav button.on { color:var(--accent); }
  .nav .pastille { position:absolute; top:4px; left:50%; margin-left:6px; background:var(--accent); color:#0f1420; font-size:.66rem; font-weight:800; border-radius:10px; min-width:17px; height:17px; line-height:17px; padding:0 4px; }

  /* Modale (fiche plat + nom convive) */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.62); display:flex; align-items:flex-end; justify-content:center; z-index:20; }
  .modal .boite { background:var(--carte); border:1px solid var(--bord); border-radius:18px 18px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom)); width:100%; max-width:480px; max-height:90vh; overflow:auto; }
  .modal.centre { align-items:center; padding:24px; }
  .modal.centre .boite { border-radius:16px; max-width:340px; }
  .modal h3 { margin:0 0 6px; }
  .modal .photo { width:100%; height:170px; object-fit:cover; border-radius:12px; background:#0d1119; margin-bottom:12px; }
  .modal .pdesc { color:var(--doux); font-size:.9rem; margin:0 0 14px; }
  .modal .label { font-size:.74rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--doux); margin:14px 0 7px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { padding:9px 13px; border-radius:10px; border:1px solid var(--bord); background:transparent; color:var(--texte); cursor:pointer; font-weight:600; }
  .chip.on { border-color:var(--accent); color:var(--accent); }
  .chip .cp { color:var(--accent); font-weight:700; margin-left:6px; font-size:.85rem; }
  .modal select, .modal input, .modal textarea { width:100%; padding:12px; border-radius:11px; border:1px solid var(--bord); background:var(--bg); color:var(--texte); font-size:1rem; font-family:inherit; }
  .modal textarea { min-height:54px; resize:vertical; }
  .qte { display:flex; align-items:center; gap:14px; }
  .qte button { width:42px; height:42px; border-radius:11px; border:none; background:var(--accent2); color:#fff; font-size:1.4rem; cursor:pointer; }
  .qte .v { font-size:1.3rem; font-weight:800; min-width:24px; text-align:center; }
  .modal .pied { display:flex; gap:10px; margin-top:20px; }
  .modal .pied .annul { flex:none; width:auto; padding:15px 18px; background:transparent; border:1px solid var(--bord); color:var(--doux); border-radius:12px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<div class="lang"><button data-l="fr">FR</button><button data-l="en">EN</button></div>
<header>
  <div class="resto" id="resto">…</div>
  <div class="sous" id="sous"></div>
</header>
<main id="vue"></main>

<!-- Barre d'action contextuelle (bouton Commander dans le panier) -->
<div class="barre-bas" id="barre-bas" style="display:none">
  <button class="gros" id="commander"></button>
</div>

<!-- Bottom-nav -->
<nav class="nav">
  <button data-t="carte"><span class="ic">📖</span><span class="lib">Carte</span></button>
  <button data-t="panier"><span class="ic">🛒</span><span class="lib">Panier</span><span class="pastille" id="pastille" style="display:none">0</span></button>
  <button data-t="addition"><span class="ic">🧾</span><span class="lib">Addition</span></button>
</nav>

<!-- Fiche plat -->
<div class="modal" id="modal-fiche" style="display:none"><div class="boite" id="fiche-corps"></div></div>

<!-- Porte de session (S82 : démarrer / rejoindre la table par code) -->
<div class="modal centre" id="modal-porte" style="display:none"><div class="boite" id="porte-corps"></div></div>

<!-- Nom de convive -->
<div class="modal centre" id="modal-nom" style="display:none">
  <div class="boite">
    <h3 id="m-titre"></h3>
    <p class="pdesc" id="m-sous"></p>
    <input id="m-nom" autocomplete="off" maxlength="24">
    <button class="gros" id="m-ok" style="margin-top:12px"></button>
  </div>
</div>

<script>
const T = {
  fr: { carte:"Carte", panier:"Panier", addition:"Addition", devise:"fr-FR",
        rech:"Rechercher un plat…", aucun_resultat:"Aucun plat trouvé.",
        carte_vide:"La carte arrive…", plats:"plat", platss:"plats",
        format:"Format", pour_qui:"Pour qui ?", qte:"Quantité", notes:"Note (optionnel)",
        notes_ex:"ex. sans oignon, bien cuit…", ajouter_panier:"Ajouter au panier",
        annuler:"Annuler", nouveau_convive:"+ Nouveau convive", plat_du_jour:"Plat du jour",
        panier_vide:"Votre panier est vide. Ajoutez des plats depuis la carte.",
        commander:"Envoyer en cuisine", sous_total:"Sous-total", ajouter_convive:"+ Ajouter un convive",
        renommer:"Renommer", retirer:"Retirer", commande_envoyee:"Commande envoyée en cuisine ✓",
        qui:"Qui êtes-vous ?", qui_sous:"Prénom ou place (A, B, C…) — c'est à ce nom que va l'addition.",
        renommer_qui:"Nouveau nom", valider:"Valider",
        ma_part:"ma part", du:"Dû", paye:"Payé", reste:"Reste à payer", payer:"Payer",
        regle:"Réglé ✓", en_attente:"En attente", total_table:"Reste sur la table",
        demo:"Paiement de démonstration (aucun débit réel)", rien_addition:"Aucune commande pour l'instant.",
        dont_tva:"dont TVA", pourboire:"Pourboire", sans:"Sans", des:"dès",
        repartir:"Partager autrement", repartir_sous:"Réglez ce qu'il reste sur la table comme vous voulez :",
        rep_egal:"Partage égal", rep_libre:"Montant libre", nb_convives:"À combien partagez-vous ?",
        une_part:"Une part", payer_libre:"Payer ce montant", montant_ex:"ex. 20",
        votre_avis:"Votre avis", avis_sous:"Comment s'est passé votre repas ?",
        commentaire_ex:"Un mot pour le chef (optionnel)…", envoyer_avis:"Envoyer mon avis",
        avis_merci:"Merci pour votre avis ! 🙏",
        porte_demarrer:"Démarrer la table", porte_demarrer_sous:"Vous êtes le premier ici. Démarrez la table : vous obtiendrez un code à partager avec votre tablée.",
        porte_rejoindre:"Rejoindre la table", porte_rejoindre_sous:"Entrez le code à 4 chiffres affiché sur le téléphone qui a démarré la table.",
        porte_partage:"Partagez ce code avec votre tablée :", porte_continuer:"Continuer", porte_code_faux:"Code incorrect.", porte_code:"Code à 4 chiffres" },
  en: { carte:"Menu", panier:"Cart", addition:"Bill", devise:"en-GB",
        rech:"Search a dish…", aucun_resultat:"No dish found.",
        carte_vide:"Menu loading…", plats:"item", platss:"items",
        format:"Size", pour_qui:"For whom?", qte:"Quantity", notes:"Note (optional)",
        notes_ex:"e.g. no onion, well done…", ajouter_panier:"Add to cart",
        annuler:"Cancel", nouveau_convive:"+ New guest", plat_du_jour:"Today",
        panier_vide:"Your cart is empty. Add dishes from the menu.",
        commander:"Send to kitchen", sous_total:"Subtotal", ajouter_convive:"+ Add a guest",
        renommer:"Rename", retirer:"Remove", commande_envoyee:"Order sent to the kitchen ✓",
        qui:"Who are you?", qui_sous:"First name or seat (A, B, C…) — the bill is split under this name.",
        renommer_qui:"New name", valider:"Confirm",
        ma_part:"my share", du:"Due", paye:"Paid", reste:"Left to pay", payer:"Pay",
        regle:"Settled ✓", en_attente:"Pending", total_table:"Left on the table",
        demo:"Demo payment (no real charge)", rien_addition:"No orders yet.",
        dont_tva:"incl. VAT", pourboire:"Tip", sans:"None", des:"from",
        repartir:"Split differently", repartir_sous:"Settle what's left on the table however you like:",
        rep_egal:"Split evenly", rep_libre:"Custom amount", nb_convives:"How many are splitting?",
        une_part:"One share", payer_libre:"Pay this amount", montant_ex:"e.g. 20",
        votre_avis:"Your review", avis_sous:"How was your meal?",
        commentaire_ex:"A word for the chef (optional)…", envoyer_avis:"Send my review",
        avis_merci:"Thanks for your review! 🙏",
        porte_demarrer:"Start the table", porte_demarrer_sous:"You are the first here. Start the table: you'll get a code to share with your party.",
        porte_rejoindre:"Join the table", porte_rejoindre_sous:"Enter the 4-digit code shown on the phone that started the table.",
        porte_partage:"Share this code with your party:", porte_continuer:"Continue", porte_code_faux:"Wrong code.", porte_code:"4-digit code" }
};
let lang = localStorage.getItem('resto_lang') || 'fr';
const code = location.pathname.split('/').filter(Boolean).pop();

// État appareil ------------------------------------------------------------
let data = null, devise = 'EUR', pourboirePct = 0;
let repMode = 'egal', repNb = 2;           // répartition flexible (S83) : egal | libre, nb de convives
let avisNote = 0, avisEnvoye = false;      // avis client (S84) : note 1–5 + état d'envoi
let vue = 'carte';                         // carte | panier | addition
let ecran = 'accueil';                     // (vue carte) accueil | categorie
let categorieActive = null, recherche = '';
let panier = [];                           // {uid, plat_id, nom, prix_cents, format, q, convive, notes}
// Convives présents SUR CET APPAREIL (ce téléphone peut en porter plusieurs).
let convives = JSON.parse(localStorage.getItem('resto_convives_'+code) || 'null');
if(!Array.isArray(convives) || !convives.length){
  const ancien = localStorage.getItem('resto_moi_'+code);   // migration : ancien « moi » unique
  convives = ancien ? [ancien] : [];
}
let conviveCourant = convives[0] || '';
// Jeton d'ADHÉSION de session (S82) : prouve que cet appareil a rejoint la tablée (après
// « Démarrer » ou « Rejoindre » avec le code). Lié au numéro de session → invalidé à la clôture.
let jeton = localStorage.getItem('resto_jeton_'+code) || '';

const $ = s => document.querySelector(s);
const t = k => T[lang][k];
// En-têtes des appels client : ajoute le jeton d'adhésion si on en a un (sinon ignoré côté
// table ouverte). `json` = requête à corps JSON.
function entetes(json){
  const h = json ? {'Content-Type':'application/json'} : {};
  if(jeton) h['X-Table-Session'] = jeton;
  return h;
}
function euro(c){ return (c/100).toLocaleString(T[lang].devise, {style:'currency', currency:devise}); }
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function sauverConvives(){ localStorage.setItem('resto_convives_'+code, JSON.stringify(convives)); }

// Langue -------------------------------------------------------------------
function appliquerLangue(){
  document.documentElement.lang = lang;
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on', b.dataset.l===lang));
  document.querySelectorAll('.nav button').forEach(b=> b.querySelector('.lib').textContent = t(b.dataset.t));
  rendre();
}
document.querySelectorAll('.lang button').forEach(b=> b.onclick = ()=>{ lang=b.dataset.l; localStorage.setItem('resto_lang',lang); appliquerLangue(); });

// Chargement ---------------------------------------------------------------
async function charger(){
  const r = await fetch('/t/'+code);
  if(!r.ok){ $('#resto').textContent = 'QR invalide'; return; }
  data = await r.json();
  devise = (data.restaurant.devise)||'EUR';
  $('#resto').textContent = data.restaurant.nom || 'Restaurant';
  $('#sous').textContent = 'Table '+ (data.table.numero||'');
  appliquerLangue();
  gererPorte();
}

// ── Porte de session (S82) ────────────────────────────────────────────────
// Si le restaurant exige un code, l'appareil doit DÉMARRER (1er) ou REJOINDRE (avec le
// code) la tablée avant de commander/régler. Table ouverte (défaut) → aucune porte.
function porteNecessaire(){
  if(!data || !data.session || !data.session.pin_requis) return false;
  const sj = parseInt(localStorage.getItem('resto_sess_'+code)||'0', 10);
  return !(jeton && sj === data.session.session_id);   // jeton manquant ou périmé (autre session)
}
function fermerPorte(){ $('#modal-porte').style.display='none'; }
function memoriserJeton(j, sessionId){
  jeton = j; localStorage.setItem('resto_jeton_'+code, j);
  localStorage.setItem('resto_sess_'+code, String(sessionId));
}
function gererPorte(){
  if(!data || !data.session) return;
  if(!data.session.pin_requis){ jeton=''; localStorage.removeItem('resto_jeton_'+code); fermerPorte(); return; }
  if(!porteNecessaire()){ fermerPorte(); return; }
  ouvrirPorte();
}
function ouvrirPorte(){
  const demarree = data.session.demarree;
  const corps = demarree
    ? `<h3>${t('porte_rejoindre')}</h3><p class="pdesc">${t('porte_rejoindre_sous')}</p>
       <div class="err" id="porte-err" style="color:#fbbf24;min-height:18px;font-size:.85rem"></div>
       <input id="porte-code" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="${t('porte_code')}" style="text-align:center;letter-spacing:.3em;font-size:1.3rem">
       <button class="gros" id="porte-ok" style="margin-top:12px">${t('porte_rejoindre')}</button>`
    : `<h3>${t('porte_demarrer')}</h3><p class="pdesc">${t('porte_demarrer_sous')}</p>
       <button class="gros" id="porte-ok">${t('porte_demarrer')}</button>`;
  $('#porte-corps').innerHTML = corps;
  $('#modal-porte').style.display='flex';
  $('#porte-ok').onclick = demarree ? rejoindreTable : demarrerTable;
  if(demarree){ const i=$('#porte-code'); i.focus(); i.addEventListener('keydown', e=>{ if(e.key==='Enter') rejoindreTable(); }); }
}
async function demarrerTable(){
  const r = await fetch('/t/'+code+'/demarrer', {method:'POST'});
  if(!r.ok){ await charger(); return; }   // déjà démarrée entre-temps → bascule en « rejoindre »
  const d = await r.json();
  memoriserJeton(d.jeton, d.session_id);
  if(data.session) data.session.demarree = true;   // l'état local suffit : pas de re-`charger` (il refermerait l'écran)
  if(d.pin){
    // Affiche le code à partager ; l'écran reste jusqu'à « Continuer ».
    $('#porte-corps').innerHTML = `<h3>${t('porte_partage')}</h3>
      <div style="text-align:center;font-size:2.6rem;font-weight:800;letter-spacing:.35em;color:var(--accent);margin:18px 0">${esc(d.pin)}</div>
      <button class="gros" onclick="fermerPorte()">${t('porte_continuer')}</button>`;
  } else { fermerPorte(); }
}
async function rejoindreTable(){
  const code_pin = ($('#porte-code')?.value||'').trim();
  const r = await fetch('/t/'+code+'/rejoindre', {method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pin:code_pin})});
  if(!r.ok){ const e=$('#porte-err'); if(e) e.textContent=t('porte_code_faux'); return; }
  const d = await r.json();
  memoriserJeton(d.jeton, d.session_id);
  fermerPorte();
}
window.fermerPorte = fermerPorte;

// Helpers carte ------------------------------------------------------------
function prixAffiche(p){
  if(p.formats && p.formats.length){
    const min = Math.min(...p.formats.map(f=>f.prix_cents));
    return t('des')+' '+euro(min);
  }
  return euro(p.prix_cents);
}
function categories(){
  const m = new Map();
  data.carte.forEach(p=>{ const k = (p.categorie||'').trim() || '§'; m.set(k, (m.get(k)||0)+1); });
  return [...m.entries()];
}

// Rendu principal ----------------------------------------------------------
function rendre(){
  if(!data) return;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on', b.dataset.t===vue));
  const n = panier.reduce((s,l)=>s+l.q,0);
  $('#pastille').style.display = n ? 'block' : 'none'; $('#pastille').textContent = n;
  const barre = $('#barre-bas');
  if(vue==='panier' && panier.length){ barre.style.display='block'; $('#commander').textContent = t('commander'); }
  else barre.style.display='none';
  if(vue==='carte') $('#vue').innerHTML = vueCarte();
  else if(vue==='panier') $('#vue').innerHTML = vuePanier();
  else { $('#vue').innerHTML = `<div id="addition-corps"><div class="vide">…</div></div>`; chargerAddition(); }
}

// ── Vue CARTE (accueil tuiles + recherche + page catégorie) ──────────────
function vueCarte(){
  if(!data.carte.length) return `<div class="vide">${t('carte_vide')}</div>`;
  const rech = `<div class="rech"><input id="q" placeholder="${t('rech')}" value="${esc(recherche)}"></div>`;
  // Recherche active → liste plate de tous les plats correspondants.
  if(recherche.trim()){
    const q = recherche.trim().toLowerCase();
    const trouve = data.carte.filter(p=> (p.nom||'').toLowerCase().includes(q) || (p.description||'').toLowerCase().includes(q));
    const liste = trouve.length ? trouve.map(ligneePlat).join('') : `<div class="vide">${t('aucun_resultat')}</div>`;
    return rech + liste;
  }
  // Page d'une catégorie.
  if(ecran==='categorie' && categorieActive!==null){
    const plats = data.carte.filter(p=> ((p.categorie||'').trim()||'§')===categorieActive);
    const titre = categorieActive==='§' ? t('carte') : categorieActive;
    return rech + `<div class="barre-retour"><button class="retour" onclick="retourAccueil()">‹</button>
      <span class="titre">${esc(titre)}</span></div>` + plats.map(ligneePlat).join('');
  }
  // Accueil : tuiles de catégories.
  const tuiles = categories().map(([k,n])=>{
    const nom = k==='§' ? t('carte') : k;
    return `<div class="tuile" onclick="ouvrirCategorie('${encodeURIComponent(k)}')">
      <div class="nom">${esc(nom)}</div><div class="cpt">${n} ${n>1?t('platss'):t('plats')}</div></div>`;
  }).join('');
  return rech + `<div class="tuiles">${tuiles}</div>`;
}
function ligneePlat(p){
  const jour = p.plat_du_jour ? `<span class="badge-jour">${t('plat_du_jour')}</span>` : '';
  const img = p.photo ? `<img src="${p.photo}" alt="">` : `<img alt="">`;
  return `<div class="plat" onclick="ouvrirFiche('${p.id}')">${img}
    <div style="flex:1;min-width:0"><div class="nom">${esc(p.nom)}${jour}</div>
    ${p.description?`<div class="desc">${esc(p.description)}</div>`:''}
    <div class="prix">${prixAffiche(p)}</div></div><div class="chev">›</div></div>`;
}
window.ouvrirCategorie = k => { categorieActive = decodeURIComponent(k); ecran='categorie'; rendre(); };
window.retourAccueil = () => { ecran='accueil'; categorieActive=null; rendre(); };

// ── Fiche plat (modale d'ajout) ──────────────────────────────────────────
let fiche = null;   // {plat, formatIdx, q, convive, notes}
window.ouvrirFiche = id => {
  const p = data.carte.find(x=>x.id===id); if(!p) return;
  fiche = { plat:p, formatIdx:0, q:1, convive:conviveCourant, notes:'' };
  $('#modal-fiche').style.display='flex'; rendreFiche();
};
function fermerFiche(){ $('#modal-fiche').style.display='none'; fiche=null; }
function rendreFiche(){
  if(!fiche) return;
  const p = fiche.plat;
  const img = p.photo ? `<img class="photo" src="${p.photo}" alt="">` : '';
  let blocFormats = '';
  if(p.formats && p.formats.length){
    blocFormats = `<div class="label">${t('format')}</div><div class="chips">` +
      p.formats.map((f,i)=>`<button class="chip ${i===fiche.formatIdx?'on':''}" onclick="ficheFormat(${i})">${esc(f.taille)}<span class="cp">${euro(f.prix_cents)}</span></button>`).join('') +
      `</div>`;
  }
  const opts = convives.map(c=>`<option value="${esc(c)}" ${c===fiche.convive?'selected':''}>${esc(c)}</option>`).join('');
  const selConv = `<div class="label">${t('pour_qui')}</div>
    <select id="f-conv" onchange="ficheConv(this.value)">${opts}<option value="__new__">${t('nouveau_convive')}</option></select>`;
  $('#fiche-corps').innerHTML = `${img}<h3>${esc(p.nom)}</h3>
    ${p.description?`<p class="pdesc">${esc(p.description)}</p>`:''}
    ${blocFormats}
    ${selConv}
    <div class="label">${t('qte')}</div>
    <div class="qte"><button onclick="ficheQ(-1)">−</button><span class="v">${fiche.q}</span><button onclick="ficheQ(1)">+</button></div>
    <div class="label">${t('notes')}</div>
    <textarea id="f-notes" placeholder="${t('notes_ex')}">${esc(fiche.notes)}</textarea>
    <div class="pied"><button class="annul" onclick="fermerFiche()">${t('annuler')}</button>
      <button class="gros" onclick="ajouterAuPanier()">${t('ajouter_panier')} · ${euro(prixFiche()*fiche.q)}</button></div>`;
}
function prixFiche(){
  const p = fiche.plat;
  if(p.formats && p.formats.length) return p.formats[fiche.formatIdx].prix_cents;
  return p.prix_cents;
}
window.ficheFormat = i => { fiche.formatIdx=i; rendreFiche(); };
window.ficheQ = d => { fiche.q = Math.max(1, fiche.q+d); rendreFiche(); };
window.ficheConv = v => {
  if(v==='__new__'){ demanderNom(t('qui'), t('qui_sous'), '', nom=>{ ajouterConvive(nom); fiche.convive=nom; rendreFiche(); }); return; }
  fiche.convive = v;
};
function ajouterAuPanier(){
  const notes = ($('#f-notes')?.value || '').trim();
  let conv = fiche.convive || conviveCourant;
  if(!conv){   // aucun convive encore : on demande le nom une fois
    demanderNom(t('qui'), t('qui_sous'), '', nom=>{ ajouterConvive(nom); fiche.convive=nom; ajouterAuPanier(); });
    return;
  }
  const p = fiche.plat;
  const f = (p.formats && p.formats.length) ? p.formats[fiche.formatIdx] : null;
  const nom = f ? `${p.nom} (${f.taille})` : p.nom;
  // Fusionne avec une ligne identique (même plat+format+convive+note).
  const cle = `${p.id}|${f?f.taille:''}|${conv}|${notes}`;
  const exist = panier.find(l=>l.uid===cle);
  if(exist) exist.q += fiche.q;
  else panier.push({uid:cle, plat_id:p.id, nom, prix_cents:prixFiche(), format:f?f.taille:'', q:fiche.q, convive:conv, notes});
  conviveCourant = conv;
  fermerFiche(); rendre();
}

// ── Vue PANIER (récap par convive) ───────────────────────────────────────
function vuePanier(){
  if(!panier.length) return `<div class="vide">${t('panier_vide')}</div>`;
  // Groupe par convive en conservant l'ordre.
  const ordre = []; const grp = {};
  panier.forEach(l=>{ if(!grp[l.convive]){ grp[l.convive]=[]; ordre.push(l.convive); } grp[l.convive].push(l); });
  const blocs = ordre.map(conv=>{
    const lignes = grp[conv].map(l=>`<div class="lp">
      <div class="info"><div class="n">${esc(l.nom)}</div>${l.notes?`<div class="note">“${esc(l.notes)}”</div>`:''}</div>
      <div class="pp">${euro(l.prix_cents*l.q)}</div>
      <div class="pl"><button onclick="panierMoins('${l.uid}')">−</button><span class="q">${l.q}</span><button onclick="panierPlus('${l.uid}')">+</button></div>
    </div>`).join('');
    const st = grp[conv].reduce((s,l)=>s+l.prix_cents*l.q,0);
    return `<div class="conv ${conv===conviveCourant?'moi':''}"><div class="tete"><span>${esc(conv)}</span>
      <div class="actions"><button onclick="renommerConvive('${esc(conv)}')">${t('renommer')}</button></div></div>
      ${lignes}<div class="sst"><span>${t('sous_total')}</span><span>${euro(st)}</span></div></div>`;
  }).join('');
  // Espace final : libère la zone couverte par la barre flottante « Envoyer en cuisine ».
  return blocs + `<button class="ajout-conv" onclick="nouveauConvive()">${t('ajouter_convive')}</button>`
    + `<div style="height:70px"></div>`;
}
window.panierPlus = uid => { const l=panier.find(x=>x.uid===uid); if(l){ l.q++; rendre(); } };
window.panierMoins = uid => { const i=panier.findIndex(x=>x.uid===uid); if(i>=0){ panier[i].q--; if(panier[i].q<=0) panier.splice(i,1); rendre(); } };

// ── Convives (gestion sur l'appareil) ────────────────────────────────────
function ajouterConvive(nom){
  nom = (nom||'').trim(); if(!nom) return;
  if(!convives.includes(nom)) convives.push(nom);
  conviveCourant = nom; sauverConvives();
}
window.nouveauConvive = () => demanderNom(t('qui'), t('qui_sous'), '', nom=>{ ajouterConvive(nom); rendre(); });
window.renommerConvive = (ancien) => demanderNom(t('renommer'), t('qui_sous'), ancien, nv=>{
  nv = (nv||'').trim(); if(!nv || nv===ancien) return;
  const i = convives.indexOf(ancien); if(i>=0) convives[i]=nv; else convives.push(nv);
  if(conviveCourant===ancien) conviveCourant=nv;
  panier.forEach(l=>{ if(l.convive===ancien){ l.convive=nv; l.uid=`${l.plat_id}|${l.format}|${nv}|${l.notes}`; } });
  sauverConvives(); rendre();
});

// ── Commander ─────────────────────────────────────────────────────────────
$('#commander').onclick = async () => {
  if(!panier.length) return;
  const plats = panier.map(l=>({plat_id:l.plat_id, quantite:l.q, format:l.format, convive:l.convive, notes:l.notes}));
  const r = await fetch('/t/'+code+'/commander', {method:'POST', headers:entetes(true),
    body:JSON.stringify({convive:conviveCourant, plats})});
  if(r.ok){ panier=[]; vue='addition'; alert(t('commande_envoyee')); rendre(); }
  else if(r.status===403){ await charger(); }   // session fermée/changée → re-rejoindre la table
};

// ── Vue ADDITION ──────────────────────────────────────────────────────────
async function chargerAddition(){
  const r = await fetch('/t/'+code+'/addition', {headers:entetes(false)});
  if(r.status===403){ gererPorte(); return; }   // code exigé et pas (encore) rejoint
  const e = await r.json();
  const corps = $('#addition-corps'); if(!corps) return;
  if(!e.convives.length){ corps.innerHTML = `<div class="vide">${t('rien_addition')}</div>`; return; }
  corps.innerHTML = e.convives.map(c=>{
    const aMoi = convives.includes(c.convive);   // ce convive est-il porté par cet appareil ?
    const det = c.details.map(d=>`<div class="ligne"><span>${d.quantite}× ${esc(d.nom_plat)}${d.notes?` · “${esc(d.notes)}”`:''}</span><span>${euro(d.prix_cents*d.quantite)}</span></div>`).join('');
    const etat = c.regle ? `<span class="etat ok">${t('regle')}</span>` : `<span class="etat att">${t('en_attente')}</span>`;
    let bloc = '';
    if(aMoi && !c.regle){
      const opts = [0,5,10,15];
      const tips = opts.map(p=>{
        const lib = p===0 ? t('sans') : '+'+p+'%';
        return `<button class="${pourboirePct===p?'on':''}" onclick="setTip(${p})">${lib}</button>`;
      }).join('');
      const tip = Math.round(c.reste_cents*pourboirePct/100);
      bloc = `<div class="tips">${tips}</div>
        <button class="gros" style="margin-top:10px" onclick="payer('${esc(c.convive)}',${c.reste_cents})">${t('payer')} · ${euro(c.reste_cents+tip)}</button>
        <div class="demo">${t('demo')}</div>`;
    }
    return `<div class="conv ${aMoi?'moi':''}"><div class="tete"><span>${esc(c.convive)}${aMoi?' · '+t('ma_part'):''}</span>${etat}</div>
      ${det}<div class="ligne" style="margin-top:8px;color:var(--texte);font-weight:700"><span>${t('du')}</span><span>${euro(c.du_cents)}</span></div>
      ${c.pourboire_cents?`<div class="ligne"><span>${t('pourboire')}</span><span>${euro(c.pourboire_cents)}</span></div>`:''}
      ${bloc}</div>`;
  }).join('')
  + (e.reste_cents > 0 ? panneauRepartition(e) : '')
  + (e.tva && e.tva.tva_cents ? `<div class="tva-ligne"><span>${t('dont_tva')} (${e.tva.tva_taux}%)</span><span>${euro(e.tva.tva_cents)}</span></div>` : '')
  + `<div class="recap"><span>${t('total_table')}</span><span>${euro(e.reste_cents)}</span></div>`
  + carteAvis();
}

// Avis client (S84) : note 1–5 étoiles + commentaire, déposé via le QR de la table.
function carteAvis(){
  if(avisEnvoye) return `<div class="conv avis"><div class="tete"><span>${t('votre_avis')}</span></div>
    <div class="merci">${t('avis_merci')}</div></div>`;
  const etoiles = [1,2,3,4,5].map(n=>
    `<button class="etoile ${avisNote>=n?'on':''}" onclick="setNote(${n})" aria-label="${n}">★</button>`).join('');
  return `<div class="conv avis"><div class="tete"><span>${t('votre_avis')}</span></div>
    <div class="sous">${t('avis_sous')}</div>
    <div class="etoiles">${etoiles}</div>
    <textarea id="avis-com" rows="2" placeholder="${t('commentaire_ex')}"></textarea>
    <button class="gros" style="margin-top:10px" ${avisNote?'':'disabled'} onclick="envoyerAvis()">${t('envoyer_avis')}</button></div>`;
}
window.setNote = n => { avisNote = n; chargerAddition(); };
window.envoyerAvis = async () => {
  if(!avisNote) return;
  const commentaire = ($('#avis-com')||{}).value || '';
  const convive = conviveCourant || convives[0] || '';
  const r = await fetch('/t/'+code+'/avis', {method:'POST', headers:entetes(true),
    body:JSON.stringify({convive, note:avisNote, commentaire})});
  if(r.ok){ avisEnvoye = true; chargerAddition(); }
};

// Répartition flexible (S83) : régler le reste de la table autrement que « chacun ses plats ».
function panneauRepartition(e){
  const part = Math.ceil(e.reste_cents / Math.max(1, repNb));   // aperçu d'une part égale
  return `<div class="conv repartir"><div class="tete"><span>${t('repartir')}</span></div>
    <div class="sous">${t('repartir_sous')}</div>
    <div class="seg">
      <button class="${repMode==='egal'?'on':''}" onclick="setRepMode('egal')">${t('rep_egal')}</button>
      <button class="${repMode==='libre'?'on':''}" onclick="setRepMode('libre')">${t('rep_libre')}</button>
    </div>
    ${repMode==='egal' ? `
      <div class="ligne" style="margin-top:10px"><span>${t('nb_convives')}</span>
        <span><button class="rond" onclick="setRepNb(-1)">−</button> <b>${repNb}</b> <button class="rond" onclick="setRepNb(1)">＋</button></span></div>
      <button class="gros" style="margin-top:10px" onclick="payerEgal()">${t('une_part')} · ${euro(Math.min(part, e.reste_cents))}</button>`
    : `
      <div class="ligne" style="margin-top:10px"><span>${t('rep_libre')}</span>
        <input id="rep-montant" inputmode="decimal" placeholder="${t('montant_ex')}" style="width:90px;text-align:right">&nbsp;€</div>
      <button class="gros" style="margin-top:10px" onclick="payerLibre()">${t('payer_libre')}</button>`}
    <div class="demo">${t('demo')}</div></div>`;
}
window.setRepMode = m => { repMode = m; chargerAddition(); };
window.setRepNb = d => { repNb = Math.max(1, repNb + d); chargerAddition(); };
window.payerEgal = () => paiementReparti({mode:'egal', parts:repNb});
window.payerLibre = () => {
  const v = parseFloat(($('#rep-montant')||{}).value); if(!v || v<=0) return;
  paiementReparti({mode:'libre', montant_cents: Math.round(v*100)});
};
async function paiementReparti(extra){
  const convive = conviveCourant || convives[0] || '';
  await fetch('/t/'+code+'/payer', {method:'POST', headers:entetes(true),
    body:JSON.stringify(Object.assign({convive, pourboire_cents:0}, extra))});
  chargerAddition();
}
window.setTip = p => { pourboirePct = p; chargerAddition(); };
window.payer = async (convive, reste) => {
  const tip = Math.round((reste||0)*pourboirePct/100);
  await fetch('/t/'+code+'/payer', {method:'POST', headers:entetes(true),
    body:JSON.stringify({convive, pourboire_cents:tip})});
  pourboirePct = 0; chargerAddition();
};

// ── Modale de nom (création / renommage d'un convive) ─────────────────────
let _apresNom = null;
function demanderNom(titre, sous, valeur, apres){
  $('#m-titre').textContent = titre; $('#m-sous').textContent = sous;
  $('#m-ok').textContent = t('valider'); $('#m-nom').value = valeur || '';
  _apresNom = apres; $('#modal-nom').style.display='flex'; $('#m-nom').focus();
}
$('#m-ok').onclick = () => {
  const v = $('#m-nom').value.trim(); if(!v) return;
  $('#modal-nom').style.display='none';
  const cb = _apresNom; _apresNom=null; if(cb) cb(v);
};

// ── Bottom-nav ─────────────────────────────────────────────────────────────
document.querySelectorAll('.nav button').forEach(b=> b.onclick = ()=>{
  vue = b.dataset.t; if(vue==='carte'){ recherche=''; ecran='accueil'; categorieActive=null; }
  rendre();
});

// Recherche (délégation : l'input est recréé à chaque rendu).
document.addEventListener('input', e=>{ if(e.target.id==='q'){ recherche = e.target.value; const pos = e.target.selectionStart;
  rendre(); const q=$('#q'); if(q){ q.focus(); try{ q.setSelectionRange(pos,pos); }catch(_){} } } });

// ── Temps réel ─────────────────────────────────────────────────────────────
async function rechargerCarte(){
  const r = await fetch('/t/'+code); if(!r.ok) return;
  const d = await r.json(); data.carte = d.carte;
  const ids = new Set(d.carte.map(p=>p.id));
  panier = panier.filter(l=> ids.has(l.plat_id));   // purge les plats devenus indisponibles
  rendre();
}
function brancherWS(){
  const proto = location.protocol==='https:'?'wss':'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws/t/${code}`);
  ws.onmessage = (ev) => {
    let m = {}; try { m = JSON.parse(ev.data); } catch(e){}
    if(m.type==='rupture' || m.type==='carte_modifiee'){ rechargerCarte(); return; }
    if(m.type==='session'){ charger(); return; }   // un autre appareil a démarré/clôturé la table
    if(vue==='addition') chargerAddition();
  };
  ws.onclose = () => setTimeout(brancherWS, 3000);
}

charger().then(brancherWS);
</script>
