services:
  jeu-factions:
    build: .
    container_name: workplace_jeu_factions
    image: workplace/jeu-factions:0.1.0
    env_file:
      - path: ../../.env
        required: false
    ports:
      - "6210:6210"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=6210
      - PERSONNAGES_URL=http://host.docker.internal:5900
      - JEU_FACTIONS_DB=/data/jeu_factions.db
      - TICK_INTERVAL_HOURS=24
      - COMBAT_TICK_HZ=10
      - JEU_FACTIONS_INSTANCE_CAPACITE=30
      - COMBAT_INSTANCE_GRACE_S=30
      - COMBAT_BOSS_RESPAWN_S=60
      - COMBAT_ARENE_TAILLE=800
    volumes:
      - jeu_factions_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6210/sante')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  jeu_factions_data:
