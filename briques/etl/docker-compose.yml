services:
  etl:
    build: .
    image: workplace-etl:0.1.0
    container_name: workplace-etl
    env_file:
      # Réglages partagés (ETL_API_KEYS, CORS_ORIGINS) — source unique à la racine.
      #
      # AUCUN bloc `environment:` ici, et c'est délibéré : `VAR=${VAR:-defaut}` s'interpole
      # depuis le shell / le `.env` du dossier du compose, JAMAIS depuis `env_file` — donc
      # une telle ligne ÉCRASE la valeur du .env racine par le défaut (piège « env shadow »,
      # cf. fix-env-shadow-composes). Vu en vrai sur le HP au déploiement du S211 : un
      # `CORS_ORIGINS=${CORS_ORIGINS:-*}` mettait la brique en `*` alors que le .env racine
      # déclarait une liste restreinte. Les deux variables sont lues telles quelles par le
      # code, avec ses propres défauts (`CORS_ORIGINS` → `*`, `ETL_API_KEYS` vide → ouverte).
      - path: ../../.env
        required: false
    ports:
      - "5200:5200"
    volumes:
      - etl_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5200/sante')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  etl_data:
