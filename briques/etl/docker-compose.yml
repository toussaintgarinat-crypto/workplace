services:
  etl:
    build: .
    image: workplace-etl:0.1.0
    container_name: workplace-etl
    env_file:
      # Secrets partagés (API_KEYS, ETL_KEY, CORS_ORIGINS) — source unique à la racine.
      - path: ../../.env
        required: false
    ports:
      - "5200:5200"
    environment:
      # API_KEYS et ETL_KEY : ABSENTS de `environment` exprès — ils viennent du .env
      # racine via env_file (piège « env shadow » : `VAR=${VAR:-}` s'interpole depuis le
      # shell / le .env du dossier courant, PAS depuis env_file, et écraserait par du
      # vide, cf. fix-env-shadow-composes). API_KEYS vide = brique ouverte (dev).
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      - etl_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5200/sante')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  etl_data:
