services:
  etl:
    build: .
    image: workplace-etl:0.1.0
    container_name: workplace-etl
    ports:
      - "5200:5200"
    volumes:
      - etl_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5200/sante')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  etl_data:
