server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # API legacy /api/* ET canonique /v1/* (S99 versioning : la SPA réécrit
  # /api/x → /v1/api/x côté client). Les deux préfixes sont proxy-fiés vers le
  # core Forge. Dans la brique Workplace (S19) le core s'appelle `forge` mais est
  # exposé sous l'alias réseau `core` (cf. docker-compose de la brique) → ce nom
  # reste valable en standalone comme en brique.
  location /api/ {
    resolver 127.0.0.11 valid=30s;
    set $backend http://core:8600;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
  }

  location /v1/ {
    resolver 127.0.0.11 valid=30s;
    set $backend http://core:8600;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
  }
}
