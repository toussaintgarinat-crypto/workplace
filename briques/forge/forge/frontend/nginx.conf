server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # S130 — Proxy Keycloak same-origin.
  # KC_HOSTNAME_STRICT=false + KC_PROXY=edge côté Keycloak → iss dérivé de
  # X-Forwarded-Host. Depuis le mesh (Caddy :13000 → nginx :80), $host vaut
  # 100.124.248.226:13000 ; X-Forwarded-Proto: https (posé par Caddy).
  # Le backend forge core continue de parler à localhost:8081 directement.
  # `host.docker.internal` est un alias /etc/hosts statique (extra_hosts, fixé
  # au démarrage du conteneur) — PAS un nom résolu par le DNS Docker (127.0.0.11).
  # proxy_pass en variable + `resolver` l'ignore complètement (échoue en 502) :
  # cible littérale ici pour que nginx la résolve via le résolveur système (glibc,
  # lit /etc/hosts) au chargement de la config.
  location /realms/ {
    proxy_pass http://host.docker.internal:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_hide_header X-Frame-Options;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_read_timeout 60s;
  }

  # Ressources statiques de la page de login Keycloak (CSS/JS/images).
  location /resources/ {
    proxy_pass http://host.docker.internal:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_hide_header X-Frame-Options;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # API legacy /api/* ET canonique /v1/* (S99 versioning : la SPA réécrit
  # /api/x → /v1/api/x côté client). Les deux préfixes sont proxy-fiés vers le
  # core Forge. Dans la brique Workplace (S19) le core s'appelle `forge` mais est
  # exposé sous l'alias réseau `core` (cf. docker-compose de la brique) → ce nom
  # reste valable en standalone comme en brique.
  location /api/ {
    resolver 127.0.0.11 valid=30s;
    set $backend http://core:8600;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
  }

  location /v1/ {
    resolver 127.0.0.11 valid=30s;
    set $backend http://core:8600;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
  }
}
