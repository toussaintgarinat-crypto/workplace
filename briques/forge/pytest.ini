[pytest]
# S206 — sans ce fichier, lancer `pytest` depuis la racine de la brique ignorait le
# `forge/core/pytest.ini` (pytest ne lit que la config de son rootdir) : les tests `async def`
# étaient alors collectés puis refusés en bloc — « async def functions are not natively
# supported ». La plus grosse brique du dépôt paraissait ainsi rouge alors que son code va
# bien, ce qui décrédibilise le filet.
asyncio_mode = auto
