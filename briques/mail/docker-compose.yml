services:
  mail:
    build: .
    container_name: workplace_mail
    image: workplace/mail:0.6.0   # tag épinglé (pas de :latest flottant)
    env_file:
      # Secrets/réglages partagés à la racine — source unique.
      - path: ../../.env
        required: false
    ports:
      - "6030:6030"
    extra_hosts:
      # Joindre les services hôtes sous LINUX (le HP) : `host.docker.internal` n'y existe
      # PAS d'office, contrairement à Docker Desktop. `mail` en a besoin depuis qu'il
      # appelle une autre brique — `forge` (FORGE_URL, qualification d'un lead quand un
      # destinataire répond au courrier postal) et la Gateway (GATEWAY_URL, résumés).
      # Sans cette ligne, ces appels échouent en résolution DNS ; celui vers forge est
      # best-effort (avalé en warning) : la panne serait SILENCIEUSE, le lead ne
      # passerait jamais « lead qualifié ».
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=6030
      - MAIL_DB=/data/mail.db
      # Gateway pour le résumé/brouillon (repli honnête si absente). Hérités du .env racine ;
      # ne PAS redéclarer en `=${VAR:-}` (piège « env shadow » : écraserait par du vide).
      # CORS_ORIGINS : ABSENTE d'`environment` EXPRÈS — elle vient du .env racine via
      # env_file. `${CORS_ORIGINS:-*}` s'interpole depuis le dossier du compose, PAS
      # depuis l'env_file : la ligne écrasait une liste d'origines restreinte par `*`.
      # Piège env-shadow à défaut RÉEL — sans symptôme, contrairement au défaut vide.
      # Le code a déjà `getenv("CORS_ORIGINS", "*")`. Cf. S211 / a1ccb7d.
      # API_KEYS (CSV des tenants autorisés), MAIL_VAULT_SECRET (chiffrement du mdp IMAP),
      # GATEWAY_URL/KEY/MODEL : ABSENTS du `environment` exprès — ils viennent du .env racine
      # via env_file. Sans MAIL_VAULT_SECRET : connexion IMAP refusée (mock seul). API_KEYS vide :
      # dev ouvert (tenant « public » unique).
    volumes:
      - mail_data:/data   # compte IMAP chiffré + cache des messages + brouillons
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6030/sante')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  mail_data:
