services:
  generateur:
    # Build-context = racine du monorepo pour embarquer shared/ (lib partagée S118).
    build:
      context: ../..
      dockerfile: briques/generateur/Dockerfile
    container_name: workplace_generateur
    env_file:
      # Secrets partagés (GATEWAY_KEY…) — source unique à la racine du projet.
      - path: ../../.env
        required: false
    ports:
      - "5400:5400"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # joindre les services hôtes sous Linux
    volumes:
      - generateur_data:/data
      - ../../apps_exportees:/export
      - ../donnees:/briques_src/donnees:ro
      # Bundles (S95) : sources des briques + Cœur, pour assembler une solution par
      # client à partir d'une sélection de briques. Lecture seule.
      - ../../briques:/briques_src/briques:ro
      - ../../core:/briques_src/core:ro
    environment:
      - AUDIT_URL=http://host.docker.internal:5300
      - GATEWAY_URL=http://host.docker.internal:4001
      # GATEWAY_KEY vient du .env racine (env_file ci-dessus).
      - GATEWAY_MODEL=openai/gpt-4o-mini
      - DB_PATH=/data/apps.db
      - EXPORT_DIR=/export
      - DONNEES_URL_INTERNE=http://host.docker.internal:5500
      - DONNEES_URL_PUBLIQUE=http://localhost:5500
      - DONNEES_SRC=/briques_src/donnees
      # Export PDF/PPTX du cahier des charges (S229). EXPORT_KEY (si la brique export est
      # fermée par API_KEYS) vient du .env racine via env_file — jamais redéclarée ici.
      - EXPORT_URL=http://host.docker.internal:6150
      # Bundles (S95) : racine des sources de briques montées (cf. volumes).
      - BRIQUES_SRC=/briques_src/briques
      # Pont consenti app→CRM (S24) : la brique forge (adaptateur) écrit dans le CRM
      # du cabinet via son identité de service. Aucun secret ne vit ici.
      - FORGE_URL_INTERNE=http://host.docker.internal:5700
      # Onboarding client auto (S23, bascule LIVE S28) : à la livraison, le client
      # reçoit un email Keycloak « définis ton mot de passe » dont le redirect_uri
      # DOIT figurer dans les redirectUris autorisés du client `oria-app`
      # (localhost:3003 = frontend Oria). Le défaut code `:8000` n'y est PAS et
      # provoque un 400 sur execute-actions-email — d'où ce câblage explicite.
      - ORIA_URL_PUBLIQUE=http://localhost:3003
      - ORIA_URL_INTERNE=http://host.docker.internal:8000
      - KEYCLOAK_URL_INTERNE=http://host.docker.internal:8081
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5400/sante')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  generateur_data:
