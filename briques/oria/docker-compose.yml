services:
  oria:
    build: .
    container_name: workplace_oria
    image: workplace/oria:0.1.0
    env_file:
      - path: ../../.env
        required: false
    ports:
      - "6085:6085"
    environment:
      - PORT=6085
      # CORS_ORIGINS : ABSENTE d'`environment` EXPRÈS — elle vient du .env racine via
      # env_file. `${CORS_ORIGINS:-*}` s'interpole depuis le dossier du compose, PAS
      # depuis l'env_file : la ligne écrasait une liste d'origines restreinte par `*`.
      # Piège env-shadow à défaut RÉEL — sans symptôme, contrairement au défaut vide.
      # Le code a déjà `getenv("CORS_ORIGINS", "*")`. Cf. S211 / a1ccb7d.
      - ORIA_KC_URL=${ORIA_KC_URL:-http://host.docker.internal:8081}
      - ORIA_KC_REALM=${ORIA_KC_REALM:-oria}
      - ORIA_KC_CLIENT_ID=${ORIA_KC_CLIENT_ID:-core-service}
      - ORIA_KC_CLIENT_SECRET=${ORIA_KC_CLIENT_SECRET:-core-service-secret-wp}
      - ORIA_API_URL=${ORIA_API_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6085/sante')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
