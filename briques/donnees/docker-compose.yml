services:
  donnees:
    # Build-context = racine du monorepo pour embarquer shared/ (lib partagée S120).
    build:
      context: ../..
      dockerfile: briques/donnees/Dockerfile
    container_name: workplace_donnees
    env_file:
      - path: ../../.env
        required: false
    ports:
      - "5500:5500"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # joindre les services hôtes sous Linux
    volumes:
      - donnees_data:/data
    environment:
      - DB_PATH=/data/donnees.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5500/sante')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  donnees_data:
